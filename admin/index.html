<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Admin · AGRi Elite Arena</title>
<style>

@media(prefers-color-scheme:dark){:root:not([data-t=light]){--bg:#0e1614;--card:#16211e;--fg:#e6efec;--mute:#93a6a0;--line:#26372f;--sb:#07130f}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,'Segoe UI','Hind Siliguri',sans-serif;background:var(--bg);color:var(--fg)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;background:var(--g);color:#fff}.btn.s{background:var(--card);color:var(--fg);border:1px solid var(--line)}.btn.d{background:var(--red)}.btn.g{background:var(--gold);color:#222}.btn:disabled{opacity:.5;cursor:default}aside .me .tag{background:rgba(255,255,255,.2);color:#fff}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card)}textarea{min-height:140px;resize:vertical;font-family:ui-monospace,monospace;font-size:13px}
label{display:grid;gap:4px;font-weight:600;font-size:13.5px;color:var(--mute)}
#login{min-height:100vh;display:grid;place-items:center;padding:16px}.lc{width:min(400px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;display:grid;gap:14px;box-shadow:0 10px 40px rgba(0,0,0,.08)}
.lc h1{margin:0;font-size:22px}.lc p{margin:0;color:var(--mute);font-size:14px}
#app{display:none;min-height:100vh;grid-template-columns:230px 1fr}#app.on{display:grid}
aside{background:var(--sb);color:#cfe3dc;padding:16px 10px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;overflow:auto}
aside b{color:#fff;padding:6px 10px 14px;font-size:16px}aside a{padding:9px 12px;border-radius:9px;color:inherit;text-decoration:none;cursor:pointer;display:block}aside a.on,aside a:hover{background:rgba(255,255,255,.12);color:#fff}
aside .me{margin-top:auto;font-size:12.5px;padding:10px;opacity:.85;word-break:break-all}
main{padding:20px;min-width:0}h2{margin:0 0 14px;font-size:22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.stat b{font-size:28px;display:block;color:var(--g)}.stat span{color:var(--mute);font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mute);font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}
.tag{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;background:var(--line)}.tag.published{background:#d9f3e7;color:#0a4a37}.tag.draft{background:#fff0c9;color:#7a5200}.tag.archived,.tag.under_review{background:#e5e8ee;color:#444}.tag.scheduled{background:#dbe9ff;color:#18478f}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.msg{padding:10px 12px;border-radius:10px;margin:0 0 12px;font-weight:600}.msg.e{background:#fde7e7;color:#8a1313}.msg.o{background:#e1f5e8;color:#14532d}
.empty{padding:30px;text-align:center;color:var(--mute)}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;z-index:9;padding:14px}#modal.on{display:grid}.mc{background:var(--card);border-radius:16px;padding:20px;width:min(440px,100%);display:grid;gap:14px}
iframe.pv{width:100%;height:300px;border:1px solid var(--line);border-radius:10px;background:#fff}
@media(max-width:800px){#app.on{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;gap:4px}aside b,aside .me{width:100%;padding:4px 8px}.grid2{grid-template-columns:1fr}}
</style></head><body>
<div id="login"><form class="lc" id="lf"><h1>AGRi Elite Arena · Admin</h1><p>Sign in with your admin account. Students cannot access this area.</p><div id="lmsg"></div><label>Email<input type="email" id="le" required autocomplete="username"></label><label>Password<input type="password" id="lp" required autocomplete="current-password"></label><button class="btn" id="lb">Sign in</button><div style="text-align:center;margin:14px 0 4px;opacity:.7;font-size:13px">or</div><button type="button" class="btn" id="lg" style="background:#fff;color:#1f2937;display:flex;align-items:center;justify-content:center;gap:10px;width:100%"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#ea4335" d="M24 9.500c3.500 0 6.600 1.200 9.100 3.600l6.800-6.800C35.800 2.400 30.300 0 24 0 14.600 0 6.500 5.400 2.600 13.200l7.900 6.100C12.400 13.600 17.700 9.500 24 9.500z"/><path fill="#4285f4" d="M46.500 24.500c0-1.600-.1-3.100-.4-4.500H24v9h12.700c-.6 3-2.300 5.500-4.800 7.200l7.500 5.800c4.400-4.100 7.100-10.100 7.100-17.500z"/><path fill="#fbbc05" d="M10.500 28.700c-.5-1.500-.8-3-.8-4.700s.3-3.200.8-4.700l-7.900-6.100C.9 16.400 0 20.100 0 24s.9 7.600 2.600 10.800z"/><path fill="#34a853" d="M24 48c6.500 0 11.900-2.100 15.900-5.800l-7.500-5.800c-2.100 1.400-4.800 2.300-8.400 2.300-6.300 0-11.600-4.100-13.500-9.800l-7.900 6.100C6.500 42.600 14.600 48 24 48z"/></svg>Continue with Google</button><p style="font-size:12.5px;opacity:.75;margin:10px 0 0;text-align:center">Signed up with Google? Use this button (no password needed).</p></form></div>
<div id="app"><aside id="nav"></aside><main id="main"></main></div>
<div id="modal"><div class="mc" id="mc"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../config.js"></script>
<script>
(function(){
var C=window.AGRI_CFG,$=function(i){return document.getElementById(i)};
var sb=window.supabase.createClient(C.url,C.key,{auth:{persistSession:true,autoRefreshToken:true}});
var me=null,view='overview',cache={courses:[],topics:[]};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function msg(t,ok,el){var h='<div class="msg '+(ok?'o':'e')+'">'+esc(t)+'</div>';if(el)el.innerHTML=h;return h}
function fmtd(d){return d?new Date(d).toLocaleString():''}
function confirmBox(text,yes){$('mc').innerHTML='<div>'+esc(text)+'</div><div class="row"><button class="btn d" id="cy">Yes, do it</button><button class="btn s" id="cn">Cancel</button></div>';$('modal').classList.add('on');$('cn').onclick=function(){$('modal').classList.remove('on')};$('cy').onclick=function(){$('modal').classList.remove('on');yes()}}
$('lg').onclick=async function(){this.disabled=true;var r=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/admin/'}});if(r.error){this.disabled=false;msg(r.error.message,false,$('lmsg'))}};
$('lf').onsubmit=async function(e){e.preventDefault();$('lb').disabled=true;var r=await sb.auth.signInWithPassword({email:$('le').value.trim(),password:$('lp').value});$('lb').disabled=false;if(r.error){msg(r.error.message,false,$('lmsg'));return}boot()};
async function boot(){
 var s=await sb.auth.getSession();if(!s.data.session){$('login').style.display='grid';$('app').classList.remove('on');return}
 var p=await sb.from('profiles').select('id,full_name,role,status').eq('id',s.data.session.user.id).single();
 if(p.error||!p.data||['owner','admin','editor','moderator'].indexOf(p.data.role)<0||p.data.status!=='active'){await sb.auth.signOut();$('login').style.display='grid';$('app').classList.remove('on');msg('This account does not have admin access.',false,$('lmsg'));return}
 me=p.data;me.email=s.data.session.user.email;$('login').style.display='none';$('app').classList.add('on');
 var c=await Promise.all([sb.from('courses').select('id,code,title').order('sort_order'),sb.from('topics').select('id,course_id,key,name')]);cache.courses=c[0].data||[];cache.topics=c[1].data||[];
 nav();go(location.hash.slice(2)||'overview')}
function can(a){var r=me.role;return a=='edit'?['owner','admin','editor'].indexOf(r)>-1:a=='admin'?['owner','admin'].indexOf(r)>-1:a=='mod'?['owner','admin','moderator'].indexOf(r)>-1:r=='owner'}
var MENU=[['overview','Overview','mod'],['notes','Notes','edit'],['courses','Courses','edit'],['topics','Topics','edit'],['files','PDF & Media','edit'],['mcqs','MCQ Bank','edit'],['exams','Exam Arena','edit'],['cards','Flashcards','edit'],['announce','Announcements','admin'],['feedback','Feedback','mod'],['forum','Forum','mod'],['analytics','Analytics','admin'],['seo','SEO','admin'],['backup','Backup & Restore','admin'],['users','Users & Roles','owner'],['settings','Settings','owner'],['logs','Activity Logs','admin']];
function nav(){$('nav').innerHTML='<b>AGRi Admin</b>'+MENU.filter(function(m){return can(m[2])}).map(function(m){return'<a data-v="'+m[0]+'" class="'+(m[0]==view?'on':'')+'">'+m[1]+'</a>'}).join('')+'<a href="../" style="margin-top:8px">← View site</a><div class="me">'+esc(me.email)+'<br><span class="tag">'+me.role+'</span> <a id="lo" style="display:inline;padding:2px 8px;border:1px solid #fff4;border-radius:8px">Sign out</a></div>';
 $('nav').onclick=function(e){var a=e.target.closest('a[data-v]');if(a)go(a.dataset.v);if(e.target.id=='lo')sb.auth.signOut().then(function(){location.reload()})}}
async function go(v,arg){var m=MENU.filter(function(x){return x[0]==v})[0];if(!m||!can(m[2]))v=can('mod')?'overview':'notes';view=v;location.hash='/'+v;nav();$('main').innerHTML='<div class="empty">Loading…</div>';try{await V[v](arg)}catch(e){$('main').innerHTML=msg('Error: '+(e.message||e),false)}}
async function cnt(t,f){var q=sb.from(t).select('*',{count:'exact',head:true});if(f)q=f(q);var r=await q;if(r.error)throw r.error;return r.count}
var V={};
V.overview=async function(){
 var r=await Promise.all([cnt('courses'),cnt('notes'),cnt('notes',function(q){return q.eq('status','published')}),cnt('notes',function(q){return q.eq('status','draft')}),cnt('mcqs'),cnt('files'),cnt('feedback',function(q){return q.eq('reviewed',false).eq('archived',false)}),can('admin')?cnt('profiles'):0,cnt('quiz_attempts').catch(function(){return 0})]);
 var d=await sb.from('files').select('name,downloads').order('downloads',{ascending:false}).limit(5);var n=await sb.from('notes').select('title,status,updated_at').order('updated_at',{ascending:false}).limit(6);
 var L=[['Courses',r[0]],['Notes',r[1]],['Published',r[2]],['Drafts',r[3]],['MCQs',r[4]],['Files',r[5]],['Unreviewed feedback',r[6]],['Accounts',r[7]],['Quiz attempts',r[8]]];
 $('main').innerHTML='<div class="top"><h2>Overview</h2></div><div class="cards">'+L.map(function(x){return'<div class="stat"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>'}).join('')+'</div><div class="grid2"><div class="panel"><b>Recently edited notes</b><table>'+((n.data||[]).map(function(x){return'<tr><td>'+esc(x.title).slice(0,70)+'</td><td><span class="tag '+x.status+'">'+x.status+'</span></td><td>'+fmtd(x.updated_at)+'</td></tr>'}).join('')||'<tr><td class="empty">No notes yet</td></tr>')+'</table></div><div class="panel"><b>Most downloaded files</b><table>'+((d.data||[]).map(function(x){return'<tr><td>'+esc(x.name)+'</td><td>'+x.downloads+'</td></tr>'}).join('')||'<tr><td class="empty">No files uploaded yet</td></tr>')+'</table></div></div><div id="eng"></div><div class="panel" style="font-size:13px;color:var(--mute)">All numbers are read live from your database.</div>';
 try{var since=new Date(Date.now()-7*864e5).toISOString();var e=await Promise.all([sb.from('quiz_attempts').select('user_id,score,total,created_at').gte('created_at',since).limit(5000),sb.from('study_sessions').select('user_id,minutes,created_at').gte('created_at',since).limit(5000),sb.from('profiles').select('id',{count:'exact',head:true}).gte('created_at',since)]);
 var qa=e[0].data||[],ss=e[1].data||[],act={};qa.forEach(function(x){act[x.user_id]=1});ss.forEach(function(x){act[x.user_id]=1});
 var mins=ss.reduce(function(a,x){return a+(+x.minutes||0)},0),avg=qa.length?Math.round(qa.reduce(function(a,x){return a+(x.total?x.score/x.total:0)},0)/qa.length*100):0;
 var days=[];for(var i=6;i>=0;i--){var d=new Date(Date.now()-i*864e5);days.push(d.toISOString().slice(0,10))}
 var by={};days.forEach(function(d){by[d]={}});qa.concat(ss).forEach(function(x){var d=String(x.created_at).slice(0,10);if(by[d])by[d][x.user_id]=1});
 var vals=days.map(function(d){return Object.keys(by[d]).length}),mx=Math.max.apply(null,vals.concat([1]));
 var C=[['Active students (7 days)',Object.keys(act).length],['Quizzes taken',qa.length],['Avg quiz score',avg+'%'],['Focus minutes',mins],['New sign-ups',e[2].count||0]];
 $('eng').innerHTML='<div class="panel"><b>Student engagement · last 7 days</b><div class="cards" style="margin-top:10px">'+C.map(function(x){return'<div class="stat"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>'}).join('')+'</div><div style="display:flex;gap:8px;align-items:flex-end;height:90px;margin-top:12px">'+vals.map(function(v,i){return'<div style="flex:1;text-align:center;font-size:11px;color:var(--mute)"><div style="background:linear-gradient(#14c58a,#0f6b4f);border-radius:6px 6px 0 0;height:'+Math.max(4,Math.round(v/mx*64))+'px" title="'+v+' active"></div>'+days[i].slice(5)+'</div>'}).join('')+'</div></div>'}catch(er){}
};
V.notes=async function(){
 var st={q:'',c:'',s:'',p:0},PS=25;
 async function load(){var q=sb.from('notes').select('id,title,status,verified,legacy_id,frequency,course_id,updated_at',{count:'exact'}).order('updated_at',{ascending:false}).range(st.p*PS,st.p*PS+PS-1);
  if(st.q)q=q.ilike('title','%'+st.q.replace(/[%,]/g,' ')+'%');if(st.c)q=q.eq('course_id',st.c);if(st.s)q=q.eq('status',st.s);var r=await q;if(r.error)throw r.error;
  var cm={};cache.courses.forEach(function(c){cm[c.id]=c.code});
  $('nl').innerHTML=(r.data.length?'<table><tr><th></th><th>ID</th><th>Title</th><th>Course</th><th>Status</th><th>Updated</th><th></th></tr>'+r.data.map(function(x){return'<tr><td><input type="checkbox" class="ck" data-i="'+x.id+'" style="width:auto"></td><td>'+esc(x.legacy_id)+'</td><td>'+esc(x.title).slice(0,90)+'</td><td>'+esc(cm[x.course_id]||'')+'</td><td><span class="tag '+x.status+'">'+x.status+'</span>'+(x.verified?' ✔':'')+'</td><td>'+fmtd(x.updated_at)+'</td><td><button class="btn s" data-e="'+x.id+'">Edit</button></td></tr>'}).join('')+'</table>':'<div class="empty">No notes match.</div>')+'<div class="row" style="margin-top:10px"><button class="btn s" id="pp" '+(st.p?'':'disabled')+'>← Prev</button><span>'+(r.count?(st.p*PS+1)+'–'+Math.min(r.count,st.p*PS+PS)+' of '+r.count:'0')+'</span><button class="btn s" id="pn" '+((st.p+1)*PS>=r.count?'disabled':'')+'>Next →</button></div>';
  $('pp').onclick=function(){st.p--;load()};$('pn').onclick=function(){st.p++;load()}}
 $('main').innerHTML='<div class="top"><h2>Notes</h2><button class="btn" id="nn">+ Upload New Note</button></div><div class="panel"><div class="row"><input id="fq" placeholder="Search title…" style="max-width:240px"><select id="fc" style="max-width:200px"><option value="">All courses</option>'+cache.courses.map(function(c){return'<option value="'+c.id+'">'+esc(c.code)+'</option>'}).join('')+'</select><select id="fs" style="max-width:170px"><option value="">Any status</option><option>draft</option><option>published</option><option>scheduled</option><option>under_review</option><option>archived</option></select><span style="flex:1"></span><select id="bk" style="max-width:190px"><option value="">Bulk action…</option><option value="published">Publish selected</option><option value="draft">Set to draft</option><option value="archived">Archive selected</option>'+(can('admin')?'<option value="del">Delete selected</option>':'')+'</select><button class="btn s" id="ba">Apply</button></div></div><div class="panel" id="nl"></div>';
 $('nn').onclick=function(){noteForm()};
 var tm;$('fq').oninput=function(){clearTimeout(tm);tm=setTimeout(function(){st.q=$('fq').value;st.p=0;load()},300)};$('fc').onchange=function(){st.c=this.value;st.p=0;load()};$('fs').onchange=function(){st.s=this.value;st.p=0;load()};
 $('nl').onclick=function(e){var b=e.target.closest('[data-e]');if(b)noteForm(b.dataset.e)};
 $('ba').onclick=function(){var ids=[].map.call(document.querySelectorAll('.ck:checked'),function(c){return c.dataset.i}),a=$('bk').value;if(!ids.length||!a)return alert_('Select notes and an action first.');
  if(a=='del')return confirmBox('Delete '+ids.length+' note(s) permanently? This cannot be undone.',async function(){var r=await sb.from('notes').delete().in('id',ids);r.error?alert_(r.error.message):load()});
  confirmBox('Set '+ids.length+' note(s) to "'+a+'"?',async function(){var r=await sb.from('notes').update({status:a}).in('id',ids);r.error?alert_(r.error.message):load()})};
 await load()};
function alert_(t){$('mc').innerHTML='<div>'+esc(t)+'</div><button class="btn" id="ok">OK</button>';$('modal').classList.add('on');$('ok').onclick=function(){$('modal').classList.remove('on')}}
async function noteForm(id){
 var n={status:'draft',course_id:cache.courses[0]&&cache.courses[0].id,title:'',question_bn:'',answer_html:'',marks:'',tags:[],verified:false,frequency:1,stars:0};
 if(id){var r=await sb.from('notes').select('*').eq('id',id).single();if(r.error)return alert_(r.error.message);n=r.data}
 var rv=id?(await sb.from('note_revisions').select('id,title,question_bn,answer_html,created_at').eq('note_id',id).order('created_at',{ascending:false}).limit(10)).data||[]:[];
 var fl=id?(await sb.from('files').select('id,name,path,size_bytes').eq('note_id',id)).data||[]:[];
 function topicOpts(cid,sel){return'<option value="">—</option>'+cache.topics.filter(function(t){return t.course_id==cid}).map(function(t){return'<option value="'+t.id+'"'+(t.id==sel?' selected':'')+'>'+esc(t.name)+'</option>'}).join('')}

 var r=await sb.from('site_settings').select('key,value');var S={};(r.data||[]).forEach(function(x){S[x.key]=x.value});var F=Object.assign({registration:true,maintenance:false,flashcards:true,exams:true,forum:true,ai:false,leaderboard:true},S.features||{}),CD=((S.countdown&&S.countdown.items)||[]).concat([{},{},{}]).slice(0,3),MD=((S.media&&S.media.items)||[]).concat([{},{},{},{},{},{}]).slice(0,6),G=Object.assign({title:'AGRi Elite Arena',tagline:'Smart Notes. Better Learning. Stronger Results.'},S.general||{});

 $('main').innerHTML='<div class="top"><h2>Settings</h2></div><div id="gm"></div><div class="panel"><b>Feature toggles</b>'+L.map(function(f){return'<label style="display:flex;gap:10px;align-items:center;font-weight:600;color:var(--fg);margin:8px 0"><input type="checkbox" data-f="'+f[0]+'" style="width:auto"'+(F[f[0]]?' checked':'')+'> '+f[1]+'</label>'}).join('')+'</div><div class="panel"><b>Exam countdown</b><p class="m">Shown on the home page and in the student dashboard until the date. Add a time to show a live ticking countdown to that moment. Leave a row empty to hide it.</p>'+CD.map(function(c,i){return'<div class="grid2" style="margin:6px 0"><label>Title<input id="cdt'+i+'" maxlength="80" placeholder="e.g. AGF 101 Final Exam" value="'+esc(c.title||'')+'"></label><label>Date<input type="date" id="cdd'+i+'" value="'+esc(c.date||'')+'"></label><label>Time (optional)<input type="time" id="cdh'+i+'" value="'+esc(c.time||'')+'"></label></div>'}).join('')+'</div><div class="panel"><b>Videos &amp; images (home page: “Campus life” and “Learn with video”)</b><p class="m">Paste a YouTube link, or a direct image link (for example the public link of an image you uploaded in Files). Leave a row empty to hide it. If all rows are empty the section is hidden.</p>'+MD.map(function(c,i){return'<div class="grid2" style="margin:6px 0"><label>Type<select id="mt'+i+'"><option value="video"'+(c.t==='image'?'':' selected')+'>YouTube video</option><option value="image"'+(c.t==='image'?' selected':'')+'>Image</option></select></label><label>Section<select id="mc'+i+'"><option value="campus"'+(c.c==='study'?'':' selected')+'>Campus life (university)</option><option value="study"'+(c.c==='study'?' selected':'')+'>Study video (learn)</option></select></label><label>Title<input id="mn'+i+'" maxlength="90" value="'+esc(c.title||'')+'"></label><label>Link (https://…)<input id="mu'+i+'" maxlength="400" value="'+esc(c.url||'')+'"></label></div>'}).join('')+'</div><div class="panel"><b>General</b><br><br><label>Site title<input id="g1" value="'+esc(G.title)+'"></label><br><label>Tagline<input id="g2" value="'+esc(G.tagline)+'"></label></div><button class="btn" id="g3">Save settings</button>';
 $('g3').onclick=async function(){var f={ai:false};document.querySelectorAll('[data-f]').forEach(function(c){f[c.dataset.f]=c.checked});var a=await sb.from('site_settings').upsert([{key:'features',value:f,updated_by:me.id},{key:'general',value:{title:$('g1').value.trim(),tagline:$('g2').value.trim()},updated_by:me.id},{key:'countdown',value:{items:[0,1,2].map(function(i){var o={title:$('cdt'+i).value.trim(),date:$('cdd'+i).value};if($('cdh'+i).value)o.time=$('cdh'+i).value;return o}).filter(function(x){return x.title&&x.date})},updated_by:me.id},{key:'media',value:{items:[0,1,2,3,4,5].map(function(i){return{t:$('mt'+i).value,c:($('mc'+i)?$('mc'+i).value:'campus'),title:$('mn'+i).value.trim(),url:$('mu'+i).value.trim()}}).filter(function(x){return x.title&&/^https:\/\//i.test(x.url)})},updated_by:me.id}],{onConflict:'key'});a.error?msg(a.error.message,false,$('gm')):msg('Settings saved.',true,$('gm'))}};
