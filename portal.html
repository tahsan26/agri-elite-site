 $('rv').innerHTML='<div class="card"><div class="row"><select id="rc" style="max-width:220px">'+courses.map(function(c){return'<option value="'+esc(c.id)+'">'+esc(c.code)+' · '+esc(c.title)+'</option>'}).join('')+'</select><button class="btn" id="rs">▶ Start flash revision</button></div><p class="m">The most-asked questions of the course, all in one place for the last night before the exam. Tick the ones you have revised.</p><div id="rb"></div></div><div id="rl"></div>';
 var list=[];
 async function load(){cid=$('rc').value;var r=await sb.from('notes').select('id,title,question_bn,answer_html,frequency,stars').eq('status','published').eq('course_id',cid).order('frequency',{ascending:false}).order('stars',{ascending:false}).limit(20);if(r.error)return $('rl').innerHTML=msg(r.error.message);list=r.data||[];draw()}
 function draw(){var n=list.filter(function(x){return done[x.id]}).length,p=list.length?Math.round(n*100/list.length):0;$('rb').innerHTML=list.length?'<div class="row"><b>'+n+' / '+list.length+' revised</b><span class="m">'+p+'%</span></div><div class="bar"><i style="width:'+p+'%"></i></div>':'';
  $('rl').innerHTML=list.length?list.map(function(x){return'<details class="card" style="padding:12px"><summary><label style="display:inline-flex;gap:8px;align-items:center"><input type="checkbox" data-rv="'+esc(x.id)+'" style="width:auto"'+(done[x.id]?' checked':'')+'></label> <b>'+(x.frequency>1?'×'+x.frequency+' · ':'')+esc(x.title)+'</b>'+(x.stars?' <span class="m">'+'★'.repeat(Math.min(5,x.stars))+'</span>':'')+'</summary>'+(x.question_bn?'<p class="m">'+esc(x.question_bn)+'</p>':'')+'<div>'+(x.answer_html||'')+'</div></details>'}).join(''):'<div class="card"><p class="m">No published notes for this course yet.</p></div>'}
 function save(){try{localStorage.setItem('agri-rev',JSON.stringify(done))}catch(e){}}
 function flash(i){if(i<0||i>=list.length){draw();return $('rl').scrollIntoView()}var x=list[i];$('rl').innerHTML='<div class="card"><div class="row"><b>'+(i+1)+' / '+list.length+'</b><span class="m">Flash revision</span><span style="flex:1"></span><button class="btn s" data-fx="x">Exit</button></div><div class="bar"><i style="width:'+Math.round((i+1)*100/list.length)+'%"></i></div><h3>'+esc(x.title)+'</h3>'+(x.question_bn?'<p class="m">'+esc(x.question_bn)+'</p>':'')+'<div class="rd" style="--fs:18px">'+(x.answer_html||'')+'</div><div class="row" style="margin-top:12px"><button class="btn s" data-fp="'+i+'"'+(i==0?' disabled':'')+'>← Back</button><button class="btn" data-fn="'+i+'">✓ Revised, next →</button><button class="btn s" data-fk="'+i+'">Skip</button></div></div>';$('rl').scrollIntoView()}
 $('rc').onchange=load;
 $('rv').onclick=function(e){var c=e.target.closest('[data-rv]');if(c){if(c.checked)done[c.dataset.rv]=1;else delete done[c.dataset.rv];save();var n=list.filter(function(x){return done[x.id]}).length,p=list.length?Math.round(n*100/list.length):0;$('rb').innerHTML='<div class="row"><b>'+n+' / '+list.length+' revised</b><span class="m">'+p+'%</span></div><div class="bar"><i style="width:'+p+'%"></i></div>';return}
  if(e.target.id=='rs'){if(list.length)flash(0);return}
  var fn=e.target.closest('[data-fn]');if(fn){var i=+fn.dataset.fn;done[list[i].id]=1;save();return flash(i+1)}
  var fk=e.target.closest('[data-fk]');if(fk)return flash(+fk.dataset.fk+1);var fp=e.target.closest('[data-fp]');if(fp)return flash(+fp.dataset.fp-1);if(e.target.closest('[data-fx]'))draw()};
 await load()}
