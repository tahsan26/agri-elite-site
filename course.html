<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Course · AGRi ELITE NOTES</title><meta property="og:type" content="website"><meta property="og:site_name" content="AGRi ELITE NOTES"><meta property="og:title" content="Live course notes | AGRi ELITE NOTES"><meta property="og:image" content="https://agri-elite-arena.netlify.app/og-image.png"><meta name="twitter:card" content="summary_large_image"><link rel="canonical" href="https://agri-elite-arena.netlify.app/course.html"><script src="theme.js"></script><meta name="description" content="Course notes published from the AGRi ELITE NOTES database.">
<style>:root{--bg:#f7faf8;--card:#fff;--fg:#14202b;--mute:#5b6b77;--line:#dbe4e1;--g:#0f6b4f;--mint:#d9f3e7}@media(prefers-color-scheme:dark){:root{--bg:#0e1614;--card:#16211e;--fg:#e6efec;--mute:#93a6a0;--line:#26372f;--mint:#17352b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,'Hind Siliguri',sans-serif}.w{max-width:900px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left))}
h1{font-size:26px;margin:8px 0}a{color:var(--g)}input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tabs button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 14px;font:inherit;font-weight:600;cursor:pointer}.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0;padding:10px 14px}summary{cursor:pointer;font-weight:700}.m{color:var(--mute)}.st{color:#e8a317}
.cc{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;text-decoration:none;color:inherit}</style></head><body><div class="w">
<a href="index.html">← AGRi ELITE NOTES</a> · <a href="portal.html">Student portal</a><h1 id="h">Courses</h1><div id="b"><p class="m">Loading…</p></div></div>
<script src="config.js"></script><script>
(function(){var C=window.AGRI_CFG,H={apikey:C.key,Authorization:'Bearer '+C.key},$=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function get(p){return fetch(C.url+'/rest/v1/'+p,{headers:H}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
var code=new URLSearchParams(location.search).get('c');
function fail(){$('b').innerHTML='<p class="m">Could not load right now. Please try again later.</p>'}
if(!code){get('courses?select=code,title,description&status=eq.published&order=sort_order').then(function(r){$('b').innerHTML=r.map(function(c){return'<a class="cc" href="course.html?c='+encodeURIComponent(c.code)+'"><b>'+esc(c.code)+'</b> · '+esc(c.title)+(c.description?'<div class="m">'+esc(c.description)+'</div>':'')+'</a>'}).join('')||'<p class="m">No courses yet.</p>'}).catch(fail);return}
get('courses?select=id,code,title,description&status=eq.published&code=eq.'+encodeURIComponent(code)).then(function(cs){var c=cs[0];if(!c){$('h').textContent='Course not found';$('b').innerHTML='<p><a href="course.html">See all courses</a></p>';return}
 document.title=c.code+' · AGRi ELITE NOTES';window.AGRI_AI_COURSE=c.code+' · '+c.title;$('h').textContent=c.code+' · '+c.title;
 return Promise.all([get('topics?select=id,name,teacher&course_id=eq.'+c.id+'&order=sort_order'),get('notes?select=id,title,question_bn,answer_html,topic_id,frequency,stars,legacy_id&status=eq.published&course_id=eq.'+c.id+'&order=sort_order&limit=500')]).then(function(r){
  var T=r[0],N=r[1],tp='',q='';$('b').innerHTML=(c.description?'<p class="m">'+esc(c.description)+'</p>':'')+'<input id="q" placeholder="Search questions…" aria-label="Search"><div class="tabs" id="t"></div><div id="l"></div>';
  function draw(){$('t').innerHTML='<button data-t="" class="'+(tp?'':'on')+'">All ('+N.length+')</button>'+T.map(function(t){return'<button data-t="'+esc(t.id)+'" class="'+(tp==t.id?'on':'')+'">'+esc(t.name)+'</button>'}).join('');
   var l=N.filter(function(n){return(!tp||n.topic_id==tp)&&(!q||(n.title+' '+(n.question_bn||'')+' '+(n.legacy_id||'')).toLowerCase().indexOf(q)>-1)});
   $('l').innerHTML=l.map(function(n){return'<details class="ai-q"><summary>'+(n.legacy_id?'<span class="m">'+esc(n.legacy_id)+'</span> ':'')+esc(n.title)+' <span class="st">'+'★'.repeat(Math.min(3,n.stars||0))+'</span></summary>'+(n.question_bn?'<p class="m">'+esc(n.question_bn)+'</p>':'')+(n.answer_html||'')+'<p class="m">Asked '+(n.frequency||1)+'×</p></details>'}).join('')||'<p class="m">No matching notes.</p>'}
  $('b').onclick=function(e){var b=e.target.closest('[data-t]');if(b){tp=b.dataset.t;draw()}};$('q').oninput=function(){q=this.value.toLowerCase();draw()};draw()})}).catch(fail);
})();</script><script src="track.js"></script><script src="ai-widget.js" defer></script><script src="listen.js" defer></script><script src="bell.js" defer></script></body></html>
