<a href="index.html">← AGRi Elite Arena</a><h1>Library · newly published</h1><p class="m">Notes and PDFs published from the admin dashboard appear here automatically.</p>
<div class="row"><input id="q" placeholder="Search notes…" aria-label="Search"><select id="c" aria-label="Course"><option value="">All courses</option></select></div>
<h2>Notes</h2><div id="n"><p class="m">Loading…</p></div><h2 id="pdfs">PDF notes · read or download</h2><div id="f"><p class="m">Loading…</p></div>
<h2>Send feedback or report an error</h2><form id="fb"><div class="row"><select id="fk"><option value="feedback">Feedback</option><option value="suggestion">Suggest a topic</option><option value="error_report">Report incorrect information</option></select><input id="fc" placeholder="Contact (optional)" maxlength="120"></div><br><textarea id="fm" rows="4" placeholder="Your message" maxlength="2000" required></textarea><br><br><button>Send</button> <span id="fs"></span></form></div>
<script src="config.js"></script><script src="site-ui.js" defer></script><script>
(function(){var C=window.AGRI_CFG,H={apikey:C.key,Authorization:'Bearer '+C.key},$=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function get(p){return fetch(C.url+'/rest/v1/'+p,{headers:H}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
var notes=[],courses={};
function draw(){var q=$('q').value.toLowerCase(),c=$('c').value,l=notes.filter(function(n){return(!c||n.course_id==c)&&(!q||(n.title+' '+(n.question_bn||'')).toLowerCase().indexOf(q)>-1)});
$('n').innerHTML=l.length?l.map(function(n){return'<details><summary>'+esc(n.title)+' <span class="m">· '+esc(courses[n.course_id]||'')+'</span></summary>'+(n.question_bn?'<p class="m">'+esc(n.question_bn)+'</p>':'')+(n.answer_html||'')+'</details>'}).join(''):'<p class="m">No published notes yet. Everything already on the site is in the course pages on the home page.</p>'}
Promise.all([get('courses?select=id,code,title&status=eq.published&order=sort_order'),get('notes?select=id,title,question_bn,answer_html,course_id&status=eq.published&order=published_at.desc&limit=200'),get('files?select=id,name,path,size_bytes,downloads&order=created_at.desc&limit=100')]).then(function(r){
 r[0].forEach(function(c){courses[c.id]=c.code;$('c').insertAdjacentHTML('beforeend','<option value="'+esc(c.id)+'">'+esc(c.code)+'</option>')});notes=r[1];draw();
 $('f').innerHTML=r[2].length?r[2].map(function(f){var u=C.url+'/storage/v1/object/public/'+C.bucket+'/'+encodeURI(f.path),nm=String(f.name||'document').replace(/\.pdf$/i,''),isPdf=/\.pdf$/i.test(f.path||f.name||''),dl=u+'?download='+encodeURIComponent(f.name||'document');return'<div class="f"><span style="flex:1 1 200px;min-width:0"><b>'+esc(f.name)+'</b> <span class="m">'+Math.round((f.size_bytes||0)/1024)+' KB</span></span>'+(isPdf?'<a class="b" href="'+esc(u)+'" data-read="'+esc(u)+'" data-dl="'+esc(dl)+'" data-title="'+esc(nm)+'" data-f="'+esc(f.id)+'">Read online</a>':'')+'<a class="b" href="'+esc(dl)+'" data-f="'+esc(f.id)+'">⬇ Download</a></div>'}).join(''):'<p class="m">No uploaded PDFs yet.</p>';
}).catch(function(){$('n').innerHTML='<p class="er">Could not load the library right now. Please try again later.</p>';$('f').innerHTML=''});
$('q').oninput=draw;$('c').onchange=draw;
document.addEventListener('click',function(e){var a=e.target.closest('a[data-f]');if(a)fetch(C.url+'/rest/v1/rpc/count_download',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify({fid:a.dataset.f}),keepalive:true}).catch(function(){})});
$('fb').onsubmit=function(e){e.preventDefault();var m=$('fm').value.trim();if(m.length<3)return;fetch(C.url+'/rest/v1/feedback',{method:'POST',headers:Object.assign({'Content-Type':'application/json',Prefer:'return=minimal'},H),body:JSON.stringify({kind:$('fk').value,message:m,contact:$('fc').value.trim()||null})}).then(function(r){if(!r.ok)throw 0;$('fs').className='ok';$('fs').textContent='Thank you! Sent.';$('fm').value=''}).catch(function(){$('fs').className='er';$('fs').textContent='Could not send. Please try again.'})};
})();</script><script src="pdf-reader.js" defer></script><script src="track.js"></script><script src="ai-widget.js" defer></script><script src="bell.js" defer></script><script src="ux.js" defer></script><script src="nav-back.js" defer></script><script src="team.js" defer></script></body></html>
