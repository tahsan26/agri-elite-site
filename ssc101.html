<script>
const D={"Q": [{"id": "CS1", "t": "CS", "q": "Define soil from the pedological point of view.", "bq": "মৃত্তিকাবিজ্ঞানের (পেডোলজি) দৃষ্টিতে মাটির সংজ্ঞা দাও।", "a": "<div class=\"df\">Soil is a natural body of mineral and organic constituents, differentiated into horizons (layers) of variable depth, which differs from the parent material below in its morphology, physical make-up, chemical properties and biological characteristics.<span class=\"src\"> — Joffe, pedological definition</span></div><p class=\"pp\">In pedology (পেডোলজি = মাটির উৎপত্তি ও গঠনের বিজ্ঞান) the soil is studied as an independent natural body. It is formed by the combined action of climate, organisms and relief on the parent material over a long time (Dokuchaev).</p><div class=\"pt\"><span class=\"n\">1</span><div><b>Natural body:</b> formed in nature, not made by man.</div></div><div class=\"pt\"><span class=\"n\">2</span><div><b>Has horizons (স্তর):</b> O, A, E, B, C make a profile.</div></div><div class=\"pt\"><span class=\"n\">3</span><div>Differs from the parent material below in colour, texture, structure and chemistry.</div></div><div class=\"pt\"><span class=\"n\">4</span><div>Has a depth that varies from place to place.</div></div><div class=\"tipb\"><b>Do not confuse:</b> edaphological definition = soil is a medium (মাধ্যম) for plant growth. Pedological definition = soil is a natural body with horizons.</div><div class=\"sm\"><span class=\"smh\">সারকথা</span>পেডোলজির মতে মাটি হলো খনিজ ও জৈব পদার্থের তৈরি একটি প্রাকৃতিক বস্তু, যা বিভিন্ন স্তরে (হরাইজন) ভাগ থাকে এবং নিচের মূল শিলা (প্যারেন্ট ম্যাটেরিয়াল) থেকে গঠন, ভৌত ও রাসায়নিক ধর্মে আলাদা। উদ্ভিদের বৃদ্ধির মাধ্যম হিসেবে দেখলে সেটি এডাফোলজিক্যাল সংজ্ঞা।</div>", "y": [[2025, "A1a", 2], [2024, "A1a", 2], [2023, "A1a", 1.5], [2022, "A1a", 2], [2021, "A1a", 2]], "m": "1.5 / 2", "c": 5, "sg": "", "st": 0, "top": true, "new": false}, {"id": "CS2", "t": "CS", "q": "What are the major components of mineral surface soil? Show them diagrammatically (volume basis) and write the functions of each.", "bq": "খনিজ মাটির প্রধান উপাদানগুলো কী কী? আয়তনের ভিত্তিতে চিত্রসহ দেখাও এবং প্রতিটির কাজ লেখো।", "a": "<p class=\"pp\">An ideal mineral surface soil is made of <b>four components</b>. On a volume basis, about half is solid and half is pore space (ফাঁকা জায়গা).</p><div class=\"fig\"><svg viewBox=\"0 0 330 180\" width=\"330\" height=\"180\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M90,90 L90.0,10.0 A80,80 0 0 1 114.7,166.1 Z\" fill=\"#8D6E63\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"141\" y=\"85\" font-size=\"13\" font-weight=\"bold\" fill=\"#fff\" text-anchor=\"middle\">45%</text><path d=\"M90,90 L114.7,166.1 A80,80 0 0 1 90.0,170.0 Z\" fill=\"#37474F\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"98\" y=\"144\" font-size=\"13\" font-weight=\"bold\" fill=\"#fff\" text-anchor=\"middle\">5%</text><path d=\"M90,90 L90.0,170.0 A80,80 0 0 1 10.0,90.0 Z\" fill=\"#29B6F6\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"53\" y=\"130\" font-size=\"13\" font-weight=\"bold\" fill=\"#fff\" text-anchor=\"middle\">25%</text><path d=\"M90,90 L10.0,90.0 A80,80 0 0 1 90.0,10.0 Z\" fill=\"#B0BEC5\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"53\" y=\"56\" font-size=\"13\" font-weight=\"bold\" fill=\"#fff\" text-anchor=\"middle\">25%</text><rect x=\"190\" y=\"30\" width=\"16\" height=\"16\" rx=\"3\" fill=\"#8D6E63\"/><text x=\"213\" y=\"43\" font-size=\"14\" fill=\"#223\">Mineral matter 45%</text><rect x=\"190\" y=\"64\" width=\"16\" height=\"16\" rx=\"3\" fill=\"#37474F\"/><text x=\"213\" y=\"77\" font-size=\"14\" fill=\"#223\">Organic matter 5%</text><rect x=\"190\" y=\"98\" width=\"16\" height=\"16\" rx=\"3\" fill=\"#29B6F6\"/><text x=\"213\" y=\"111\" font-size=\"14\" fill=\"#223\">Water 25%</text><rect x=\"190\" y=\"132\" width=\"16\" height=\"16\" rx=\"3\" fill=\"#B0BEC5\"/><text x=\"213\" y=\"145\" font-size=\"14\" fill=\"#223\">Air 25%</text><text x=\"190\" y=\"172\" font-size=\"11.5\" fill=\"#445\" font-style=\"italic\">Solids 50% + Pore space 50% (volume)</text></svg><div class=\"cap\">Volume composition of an ideal mineral surface soil</div></div><div class=\"tbw\"><table><tr><th>Component</th><th>Volume</th><th>Main functions</th></tr><tr><td><b>Mineral matter</b></td><td>45%</td><td>Skeleton of soil; source of plant nutrients (K, Ca, Mg, P); decides texture and structure.</td></tr><tr><td><b>Organic matter</b></td><td>5%</td><td>Store of N, P, S; makes good structure; holds water and nutrients; food for microbes.</td></tr><tr><td><b>Water</b></td><td>25%</td><td>Solvent and carrier of nutrients; needed for photosynthesis; keeps plant cool.</td></tr><tr><td><b>Air</b></td><td>25%</td><td>O<sub>2</sub> for root and microbe respiration; N<sub>2</sub> for N-fixation; removes CO<sub>2</sub>.</td></tr></table></div><div class=\"tipb\"><b>Remember:</b> 45 + 5 + 25 + 25 = 100. Water and air share the pore space, so when one increases the other decreases.</div><div class=\"sm\"><span class=\"smh\">সারকথা</span>খনিজ মাটির আয়তনের ৪৫% খনিজ পদার্থ, ৫% জৈব পদার্থ, ২৫% পানি ও ২৫% বায়ু। খনিজ পদার্থ মাটির কাঠামো ও পুষ্টির উৎস, জৈব পদার্থ পুষ্টি ও পানি ধরে রাখে, পানি পুষ্টির বাহক, আর বায়ু শিকড় ও অণুজীবের শ্বসনের জন্য অক্সিজেন দেয়।</div>", "y": [[2025, "A1b", 2], [2024, "A1c", 2], [2023, "A1b", 1.5], [2022, "A1b", 2], [2021, "A1c", 4]], "m": "1.5 / 2 / 4", "c": 5, "sg": "", "st": 0, "top": false, "new": false}, {"id": "CS3", "t": "CS", "q": "Write the major functions of soil in the ecosystem.", "bq": "বাস্তুতন্ত্রে মাটির প্রধান কাজগুলো লেখো।", "a": "<p class=\"pp\">Soil is the base of the terrestrial (স্থলজ) ecosystem. Its <b>six broad ecological functions</b> are:</p><div class=\"pt\"><span class=\"n\">1</span><div><b>Medium for plant growth:</b> gives anchorage, water, air and nutrients.</div></div><div class=\"pt\"><span class=\"n\">2</span><div><b>Regulator of water supply:</b> stores rain water, controls runoff, flood and recharge of groundwater.</div></div><div class=\"pt\"><span class=\"n\">3</span><div><b>Recycler of nutrients and wastes:</b> decomposes dead plants, animals and wastes and returns nutrients.</div></div><div class=\"pt\"><span class=\"n\">4</span><div><b>Habitat for soil organisms:</b> home of bacteria, fungi, earthworms and many others (biodiversity).</div></div><div class=\"pt\"><span class=\"n\">5</span><div><b>Modifier of the atmosphere:</b> exchanges and stores gases such as CO<sub>2</sub>, CH<sub>4</sub>, N<sub>2</sub>O (climate effect).</div></div><div class=\"pt\"><span class=\"n\">6</span><div><b>Engineering medium:</b> base for roads, buildings and a filter that cleans water (buffer).</div></div><div class=\"tipb\"><b>For 2 marks</b> (any four): plant growth medium, water regulator, nutrient recycler, habitat for organisms.</div><div class=\"sm\"><span class=\"smh\">সারকথা</span>বাস্তুতন্ত্রে মাটির ছয়টি প্রধান কাজ: উদ্ভিদের বৃদ্ধির মাধ্যম, পানি নিয়ন্ত্রণ, পুষ্টি ও বর্জ্যের পুনর্ব্যবহার, জীবের আবাস, বায়ুমণ্ডলের গ্যাস পরিবর্তন এবং প্রকৌশলের ভিত্তি/ফিল্টার। ৪ নম্বরের জন্য প্রথম চারটি লিখলেই হবে।</div>", "y": [[2025, "A1c", 2], [2023, "A1c", 3]], "m": "2 / 3", "c": 2, "sg": "", "st": 0, "top": false, "new": false}, {"id": "CS4", "t": "CS", "q": "What is soil science? Enlist its branches.", "bq": "মৃত্তিকাবিজ্ঞান কী? এর শাখাগুলোর তালিকা দাও।", "a": "<div class=\"df\">Soil science is the science that deals with soil as a natural resource: its formation, classification, mapping, physical, chemical and biological properties, fertility, and its use and management.</div><p class=\"pp\"><b>Two main branches</b> (প্রধান শাখা):</p><div class=\"pt\"><span class=\"n\">1</span><div><b>Pedology:</b> origin, morphology, classification and distribution of soil as a natural body.</div></div><div class=\"pt\"><span class=\"n\">2</span><div><b>Edaphology:</b> study of soil in relation to plant growth and crop production.</div></div><p class=\"pp\"><b>Other branches</b> (উপ-শাখা):</p><div class=\"tbw\"><table><tr><th>Branch</th><th>Deals with</th></tr><tr><td>Soil physics</td><td>Texture, structure, density, water, air, temperature</td></tr><tr><td>Soil chemistry</td><td>Soil reaction (pH), colloids, ion exchange, salinity</td></tr><tr><td>Soil biology / microbiology</td><td>Soil organisms and their activities</td></tr><tr><td>Soil fertility and plant nutrition</td><td>Nutrient supply and fertilizer use</td></tr><tr><td>Soil genesis, classification and survey</td><td>Formation, taxonomy and mapping of soils</td></tr><tr><td>Soil conservation and management</td><td>Erosion control, land use, reclamation</td></tr></table></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>মৃত্তিকাবিজ্ঞান হলো মাটির গঠন, শ্রেণিবিভাগ, ভৌত-রাসায়নিক-জৈব ধর্ম, উর্বরতা ও ব্যবস্থাপনার বিজ্ঞান। প্রধান শাখা দুটি: পেডোলজি (মাটির উৎপত্তি ও শ্রেণিবিভাগ) ও এডাফোলজি (উদ্ভিদের সাথে মাটির সম্পর্ক)। এছাড়া মাটির ভৌত, রসায়ন, জীববিজ্ঞান, উর্বরতা, জরিপ ও সংরক্ষণ আছে।</div>", "y": [[2024, "A1b", 2], [2021, "A1b", 3]], "m": "2 / 3", "c": 2, "sg": "", "st": 0, "top": false, "new": false}, {"id": "CS5", "t": "CS", "q": "How does soil support plant growth?", "bq": "মাটি কীভাবে উদ্ভিদের বৃদ্ধিতে সাহায্য করে?", "a": "<p class=\"pp\">Soil supports plant growth in five main ways:</p><div class=\"pt\"><span class=\"n\">1</span><div><b>Anchorage (অবলম্বন):</b> roots hold the plant firmly in the soil.</div></div><div class=\"pt\"><span class=\"n\">2</span><div><b>Water:</b> soil stores water in pores and gives it to the roots.</div></div><div class=\"pt\"><span class=\"n\">3</span><div><b>Nutrients:</b> soil supplies essential nutrients like N, P, K from minerals and humus.</div></div><div class=\"pt\"><span class=\"n\">4</span><div><b>Air:</b> pores supply O<sub>2</sub> to roots for respiration.</div></div><div class=\"pt\"><span class=\"n\">5</span><div><b>Temperature and habitat:</b> soil keeps root zone temperature moderate and hosts useful microbes (e.g. Rhizobium) and buffers toxic substances.</div></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>মাটি উদ্ভিদকে শিকড় দিয়ে আঁকড়ে ধরে রাখে (অবলম্বন), পানি, পুষ্টি ও বায়ু সরবরাহ করে এবং শিকড়ের অঞ্চলের তাপমাত্রা ঠিক রাখে ও উপকারী অণুজীবের আবাস দেয়। তাই মাটি উদ্ভিদের বৃদ্ধির প্রধান মাধ্যম।</div>", "y": [[2022, "A1c", 2]], "m": "2", "c": 1, "sg": "", "st": 0, "top": false, "new": false}, {"id": "RM1", "t": "RM", "q": "Differentiate between rocks and minerals.", "bq": "শিলা ও খনিজের মধ্যে পার্থক্য লেখো।", "a": "<div class=\"df\"><b>Rock</b> is a natural aggregate (মিশ্রণ) of one or more minerals. <b>Mineral</b> is a naturally occurring, inorganic, homogeneous solid with a definite chemical composition and crystal structure.</div><div class=\"tbw\"><table><tr><th>Point</th><th>Rock</th><th>Mineral</th></tr><tr><td>Definition</td><td>Aggregate of one or more minerals</td><td>Naturally occurring inorganic substance</td></tr><tr><td>Composition</td><td>Not definite; varies</td><td>Definite chemical composition</td></tr><tr><td>Crystal form</td><td>Usually no definite crystal form</td><td>Definite crystal structure</td></tr><tr><td>Homogeneity</td><td>Heterogeneous (mixture)</td><td>Homogeneous (one substance)</td></tr><tr><td>Examples</td><td>Granite, basalt, sandstone, marble</td><td>Quartz (SiO<sub>2</sub>), feldspar, mica, calcite</td></tr><tr><td>Classes</td><td>Igneous, sedimentary, metamorphic</td><td>Primary and secondary minerals</td></tr><tr><td>Study</td><td>Petrology</td><td>Mineralogy</td></tr><tr><td>Relation</td><td>Rocks are made of minerals</td><td>Minerals are building blocks of rocks</td></tr></table></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>শিলা হলো এক বা একাধিক খনিজের মিশ্রণ, নির্দিষ্ট রাসায়নিক গঠন নেই (যেমন গ্র্যানাইট)। খনিজ একটি প্রাকৃতিক অজৈব পদার্থ, যার নির্দিষ্ট রাসায়নিক গঠন ও স্ফটিক আকার আছে (যেমন কোয়ার্টজ)। খনিজ দিয়ে শিলা তৈরি হয়।</div>", "y": [[2025, "A2a", 3], [2021, "A3b", 5]], "m": "3 / 5", "c": 2, "sg": "", "st": 0, "top": true, "new": false}, {"id": "RM2", "t": "RM", "q": "Define minerals. Write the characteristics of mica and quartz.", "bq": "খনিজের সংজ্ঞা দাও। মাইকা ও কোয়ার্টজের বৈশিষ্ট্য লেখো।", "a": "<div class=\"df\">Minerals are naturally occurring, inorganic, homogeneous solids with a definite chemical composition and crystal structure; they are the building units of rocks and soil.</div><div class=\"tbw\"><table><tr><th>Point</th><th>Mica</th><th>Quartz</th></tr><tr><td>Formula</td><td>Muscovite KAl<sub>2</sub>(AlSi<sub>3</sub>O<sub>10</sub>)(OH)<sub>2</sub>; Biotite K(Mg,Fe)<sub>3</sub>(AlSi<sub>3</sub>O<sub>10</sub>)(OH)<sub>2</sub></td><td>SiO<sub>2</sub></td></tr><tr><td>Type</td><td>Sheet silicate (phyllosilicate)</td><td>Framework silicate</td></tr><tr><td>Colour</td><td>Muscovite white/colourless; biotite black/dark</td><td>Colourless, white, milky</td></tr><tr><td>Cleavage</td><td>Perfect, splits into thin elastic flakes</td><td>None; breaks with a curved (conchoidal) fracture</td></tr><tr><td>Hardness</td><td>2–3 (soft)</td><td>7 (hard)</td></tr><tr><td>Specific gravity</td><td>2.7–3.1</td><td>2.65</td></tr><tr><td>Weathering</td><td>Muscovite is resistant; biotite weathers faster</td><td>Very resistant, remains in sand and silt</td></tr><tr><td>Nutrient</td><td>Source of K (also Mg, Fe in biotite)</td><td>Gives no nutrient</td></tr><tr><td>Occurs in</td><td>Granite, schist; sand and silt fractions</td><td>Granite, sandstone; most abundant in sand</td></tr></table></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>খনিজ হলো প্রাকৃতিক অজৈব পদার্থ যার নির্দিষ্ট রাসায়নিক গঠন ও স্ফটিক আকার আছে। মাইকা (মাসকোভাইট সাদা, বায়োটাইট কালো) নরম, পাতলা পাতে ভাঙে ও পটাশিয়ামের উৎস। কোয়ার্টজ (SiO₂) খুব শক্ত (কঠিনতা ৭), ক্ষয়ে না, বালি-পলিতে বেশি থাকে, কোনো পুষ্টি দেয় না।</div>", "y": [[2022, "A3a", 1], [2022, "A3b", 5]], "m": "1 / 5", "c": 2, "sg": "", "st": 0, "top": false, "new": false}, {"id": "RM3", "t": "RM", "q": "Define rocks. Classify rocks according to genesis and structure with examples.", "bq": "শিলার সংজ্ঞা দাও। উৎপত্তি ও গঠন অনুসারে শিলার শ্রেণিবিভাগ উদাহরণসহ লেখো।", "a": "<div class=\"df\">Rock is a natural aggregate of one or more minerals, forming the solid part of the earth’s crust.</div><p class=\"pp\"><b>1. Classification by genesis (origin):</b></p><div class=\"tbw\"><table><tr><th>Class</th><th>How formed</th><th>Examples</th></tr><tr><td><b>Igneous</b></td><td>Cooling and solidification of hot molten magma. Intrusive (plutonic, below surface): coarse grain. Extrusive (volcanic, on surface): fine grain.</td><td>Granite, gabbro, diorite (intrusive); basalt, rhyolite, andesite (extrusive)</td></tr><tr><td><b>Sedimentary</b></td><td>Deposition and cementation of sediments (weathered materials, shells) in layers.</td><td>Sandstone, shale, limestone, conglomerate</td></tr><tr><td><b>Metamorphic</b></td><td>Change of old rocks by heat, pressure and fluids, without melting.</td><td>Gneiss, schist, slate, marble, quartzite</td></tr></table></div><p class=\"pp\"><b>2. Classification by structure (গঠন):</b></p><div class=\"pt\"><span class=\"n\">1</span><div><b>Stratified (layered) rocks:</b> sedimentary rocks, e.g. sandstone, shale.</div></div><div class=\"pt\"><span class=\"n\">2</span><div><b>Unstratified (massive) rocks:</b> igneous rocks, e.g. granite, basalt.</div></div><div class=\"pt\"><span class=\"n\">3</span><div><b>Foliated (banded or schistose) rocks:</b> metamorphic, e.g. gneiss, schist, slate; non-foliated: marble, quartzite.</div></div><p class=\"pp\"><b>Igneous rocks by silica:</b> acidic (more than 65% SiO<sub>2</sub>, e.g. granite), intermediate (diorite), basic (45–52%, e.g. basalt, gabbro).</p><div class=\"sm\"><span class=\"smh\">সারকথা</span>শিলা হলো খনিজের প্রাকৃতিক সমষ্টি। উৎপত্তি অনুযায়ী তিন ধরনের: আগ্নেয় (ম্যাগমা ঠান্ডা হয়ে, যেমন গ্র্যানাইট, ব্যাসল্ট), পাললিক (স্তরে স্তরে জমে, যেমন বেলেপাথর, চুনাপাথর) ও রূপান্তরিত (তাপ-চাপে পরিবর্তিত, যেমন মার্বেল, স্লেট)। গঠন অনুযায়ী: স্তরিত, অস্তরিত ও পত্রায়িত।</div>", "y": [[2023, "A2a", 3]], "m": "3", "c": 1, "sg": "", "st": 0, "top": false, "new": false}, {"id": "RM4", "t": "RM", "q": "Differentiate between pyroxenes and amphiboles.", "bq": "পাইরক্সিন ও অ্যাম্ফিবোলের মধ্যে পার্থক্য লেখো।", "a": "<p class=\"pp\">Both pyroxenes and amphiboles are dark, iron-magnesium (ferromagnesian) silicate minerals of igneous rocks.</p><div class=\"tbw\"><table><tr><th>Point</th><th>Pyroxene</th><th>Amphibole</th></tr><tr><td>Common example</td><td>Augite</td><td>Hornblende</td></tr><tr><td>Silicate structure</td><td>Single chain of SiO<sub>4</sub></td><td>Double chain of SiO<sub>4</sub></td></tr><tr><td>Si : O ratio</td><td>1 : 3</td><td>4 : 11</td></tr><tr><td>Cleavage angle</td><td>Two cleavages at about 90° (87°)</td><td>Two cleavages at about 56° and 124°</td></tr><tr><td>Water (OH)</td><td>Absent (anhydrous)</td><td>Present (hydrous)</td></tr><tr><td>Crystal shape</td><td>Short, stubby, 8-sided prisms</td><td>Long, slender, 6-sided prisms</td></tr><tr><td>Colour</td><td>Dark green to black</td><td>Dark green to black</td></tr><tr><td>Occurrence</td><td>Basic igneous rocks (basalt, gabbro)</td><td>Acidic and intermediate rocks (granite, diorite)</td></tr></table></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>পাইরক্সিন (অগাইট) একক শৃঙ্খল গঠনের, Si:O = ১:৩, ফাটল প্রায় ৯০° কোণে, OH নেই। অ্যাম্ফিবোল (হর্নব্লেন্ড) দ্বিগুণ শৃঙ্খলের, Si:O = ৪:১১, ফাটল ৫৬° ও ১২৪° কোণে, OH আছে। দুটোই গাঢ় রঙের ও Mg-Fe সমৃদ্ধ।</div>", "y": [[2023, "A2b", 3]], "m": "3", "c": 1, "sg": "", "st": 0, "top": false, "new": false}, {"id": "RM5", "t": "RM", "q": "Define geology. Mention the geographic (geological) characteristics of Bangladesh.", "bq": "ভূতত্ত্বের সংজ্ঞা দাও। বাংলাদেশের ভৌগোলিক বৈশিষ্ট্য উল্লেখ করো।", "a": "<div class=\"df\">Geology (Greek geo = earth, logos = science) is the science that deals with the origin, structure, composition and history of the earth, its rocks and the processes that change it.</div><p class=\"pp\"><b>Geographic and geological characteristics of Bangladesh:</b></p><div class=\"pt\"><span class=\"n\">1</span><div><b>Location:</b> lies in South Asia between about 20°34′N–26°38′N and 88°01′E–92°41′E; area about 147,570 km<sup>2</sup>.</div></div><div class=\"pt\"><span class=\"n\">2</span><div>Part of the Bengal Basin and the world’s largest delta, built by sediments of the Ganges, Brahmaputra and Meghna rivers.</div></div><div class=\"pt\"><span class=\"n\">3</span><div>Land is mostly low and flat; much of it is only a few metres above sea level; bordered by the Bay of Bengal in the south.</div></div><div class=\"pt\"><span class=\"n\">4</span><div><b>Three physiographic regions:</b> Tertiary hills (about 12%) in the east and north-east; Pleistocene terraces (about 8%) such as Barind and Madhupur; Recent floodplains (about 80%).</div></div><div class=\"pt\"><span class=\"n\">5</span><div>Tropical monsoon climate with heavy rain (June–September) and yearly flooding that deposits fresh alluvium.</div></div><div class=\"pt\"><span class=\"n\">6</span><div><b>Soils:</b> mostly alluvial; coastal areas have saline soils; hill soils are acidic and erosion-prone.</div></div><div class=\"tbw\"><table><tr><th>Region</th><th>Share</th><th>Soil type</th></tr><tr><td>Hills</td><td>≈ 12%</td><td>Acidic, sandy loam to clay loam, erosion-prone</td></tr><tr><td>Terraces</td><td>≈ 8%</td><td>Old reddish, deep, low fertility (Barind, Madhupur)</td></tr><tr><td>Floodplains</td><td>≈ 80%</td><td>Young alluvial, fertile; coastal part saline</td></tr></table></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>জিওলজি বা ভূতত্ত্ব হলো পৃথিবীর উৎপত্তি, গঠন, শিলা ও ইতিহাসের বিজ্ঞান। বাংলাদেশ বঙ্গীয় অববাহিকায় অবস্থিত, বিশ্বের বৃহত্তম ব-দ্বীপ, গঙ্গা-ব্রহ্মপুত্র-মেঘনার পলিতে গঠিত। ভূমির প্রায় ৮০% প্লাবনভূমি, ১২% টারশিয়ারি পাহাড় ও ৮% প্লাইস্টোসিন চত্বর। জলবায়ু ক্রান্তীয় মৌসুমি।</div>", "y": [[2023, "A6a", 3]], "m": "3", "c": 1, "sg": "", "st": 0, "top": false, "new": false}, {"id": "RM6", "t": "RM", "q": "Write the name and formula of eight important soil-forming minerals.", "bq": "মাটি গঠনকারী আটটি গুরুত্বপূর্ণ খনিজের নাম ও সংকেত লেখো।", "a": "<p class=\"pp\">Eight important soil-forming minerals with formulas:</p><div class=\"tbw\"><table><tr><th>Mineral</th><th>Formula</th><th>Group / note</th></tr><tr><td>1. Quartz</td><td>SiO<sub>2</sub></td><td>Silica; very resistant</td></tr><tr><td>2. Orthoclase (K-feldspar)</td><td>KAlSi<sub>3</sub>O<sub>8</sub></td><td>Feldspar; source of K</td></tr><tr><td>3. Plagioclase (Albite–Anorthite)</td><td>NaAlSi<sub>3</sub>O<sub>8</sub> – CaAl<sub>2</sub>Si<sub>2</sub>O<sub>8</sub></td><td>Feldspar; source of Na, Ca</td></tr><tr><td>4. Muscovite</td><td>KAl<sub>2</sub>(AlSi<sub>3</sub>O<sub>10</sub>)(OH)<sub>2</sub></td><td>White mica</td></tr><tr><td>5. Biotite</td><td>K(Mg,Fe)<sub>3</sub>(AlSi<sub>3</sub>O<sub>10</sub>)(OH)<sub>2</sub></td><td>Black mica</td></tr><tr><td>6. Hornblende</td><td>Ca<sub>2</sub>Na(Mg,Fe)<sub>4</sub>(Al,Fe,Ti)<sub>3</sub>Si<sub>6</sub>O<sub>22</sub>(OH)<sub>2</sub></td><td>Amphibole</td></tr><tr><td>7. Augite</td><td>Ca(Mg,Fe,Al)(Al,Si)<sub>2</sub>O<sub>6</sub></td><td>Pyroxene</td></tr><tr><td>8. Olivine</td><td>(Mg,Fe)<sub>2</sub>SiO<sub>4</sub></td><td>Source of Mg, Fe; weathers fast</td></tr></table></div><div class=\"tipb\"><b>Also useful:</b> calcite CaCO<sub>3</sub>, dolomite CaMg(CO<sub>3</sub>)<sub>2</sub>, gypsum CaSO<sub>4</sub>·2H<sub>2</sub>O, apatite Ca<sub>5</sub>(PO<sub>4</sub>)<sub>3</sub>(F,Cl,OH), hematite Fe<sub>2</sub>O<sub>3</sub>, kaolinite Al<sub>2</sub>Si<sub>2</sub>O<sub>5</sub>(OH)<sub>4</sub>.</div><div class=\"sm\"><span class=\"smh\">সারকথা</span>মাটি গঠনকারী আটটি প্রধান খনিজ: কোয়ার্টজ SiO₂, অর্থোক্লেজ KAlSi₃O₈, প্লাজিওক্লেজ (NaAlSi₃O₈–CaAl₂Si₂O₈), মাসকোভাইট, বায়োটাইট, হর্নব্লেন্ড, অগাইট ও অলিভিন (Mg,Fe)₂SiO₄। এগুলো মাটিতে K, Ca, Mg, Fe ইত্যাদি পুষ্টি জোগায়।</div>", "y": [[2021, "A3a", 4]], "m": "4", "c": 1, "sg": "", "st": 0, "top": false, "new": false}, {"id": "WE1", "t": "WE", "q": "Describe the principal agents/processes of chemical weathering.", "bq": "রাসায়নিক আবহবিকারের প্রধান প্রভাবক/প্রক্রিয়াগুলো বর্ণনা করো।", "a": "<div class=\"df\">Chemical weathering is the decomposition of rocks and minerals by chemical reactions, in which the minerals change into new, more stable products (e.g. clay).</div><p class=\"pp\"><b>Principal agents:</b> water, oxygen, carbon dioxide (carbonic acid) and organic acids. Warm temperature and rainfall speed it up.</p><div class=\"tbw\"><table><tr><th>Process</th><th>What happens</th><th>Example</th></tr><tr><td><b>Hydrolysis</b> (most important)</td><td>H<sup>+</sup> of water/acid replaces K<sup>+</sup>, Na<sup>+</sup>, Ca<sup>2+</sup> of the mineral; clay forms</td><td>Orthoclase → kaolinite clay, K<sup>+</sup> released</td></tr><tr><td><b>Hydration</b></td><td>Mineral takes up water and swells</td><td>Fe<sub>2</sub>O<sub>3</sub> → limonite; anhydrite → gypsum</td></tr><tr><td><b>Oxidation</b></td><td>Oxygen joins the mineral; Fe<sup>2+</sup> → Fe<sup>3+</sup>, red colour</td><td>4FeO + O<sub>2</sub> → 2Fe<sub>2</sub>O<sub>3</sub></td></tr><tr><td><b>Reduction</b></td><td>Fe<sup>3+</sup> → Fe<sup>2+</sup> in waterlogged soil; grey-blue colour</td><td>Gley formation</td></tr><tr><td><b>Carbonation</b></td><td>CO<sub>2</sub> + H<sub>2</sub>O = H<sub>2</sub>CO<sub>3</sub> dissolves carbonates</td><td>CaCO<sub>3</sub> + H<sub>2</sub>CO<sub>3</sub> → Ca(HCO<sub>3</sub>)<sub>2</sub></td></tr><tr><td><b>Solution</b></td><td>Water dissolves soluble minerals</td><td>Rock salt, gypsum</td></tr></table></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>রাসায়নিক আবহবিকারে পানি, অক্সিজেন, কার্বন ডাই-অক্সাইড ও জৈব অ্যাসিডের বিক্রিয়ায় খনিজ ভেঙে নতুন পদার্থ (কাদা) তৈরি হয়। প্রধান প্রক্রিয়া: হাইড্রোলাইসিস (সবচেয়ে গুরুত্বপূর্ণ), হাইড্রেশন, অক্সিডেশন, বিজারণ, কার্বনেশন ও দ্রবণ।</div>", "y": [[2025, "A5b", 4], [2024, "A3b", 4], [2022, "B6b", 4], [2021, "A4b", 5]], "m": "4 / 5", "c": 4, "sg": "", "st": 0, "top": true, "new": false}, {"id": "WE2", "t": "WE", "q": "Define weathering. Enlist its agents / types and the factors affecting it.", "bq": "আবহবিকারের সংজ্ঞা দাও। এর প্রভাবক/ধরন ও প্রভাবকারী বিষয়গুলো লেখো।", "a": "<div class=\"df\">Weathering is the physical disintegration and chemical decomposition of rocks and minerals at or near the earth’s surface by atmospheric agents, in place and with little transport.</div><p class=\"pp\"><b>Types and agents</b> (প্রভাবক):</p><div class=\"tbw\"><table><tr><th>Type</th><th>Agents</th></tr><tr><td><b>Physical</b> (disintegration)</td><td>Temperature change, water (rain, frost), wind, ice/glacier, gravity</td></tr><tr><td><b>Chemical</b> (decomposition)</td><td>Water, oxygen, carbon dioxide, acids (hydrolysis, oxidation, carbonation …)</td></tr><tr><td><b>Biological</b></td><td>Plants (root pressure, acids, lichens), animals (earthworm, ant, termite, rodent), microbes (organic acids), man (tillage, mining)</td></tr></table></div><p class=\"pp\"><b>Factors affecting weathering:</b> climate (temperature, rainfall), kind and hardness of parent rock, size of particles (more surface = faster), topography, vegetation and time.</p><div class=\"sm\"><span class=\"smh\">সারকথা</span>আবহবিকার হলো বায়ুমণ্ডলের প্রভাবে শিলা ও খনিজের ভৌত ভাঙন ও রাসায়নিক পচন। ধরন তিনটি: ভৌত, রাসায়নিক ও জৈবিক। প্রভাবিত করে জলবায়ু, মূল শিলার ধরন, কণার আকার, ভূমির ঢাল, গাছপালা ও সময়। জৈবিক প্রভাবক: উদ্ভিদ, প্রাণী, অণুজীব ও মানুষ।</div>", "y": [[2025, "A5a", 2], [2024, "A3a", 2], [2021, "A4a", 4]], "m": "2 / 4", "c": 3, "sg": "", "st": 0, "top": false, "new": false}, {"id": "WE3", "t": "WE", "q": "Describe physical weathering: its processes and agents (including water as an agent).", "bq": "ভৌত আবহবিকার বর্ণনা করো: এর প্রক্রিয়া ও প্রভাবক (পানির ভূমিকাসহ)।", "a": "<div class=\"df\">Physical weathering is the breaking of rock into smaller pieces by mechanical forces without any change in its chemical composition.</div><div class=\"tbw\"><table><tr><th>Process</th><th>How it works</th></tr><tr><td><b>Temperature change</b></td><td>Daily heating and cooling: unequal expansion and contraction of minerals cracks the rock (exfoliation, granular disintegration).</td></tr><tr><td><b>Freezing and thawing</b></td><td>Water in cracks freezes, expands about 9% and wedges the rock apart (frost action).</td></tr><tr><td><b>Abrasion</b></td><td>Rubbing by wind-blown sand, running water and glaciers.</td></tr><tr><td><b>Unloading</b></td><td>Pressure release when overlying rock is removed; sheets peel off.</td></tr><tr><td><b>Salt crystallisation, roots</b></td><td>Growing salt crystals and plant roots force cracks wider.</td></tr></table></div><p class=\"pp\"><b>Water as an agent of physical weathering:</b></p><div class=\"pt\"><span class=\"n\">1</span><div><b>Frost wedging:</b> water enters cracks, freezes and its expansion splits the rock.</div></div><div class=\"pt\"><span class=\"n\">2</span><div><b>Running water (rivers, rain):</b> moves, rolls and rubs rock pieces; boulders become pebbles, gravel and sand (abrasion and rounding).</div></div><div class=\"pt\"><span class=\"n\">3</span><div><b>Rain-drop and wave action:</b> loosen and wear away surface rock.</div></div><div class=\"pt\"><span class=\"n\">4</span><div><b>Glacier ice:</b> moving ice scrapes and carries rock pieces.</div></div><div class=\"pt\"><span class=\"n\">5</span><div><b>Wetting and drying:</b> repeated swelling and shrinking breaks shale and clay rocks.</div></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>ভৌত আবহবিকারে রাসায়নিক গঠন না বদলে শিলা ছোট টুকরায় ভাঙে। প্রক্রিয়া: তাপমাত্রার পরিবর্তন, জমা-গলা (বরফ ৯% ফোলে), ঘর্ষণ, চাপ কমে যাওয়া ও লবণের স্ফটিক। পানি শিলার ফাটলে জমে বরফ হয়ে, নদীর স্রোতে ঘষা খেয়ে ও বৃষ্টির আঘাতে শিলাকে ভাঙে।</div>", "y": [[2023, "A3b", 4], [2022, "B6a", 2], [2021, "B7", 3]], "m": "2 / 3 / 4", "c": 3, "sg": "", "st": 0, "top": false, "new": false}, {"id": "WE4", "t": "WE", "q": "What is exfoliation?", "bq": "এক্সফোলিয়েশন কী?", "a": "<div class=\"df\">Exfoliation is the peeling off of thin, curved, onion-like sheets or scales from the surface of a bare rock, caused by repeated heating and cooling.</div><div class=\"pt\"><span class=\"n\">1</span><div>In hot, dry areas the rock surface is heated by the sun in the day and cooled at night.</div></div><div class=\"pt\"><span class=\"n\">2</span><div>The outer layer expands and contracts more than the cool inner part, so cracks form parallel to the surface.</div></div><div class=\"pt\"><span class=\"n\">3</span><div>Thin curved sheets peel off one after another, like the skin of an onion (onion-skin weathering).</div></div><div class=\"pt\"><span class=\"n\">4</span><div>Pressure release (unloading) of granite also causes sheeting.</div></div><p class=\"pp\"><b>Result:</b> rounded, dome-shaped rocks (exfoliation domes) and angular rock debris; the fresh surface then weathers further.</p><div class=\"sm\"><span class=\"smh\">সারকথা</span>এক্সফোলিয়েশন হলো খোলা শিলার উপরিভাগ থেকে পেঁয়াজের খোসার মতো পাতলা বাঁকা স্তর খসে পড়া। দিনে গরম ও রাতে ঠান্ডার কারণে বাইরের স্তর ও ভিতরের অংশ অসমভাবে প্রসারিত-সংকুচিত হয়ে ফাটল ধরে। গ্র্যানাইটে এটি বেশি দেখা যায়।</div>", "y": [[2023, "A3a", 2]], "m": "2", "c": 1, "sg": "", "st": 0, "top": false, "new": false}, {"id": "FM1", "t": "FM", "q": "Write about the fundamental soil-forming processes.", "bq": "মাটি গঠনের মৌলিক প্রক্রিয়াগুলো লেখো।", "a": "<p class=\"pp\">Soil formation goes on through four fundamental (মৌলিক) processes (Simonson, 1959):</p><div class=\"tbw\"><table><tr><th>Process</th><th>Meaning</th><th>Examples</th></tr><tr><td><b>1. Additions</b></td><td>Materials added to the soil body</td><td>Organic matter from plants, rain water, dust, flood silt, salts, fertilizer</td></tr><tr><td><b>2. Losses</b></td><td>Materials removed from the soil</td><td>Leaching of Ca, Mg, K, NO<sub>3</sub>; erosion; crop removal; volatilisation of N</td></tr><tr><td><b>3. Translocations</b></td><td>Movement of materials inside the profile</td><td>Eluviation–illuviation of clay, Fe, Al; upward movement of salts by capillary rise</td></tr><tr><td><b>4. Transformations</b></td><td>Chemical or physical change of materials in place</td><td>Weathering of minerals, humification of residues, clay formation</td></tr></table></div><div class=\"tipb\"><b>Memory trick:</b> Add – Lose – Move – Change (A L M C).</div><div class=\"sm\"><span class=\"smh\">সারকথা</span>মাটি গঠনের চারটি মৌলিক প্রক্রিয়া: সংযোজন (জৈব পদার্থ, পলি যোগ), ক্ষয়/অপসারণ (লিচিং, ভূমিক্ষয়), স্থানান্তর (এলুভিয়েশন-ইলুভিয়েশন, কৈশিক টানে লবণ ওঠা) ও রূপান্তর (আবহবিকার, হিউমিফিকেশন)।</div>", "y": [[2025, "A7a", 2], [2024, "A5a", 2], [2023, "A5a", 2], [2022, "B5a", 2]], "m": "2", "c": 4, "sg": "", "st": 0, "top": true, "new": false}, {"id": "FM2", "t": "FM", "q": "Write Jenny's equation (CLORPT) of soil formation.", "bq": "জেনির সমীকরণ (CLORPT) লেখো।", "a": "<div class=\"df\">Hans Jenny (1941) expressed soil formation as a function of five soil-forming factors: <b>S = f (Cl, O, R, P, T …)</b></div><div class=\"tbw\"><table><tr><th>Symbol</th><th>Factor</th><th>Type</th></tr><tr><td>S</td><td>Soil</td><td>Dependent (result)</td></tr><tr><td>Cl</td><td>Climate</td><td>Active</td></tr><tr><td>O</td><td>Organisms (vegetation, biota)</td><td>Active</td></tr><tr><td>R</td><td>Relief (topography)</td><td>Passive</td></tr><tr><td>P</td><td>Parent material</td><td>Passive</td></tr><tr><td>T</td><td>Time</td><td>Passive</td></tr><tr><td>…</td><td>Other unknown factors</td><td></td></tr></table></div><p class=\"pp\">The dots (…) mean other minor factors. This is called the <b>CLORPT</b> equation. It tells that soil differs from place to place because the factors differ. Earlier, Dokuchaev (1883) said that soil is a function of parent material, climate, organisms, relief and age.</p><div class=\"sm\"><span class=\"smh\">সারকথা</span>জেনির সমীকরণ: S = f (Cl, O, R, P, T …); এখানে S = মাটি, Cl = জলবায়ু, O = জীব, R = ভূমির ঢাল, P = মূল শিলা, T = সময়। জলবায়ু ও জীব সক্রিয় নিয়ামক; মূল শিলা, ঢাল ও সময় নিষ্ক্রিয় নিয়ামক। একে CLORPT বলে।</div>", "y": [[2025, "A6a", 2], [2022, "B4a", 2]], "m": "2", "c": 2, "sg": "", "st": 0, "top": false, "new": false}, {"id": "FM3", "t": "FM", "q": "Write the active factors of soil formation.", "bq": "মাটি গঠনের সক্রিয় নিয়ামকগুলো লেখো।", "a": "<div class=\"df\">Active factors are those that supply energy and actively act on the parent material to form soil. They are <b>climate</b> and <b>organisms</b>.</div><div class=\"tbw\"><table><tr><th>Factor</th><th>Effect on soil formation</th></tr><tr><td><b>Climate: rainfall</b></td><td>Water weathers rocks, leaches bases and clay, decides soil depth and horizons</td></tr><tr><td><b>Climate: temperature</b></td><td>Reaction rate roughly doubles with each 10 °C rise; warm-wet areas weather quickly; cold areas slowly</td></tr><tr><td><b>Climate: wind</b></td><td>Carries dust and sand; erosion and deposition</td></tr><tr><td><b>Vegetation</b></td><td>Forest gives acid litter and leaching (podzol); grass gives deep dark humus-rich soil</td></tr><tr><td><b>Micro-organisms</b></td><td>Decompose residues to humus, release nutrients, fix nitrogen</td></tr><tr><td><b>Animals</b></td><td>Earthworms, ants, termites, rodents mix soil and make pores</td></tr><tr><td><b>Man</b></td><td>Tillage, irrigation, fertilizer and drainage change the soil</td></tr></table></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>সক্রিয় নিয়ামক হলো জলবায়ু ও জীব। বৃষ্টি ও তাপমাত্রা শিলা ভাঙে ও উপাদান ধুয়ে নেয়; গাছপালা জৈব পদার্থ জোগায়; অণুজীব জৈব পদার্থ পচিয়ে হিউমাস করে; কেঁচো-পিঁপড়া মাটি মিশ্রিত করে; মানুষ চাষ ও সেচ দিয়ে মাটি বদলায়।</div>", "y": [[2025, "A6b", 4], [2022, "B4b", 4]], "m": "4", "c": 2, "sg": "", "st": 0, "top": false, "new": false}, {"id": "FM4", "t": "FM", "q": "Differentiate between podzolization and laterization.", "bq": "পডজলাইজেশন ও ল্যাটেরাইজেশনের মধ্যে পার্থক্য লেখো।", "a": "<p class=\"pp\">Both are leaching (ধৌত) processes. They differ in climate, materials removed and the soil formed.</p><div class=\"tbw\"><table><tr><th>Point</th><th>Podzolization</th><th>Laterization</th></tr><tr><td>Climate</td><td>Cool, humid, temperate</td><td>Hot, humid tropical</td></tr><tr><td>Vegetation</td><td>Coniferous forest (pine, spruce)</td><td>Tropical rain forest / savanna</td></tr><tr><td>Parent material</td><td>Acidic, sandy</td><td>Basic, iron-rich (basalt)</td></tr><tr><td>Reaction</td><td>Strongly acid; organic (fulvic) acids</td><td>Weakly acid to neutral; no organic acid effect</td></tr><tr><td>Removed from surface</td><td>Fe, Al oxides, humus and clay</td><td>Silica (SiO<sub>2</sub>) and bases (desilication)</td></tr><tr><td>Remains / accumulates</td><td>Silica in bleached E horizon; Fe, Al in B</td><td>Fe and Al oxides (sesquioxides) throughout</td></tr><tr><td>Colour</td><td>Ash-grey E; dark brown B</td><td>Red or yellow-red</td></tr><tr><td>Soil formed</td><td>Podzol (Spodosol)</td><td>Laterite (Oxisol)</td></tr><tr><td>Fertility</td><td>Poor</td><td>Very poor, hardens on drying</td></tr></table></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>পডজলাইজেশন ঠান্ডা আর্দ্র অঞ্চলে ঘটে; জৈব অ্যাসিড Fe, Al ও কাদা ধুয়ে নিচে জমায়, উপরে সাদা-ছাই E স্তর পড়ে থাকে। ল্যাটেরাইজেশন উষ্ণ আর্দ্র অঞ্চলে ঘটে; সিলিকা ধুয়ে যায়, Fe-Al অক্সাইড জমে লালচে মাটি (ল্যাটেরাইট) হয়।</div>", "y": [[2024, "A5b", 4], [2023, "A5b", 4]], "m": "4", "c": 2, "sg": "", "st": 0, "top": false, "new": false}, {"id": "FM5", "t": "FM", "q": "Write the passive factors of soil formation.", "bq": "মাটি গঠনের নিষ্ক্রিয় নিয়ামকগুলো লেখো।", "a": "<div class=\"df\">Passive factors are those that are acted upon: they supply the materials and the setting for soil formation. They are <b>parent material, relief (topography) and time</b>.</div><div class=\"tbw\"><table><tr><th>Factor</th><th>Effect</th></tr><tr><td><b>Parent material</b></td><td>Decides texture, mineral and nutrient content, rate of weathering and colour (quartz-rich = sandy soil; basalt = clayey, fertile soil)</td></tr><tr><td><b>Relief (topography)</b></td><td>Steep slope: erosion, thin soil. Flat land: deep soil. Depression: waterlogged, dark, organic-rich. Slope direction (aspect) changes temperature and moisture</td></tr><tr><td><b>Time</b></td><td>Long time makes deeper, more developed profile; young soils have weak horizons; old soils are strongly weathered and leached</td></tr></table></div><div class=\"tipb\"><b>Remember:</b> Passive = Parent material + Relief + Time (P R T). Active = Climate + Organisms.</div><div class=\"sm\"><span class=\"smh\">সারকথা</span>নিষ্ক্রিয় নিয়ামক হলো মূল শিলা, ভূমির ঢাল (টপোগ্রাফি) ও সময়। মূল শিলা মাটির বুনট ও খনিজ ঠিক করে; ঢালে ভূমিক্ষয় ও পানির নিষ্কাশন নির্ভর করে; সময় যত বেশি, মাটির স্তর তত উন্নত হয়। এরা নিজে কাজ করে না, কাজের উপাদান ও পরিবেশ জোগায়।</div>", "y": [[2024, "A4b", 4], [2023, "A4b", 4]], "m": "4", "c": 2, "sg": "", "st": 0, "top": false, "new": false}, {"id": "FM6", "t": "FM", "q": "What is soil formation (pedogenesis)?", "bq": "মাটি গঠন (পেডোজেনেসিস) কী?", "a": "<div class=\"df\">Soil formation (pedogenesis) is the process by which weathered rock material (parent material) is changed into soil with distinct horizons, under the action of the soil-forming factors and processes.</div><p class=\"pp\"><b>Two stages:</b></p><div class=\"pt\"><span class=\"n\">1</span><div><b>Weathering</b> of hard rock into loose, unconsolidated parent material (regolith).</div></div><div class=\"pt\"><span class=\"n\">2</span><div><b>Horizon development:</b> pioneer organisms (lichen, moss) grow, add organic matter and humus; then additions, losses, translocations and transformations build the layers O, A, E, B, C.</div></div><p class=\"pp\"><b>Factors:</b> climate, organisms, relief, parent material and time, i.e. S = f (Cl, O, R, P, T …).</p><div class=\"sm\"><span class=\"smh\">সারকথা</span>মাটি গঠন (পেডোজেনেসিস) হলো আবহবিকারে তৈরি মূল শিলা থেকে জলবায়ু, জীব, ঢাল, মূল শিলা ও সময়ের প্রভাবে স্তরযুক্ত মাটি তৈরির প্রক্রিয়া। প্রথমে শিলা ভাঙে, তারপর জৈব পদার্থ যোগ হয়ে এবং সংযোজন, ক্ষয়, স্থানান্তর ও রূপান্তরে হরাইজন গড়ে ওঠে।</div>", "y": [[2024, "A4a", 2], [2023, "A4a", 2]], "m": "2", "c": 2, "sg": "", "st": 0, "top": false, "new": false}, {"id": "FM7", "t": "FM", "q": "Short notes (any two): laterization, calcification, pedoturbation.", "bq": "সংক্ষিপ্ত টীকা (যেকোনো দুটি): ল্যাটেরাইজেশন, ক্যালসিফিকেশন, পেডোটারবেশন।", "a": "<p class=\"pp\"><b>(a) Laterization:</b> a process of hot, humid tropical regions. Heavy rain and high temperature remove silica (desilication) and bases; iron and aluminium oxides (sesquioxides) accumulate. The soil becomes red, acidic, low in fertility, and may harden into <b>laterite</b> on drying (used as building brick). Soil: Oxisol.</p><p class=\"pp\"><b>(b) Calcification:</b> a process of semi-arid grassland regions. Low rainfall cannot leach Ca fully. Calcium carbonate (CaCO<sub>3</sub>) moves down only to a limited depth and accumulates in the B horizon as a <b>calcic horizon</b> (caliche). Grass roots add a thick dark humus layer. Soil: Chernozem (Mollisol), rich in bases and fertile.</p><p class=\"pp\"><b>(c) Pedoturbation:</b> mixing of the soil by organisms and physical forces. Agents: earthworms, ants, termites, rodent burrowing, roots, uprooted trees, freezing–thawing, wetting–drying cracks and tillage. Effects: horizons are mixed, pores and aeration increase; it works against horizon formation.</p><div class=\"sm\"><span class=\"smh\">সারকথা</span>(ক) ল্যাটেরাইজেশন: উষ্ণ আর্দ্র অঞ্চলে সিলিকা ও ক্ষার ধুয়ে Fe-Al অক্সাইড জমে লাল ল্যাটেরাইট হয়। (খ) ক্যালসিফিকেশন: আধা-শুষ্ক তৃণভূমিতে CaCO₃ নিচের স্তরে জমে ক্যালসিক হরাইজন গড়ে, মাটি উর্বর (চার্নোজেম)। (গ) পেডোটারবেশন: কেঁচো, পিঁপড়া, শিকড় ও ফাটল দ্বারা মাটির স্তর মিশে যাওয়া।</div>", "y": [[2022, "B7", 6]], "m": "6", "c": 1, "sg": "", "st": 0, "top": false, "new": false}, {"id": "FM8", "t": "FM", "q": "Write about zonal and intrazonal pedogenic processes.", "bq": "জোনাল ও ইন্ট্রাজোনাল পেডোজেনিক প্রক্রিয়া সম্পর্কে লেখো।", "a": "<p class=\"pp\">Soils are grouped by the main factor that governs their formation (old classification).</p><div class=\"tbw\"><table><tr><th>Point</th><th>Zonal</th><th>Intrazonal</th></tr><tr><td>Controlled by</td><td>Regional climate and vegetation (active factors)</td><td>Local factors: parent material, poor drainage, salts</td></tr><tr><td>Profile</td><td>Well developed, mature</td><td>Developed, but shaped by local condition</td></tr><tr><td>Pedogenic processes</td><td>Laterization, podzolization, calcification (chernozemization)</td><td>Salinization, solonization, solodization, gleization (gleying), peat formation</td></tr><tr><td>Examples</td><td>Laterite, Podzol, Chernozem, desert soil, tundra soil</td><td>Solonchak (saline), Solonetz (alkali), Gley, Peat, Rendzina</td></tr></table></div><p class=\"pp\">A third group, <b>azonal</b> soils, are young soils with no profile (alluvial, lithosol, regosol).</p><div class=\"sm\"><span class=\"smh\">সারকথা</span>জোনাল প্রক্রিয়া বৃহৎ অঞ্চলের জলবায়ু ও গাছপালার ফল (ল্যাটেরাইজেশন, পডজলাইজেশন, ক্যালসিফিকেশন)। ইন্ট্রাজোনাল প্রক্রিয়া স্থানীয় কারণে ঘটে, যেমন মূল শিলা বা পানি জমা (লবণাক্তকরণ, সোলোনাইজেশন, গ্লেইজেশন, পিট গঠন)। তৃতীয় দল অ্যাজোনাল, অর্থাৎ অপরিণত মাটি।</div>", "y": [[2021, "A5a", 4]], "m": "4", "c": 1, "sg": "", "st": 0, "top": false, "new": false}, {"id": "FM9", "t": "FM", "q": "Describe the podsolization process.", "bq": "পডজলাইজেশন প্রক্রিয়া বর্ণনা করো।", "a": "<div class=\"df\">Podzolization is the process of leaching of iron, aluminium oxides and organic matter from the upper layer and their deposition in the lower layer, forming ash-coloured (podzol = under ash) soil.</div><p class=\"pp\"><b>Conditions:</b> cool humid climate, coniferous forest, acidic sandy parent material, heavy rain.</p><div class=\"pt\"><span class=\"n\">1</span><div>Conifer litter decays slowly and forms acid raw humus; organic (fulvic) acids are released.</div></div><div class=\"pt\"><span class=\"n\">2</span><div>Rain water with these acids leaches Fe, Al and humus (as chelates) from the A horizon.</div></div><div class=\"pt\"><span class=\"n\">3</span><div>Silica remains behind and makes the surface layer bleached, grey, ash-like: the <b>E horizon</b>.</div></div><div class=\"pt\"><span class=\"n\">4</span><div>The leached Fe, Al and humus are deposited in the <b>B horizon</b> (dark brown or red).</div></div><div class=\"pt\"><span class=\"n\">5</span><div>Sometimes a hard layer, <b>hardpan (ortstein)</b>, forms in B.</div></div><p class=\"pp\"><b>Profile:</b> O – A – E (ash-grey) – B (Fe-Al-humus) – C. <b>Soil:</b> Podzol (Spodosol), acid and infertile.</p><div class=\"sm\"><span class=\"smh\">সারকথা</span>পডজলাইজেশনে ঠান্ডা আর্দ্র অঞ্চলে পাইন বনের অম্লীয় জৈব অ্যাসিড Fe, Al ও হিউমাসকে উপরের স্তর থেকে ধুয়ে নিচের B স্তরে জমা করে। উপরে সিলিকাসমৃদ্ধ ছাই-রঙের E স্তর পড়ে থাকে। ফলে অম্লীয় ও কম উর্বর পডজল মাটি হয়।</div>", "y": [[2021, "A5b", 5]], "m": "5", "c": 1, "sg": "", "st": 0, "top": false, "new": false}, {"id": "FM10", "t": "FM", "q": "Differentiate between salinization and solonization.", "bq": "স্যালিনাইজেশন ও সোলোনাইজেশনের মধ্যে পার্থক্য লেখো।", "a": "<div class=\"tbw\"><table><tr><th>Point</th><th>Salinization</th><th>Solonization (alkalization)</th></tr><tr><td>Meaning</td><td>Accumulation of soluble salts (NaCl, Na<sub>2</sub>SO<sub>4</sub>, CaCl<sub>2</sub>, MgSO<sub>4</sub>) in soil</td><td>Accumulation of exchangeable sodium (Na<sup>+</sup>) on the clay surface</td></tr><tr><td>Cause</td><td>Evaporation of saline water; poor drainage; sea water; salty irrigation</td><td>Leaching of salts leaves Na<sup>+</sup> replacing Ca<sup>2+</sup> and Mg<sup>2+</sup> on clay</td></tr><tr><td>Climate</td><td>Arid, semi-arid and coastal</td><td>Semi-arid with seasonal leaching</td></tr><tr><td>Soil formed</td><td>Solonchak (white alkali / saline soil)</td><td>Solonetz (black alkali / sodic soil)</td></tr><tr><td>Key values</td><td>EC &gt; 4 dS/m, ESP &lt; 15, pH &lt; 8.5</td><td>EC &lt; 4 dS/m, ESP &gt; 15, pH &gt; 8.5</td></tr><tr><td>Structure</td><td>Good, flocculated</td><td>Poor, dispersed; columnar; hard when dry</td></tr><tr><td>Surface</td><td>White salt crust</td><td>Dark, sticky, waterlogged when wet</td></tr><tr><td>Reclamation</td><td>Leaching with good water and drainage</td><td>Gypsum + leaching</td></tr></table></div><div class=\"tipb\"><b>ESP</b> = exchangeable sodium percentage. Salinization is an intrazonal process.</div><div class=\"sm\"><span class=\"smh\">সারকথা</span>স্যালিনাইজেশনে মাটিতে দ্রবণীয় লবণ (NaCl ইত্যাদি) জমে, সাদা লবণের আস্তর পড়ে (সোলনচাক), pH ৮.৫-এর কম। সোলোনাইজেশনে কাদার গায়ে বিনিময়যোগ্য সোডিয়াম (ESP > ১৫) জমে, মাটি জমাট-শক্ত ও কালচে হয় (সোলোনেৎজ), pH ৮.৫-এর বেশি। সংশোধন: লবণে ধোয়া ও নিষ্কাশন; ক্ষারে জিপসাম।</div>", "y": [[2021, "A6a", 4]], "m": "4", "c": 1, "sg": "", "st": 0, "top": false, "new": false}, {"id": "PR1", "t": "PR", "q": "Draw and label an ideal soil profile.", "bq": "একটি আদর্শ মাটি-প্রোফাইল এঁকে চিহ্নিত করো।", "a": "<div class=\"df\">Soil profile is the vertical section of soil from the surface down to the parent material, showing the horizons.</div><div class=\"fig\"><svg viewBox=\"0 0 380 244\" width=\"380\" height=\"244\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"8\" refX=\"4\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#445\"/></marker></defs><rect x=\"20\" y=\"8\" width=\"110\" height=\"26\" fill=\"#3E2723\" stroke=\"#fff\"/><text x=\"75\" y=\"28.0\" font-size=\"20\" font-weight=\"bold\" fill=\"#fff\" text-anchor=\"middle\">O</text><line x1=\"130\" y1=\"21.0\" x2=\"150\" y2=\"21.0\" stroke=\"#667\"/><text x=\"154\" y=\"26.0\" font-size=\"13\" fill=\"#223\">Organic layer: leaves, humus</text><rect x=\"20\" y=\"34\" width=\"110\" height=\"40\" fill=\"#5D4037\" stroke=\"#fff\"/><text x=\"75\" y=\"61.0\" font-size=\"20\" font-weight=\"bold\" fill=\"#fff\" text-anchor=\"middle\">A</text><line x1=\"130\" y1=\"54.0\" x2=\"150\" y2=\"54.0\" stroke=\"#667\"/><text x=\"154\" y=\"59.0\" font-size=\"13\" fill=\"#223\">Topsoil: dark, humus + minerals</text><rect x=\"20\" y=\"74\" width=\"110\" height=\"30\" fill=\"#D7CCC8\" stroke=\"#fff\"/><text x=\"75\" y=\"96.0\" font-size=\"20\" font-weight=\"bold\" fill=\"#3a2a20\" text-anchor=\"middle\">E</text><line x1=\"130\" y1=\"89.0\" x2=\"150\" y2=\"89.0\" stroke=\"#667\"/><text x=\"154\" y=\"94.0\" font-size=\"13\" fill=\"#223\">Eluvial: leached, light grey</text><rect x=\"20\" y=\"104\" width=\"110\" height=\"46\" fill=\"#C0713A\" stroke=\"#fff\"/><text x=\"75\" y=\"134.0\" font-size=\"20\" font-weight=\"bold\" fill=\"#fff\" text-anchor=\"middle\">B</text><line x1=\"130\" y1=\"127.0\" x2=\"150\" y2=\"127.0\" stroke=\"#667\"/><text x=\"154\" y=\"132.0\" font-size=\"13\" fill=\"#223\">Subsoil: illuvial, clay/Fe/Al</text><rect x=\"20\" y=\"150\" width=\"110\" height=\"40\" fill=\"#BCAA7C\" stroke=\"#fff\"/><text x=\"75\" y=\"177.0\" font-size=\"20\" font-weight=\"bold\" fill=\"#3a2a20\" text-anchor=\"middle\">C</text><line x1=\"130\" y1=\"170.0\" x2=\"150\" y2=\"170.0\" stroke=\"#667\"/><text x=\"154\" y=\"175.0\" font-size=\"13\" fill=\"#223\">Parent material (weathered)</text><rect x=\"20\" y=\"190\" width=\"110\" height=\"34\" fill=\"#78909C\" stroke=\"#fff\"/><text x=\"75\" y=\"214.0\" font-size=\"20\" font-weight=\"bold\" fill=\"#fff\" text-anchor=\"middle\">R</text><line x1=\"130\" y1=\"207.0\" x2=\"150\" y2=\"207.0\" stroke=\"#667\"/><text x=\"154\" y=\"212.0\" font-size=\"13\" fill=\"#223\">Hard bedrock</text><path d=\"M12,8 V224\" stroke=\"#445\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><text x=\"6\" y=\"238\" font-size=\"11\" fill=\"#445\">depth</text><text x=\"20\" y=\"3\" font-size=\"0\"></text></svg><div class=\"cap\">Ideal soil profile with master horizons</div></div><div class=\"tbw\"><table><tr><th>Horizon</th><th>Name</th><th>Description</th></tr><tr><td><b>O</b></td><td>Organic</td><td>Surface layer of leaves and humus (forest soils)</td></tr><tr><td><b>A</b></td><td>Topsoil</td><td>Dark, humus + minerals; most roots and organisms; fertile</td></tr><tr><td><b>E</b></td><td>Eluvial</td><td>Light coloured; clay, Fe, Al and humus washed out</td></tr><tr><td><b>B</b></td><td>Subsoil</td><td>Illuvial; accumulation of clay, Fe, Al; red or brown, compact</td></tr><tr><td><b>C</b></td><td>Parent material</td><td>Weathered rock, little biological action</td></tr><tr><td><b>R</b></td><td>Bedrock</td><td>Hard unweathered rock</td></tr></table></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>আদর্শ মাটি-প্রোফাইলে ওপর থেকে নিচে O (জৈব), A (উপরের মাটি, গাঢ়, উর্বর), E (ধুয়ে যাওয়া, হালকা), B (নিচের মাটি, জমা হওয়া), C (আবহবিকৃত মূল শিলা) ও R (শক্ত শিলা) স্তর থাকে। চিত্রে নাম ও বর্ণনা চিহ্নিত করতে হবে।</div>", "y": [[2025, "A2b", 3], [2024, "A6b", 4]], "m": "3 / 4", "c": 2, "sg": "", "st": 0, "top": true, "new": false}, {"id": "PR2", "t": "PR", "q": "Distinguish between eluviation and illuviation.", "bq": "এলুভিয়েশন ও ইলুভিয়েশনের (অপসারণ ও সঞ্চয়) পার্থক্য লেখো।", "a": "<p class=\"pp\">Both occur together when rain water moves down through the soil.</p><div class=\"tbw\"><table><tr><th>Point</th><th>Eluviation</th><th>Illuviation</th></tr><tr><td>Meaning</td><td>Removal of materials from a horizon</td><td>Deposition of materials in a horizon</td></tr><tr><td>Origin of word</td><td>e = out</td><td>il = in</td></tr><tr><td>Horizon</td><td>E (or upper A) = eluvial</td><td>B = illuvial</td></tr><tr><td>Materials</td><td>Clay, Fe, Al oxides, humus, bases carried out</td><td>The same materials received and accumulated</td></tr><tr><td>Result</td><td>Light colour, coarse texture, low fertility</td><td>Dark or red colour, heavy (clayey) texture, compact; blocky or prismatic structure</td></tr><tr><td>Subtypes</td><td>—</td><td>Bt (clay), Bs (Fe-Al), Bh (humus)</td></tr><tr><td>Occurs in</td><td>Humid regions, rainfall greater than evaporation</td><td>Same soils, below the eluvial layer</td></tr></table></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>এলুভিয়েশন হলো পানির সাথে কাদা, Fe, Al, হিউমাস উপরের স্তর (E) থেকে ধুয়ে যাওয়া; ফলে সেখানে রং হালকা ও বুনট মোটা হয়। ইলুভিয়েশন হলো সেই উপাদান নিচের স্তরে (B) জমা হওয়া; ফলে B স্তর গাঢ়/লালচে, কাদাময় ও শক্ত হয়।</div>", "y": [[2025, "A7b", 4], [2022, "B5b", 4]], "m": "4", "c": 2, "sg": "", "st": 0, "top": false, "new": false}, {"id": "PR3", "t": "PR", "q": "Define soil profile, horizons (master, transitional, mixed, AP), eluviation and illuviation.", "bq": "মাটি-প্রোফাইল, হরাইজন (মাস্টার, ট্রানজিশনাল, মিশ্র, AP), এলুভিয়েশন ও ইলুভিয়েশনের সংজ্ঞা দাও।", "a": "<div class=\"tbw\"><table><tr><th>Term</th><th>Definition</th></tr><tr><td><b>Soil profile</b></td><td>Vertical section of soil from the surface to the parent material, showing all horizons.</td></tr><tr><td><b>Horizon</b></td><td>A layer of soil roughly parallel to the surface, with properties different from the layers above and below.</td></tr><tr><td><b>Master horizons</b></td><td>The main layers: O, A, E, B, C and R.</td></tr><tr><td><b>Transitional horizons</b></td><td>Lie between two master horizons and have properties of both; the first letter shows the dominant one: AB, BA, EB, BE, BC, CB.</td></tr><tr><td><b>Mixed horizons</b></td><td>Two parts, each like a master horizon, are mixed in one layer, written with a slash: E/B, B/E, A/B.</td></tr><tr><td><b>AP horizon (Ap)</b></td><td>The A horizon disturbed by ploughing and cultivation (p = plowed); uniform, mixed surface layer of farm soils.</td></tr><tr><td><b>Eluviation</b></td><td>Washing out of clay, Fe, Al, humus or salts from an upper horizon by percolating water.</td></tr><tr><td><b>Illuviation</b></td><td>Deposition (accumulation) of those washed materials in a lower horizon.</td></tr></table></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>মাটি-প্রোফাইল হলো ওপর থেকে মূল শিলা পর্যন্ত মাটির উল্লম্ব ছেদ। প্রধান হরাইজন O, A, E, B, C, R; দুইয়ের মাঝের স্তর ট্রানজিশনাল (AB, BC); মিশ্র স্তর স্ল্যাশ দিয়ে (E/B); চাষে নাড়া পড়া A স্তরকে Ap বলে। এলুভিয়েশন = উপর থেকে ধুয়ে যাওয়া, ইলুভিয়েশন = নিচে জমা হওয়া।</div>", "y": [[2024, "A6a", 2], [2021, "A6b", 5]], "m": "2 / 5", "c": 2, "sg": "", "st": 0, "top": false, "new": false}, {"id": "TX1", "t": "TX", "q": "Define soil particle and soil separate.", "bq": "মাটির কণা ও মাটির বিভাজ্য (সেপারেট) সংজ্ঞা দাও।", "a": "<div class=\"df\"><b>Soil particle:</b> an individual mineral grain of soil, such as one sand grain, one silt grain or one clay particle.</div><div class=\"df\"><b>Soil separate:</b> a group of soil particles within a definite size range (diameter), i.e. sand, silt and clay. Each separate is a size class.</div><div class=\"tbw\"><table><tr><th>Point</th><th>Soil particle</th><th>Soil separate</th></tr><tr><td>Meaning</td><td>Single grain</td><td>Group of grains of the same size range</td></tr><tr><td>Example</td><td>One grain of quartz of 0.3 mm</td><td>Sand (2.0–0.05 mm), silt (0.05–0.002 mm), clay (&lt; 0.002 mm)</td></tr><tr><td>Use</td><td>Basic unit of soil</td><td>Used to find soil texture</td></tr></table></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>মাটির কণা হলো মাটির একটি একক দানা। সেপারেট হলো নির্দিষ্ট আকারের (ব্যাস) কণার দল, যেমন বালি, পলি ও কাদা। সেপারেটের শতকরা হার থেকে মাটির বুনট নির্ণয় করা হয়।</div>", "y": [[2025, "B1a", 2], [2024, "A7a", 1], [2023, "A7a", 3], [2022, "B1a", 3], [2021, "B1a", 2]], "m": "1 / 2 / 3", "c": 5, "sg": "", "st": 0, "top": true, "new": false}, {"id": "TX2", "t": "TX", "q": "Define soil texture.", "bq": "মাটির বুনট (টেক্সচার) কী?", "a": "<div class=\"df\">Soil texture is the relative proportion (percentage) of sand, silt and clay particles in the soil. It tells how coarse or fine the soil is.</div><div class=\"pt\"><span class=\"n\">1</span><div>Counted only for fine earth (&lt; 2 mm).</div></div><div class=\"pt\"><span class=\"n\">2</span><div><b>Permanent property:</b> it cannot be changed easily by tillage or management.</div></div><div class=\"pt\"><span class=\"n\">3</span><div>Found by mechanical analysis (hydrometer, pipette method) or by hand feel.</div></div><div class=\"pt\"><span class=\"n\">4</span><div>On the basis of the three separates, soil is placed in a textural class, using the USDA textural triangle (12 classes).</div></div><div class=\"tipb\"><b>Texture vs structure:</b> texture is the size of the particles; structure is how those particles are arranged into aggregates.</div><div class=\"sm\"><span class=\"smh\">সারকথা</span>বুনট বা টেক্সচার হলো মাটিতে বালি, পলি ও কাদার আপেক্ষিক শতকরা পরিমাণ। এটি মাটির স্থায়ী ধর্ম, সহজে বদলায় না। বুনটের মাধ্যমে মাটি মোটা না মিহি তা বোঝা যায় এবং USDA ত্রিভুজ থেকে বুনট শ্রেণি (১২টি) ঠিক করা হয়।</div>", "y": [[2025, "B2a", 2], [2024, "B2a", 2], [2023, "A7b", 3], [2022, "B2a", 1], [2021, "B2a", 2]], "m": "1 / 2 / 3", "c": 5, "sg": "", "st": 0, "top": false, "new": false}, {"id": "TX3", "t": "TX", "q": "Write Stokes' law.", "bq": "স্টোকসের সূত্র লেখো।", "a": "<div class=\"df\">Stokes’ law states that the velocity of fall of a spherical particle in a fluid is directly proportional to the square of its radius and to the difference between the densities of the particle and the fluid, and inversely proportional to the viscosity of the fluid.</div><div class=\"eq\">v = <span class=\"fr\"><i>2 r<sup>2</sup> (ρ<sub>s</sub> – ρ<sub>l</sub>) g</i><b>9 η</b></span></div><div class=\"tbw\"><table><tr><th>Symbol</th><th>Meaning</th></tr><tr><td>v</td><td>Velocity of fall (cm/s)</td></tr><tr><td>r</td><td>Radius of particle (cm)</td></tr><tr><td>ρ<sub>s</sub></td><td>Density of particle (about 2.65 g/cm<sup>3</sup>)</td></tr><tr><td>ρ<sub>l</sub></td><td>Density of liquid (water about 1.0)</td></tr><tr><td>g</td><td>Acceleration of gravity (980 cm/s<sup>2</sup>)</td></tr><tr><td>η</td><td>Viscosity of liquid (poise)</td></tr></table></div><p class=\"pp\"><b>Use:</b> in mechanical analysis (hydrometer and pipette method) it gives the time a particle of a given size takes to settle, so sand, silt and clay can be separated. A large particle settles fast; clay (2 µm) needs about 8 hours to fall 10 cm in water at 20 °C.</p><div class=\"sm\"><span class=\"smh\">সারকথা</span>স্টোকসের সূত্র: তরলে গোলাকার কণার পতনের বেগ কণার ব্যাসার্ধের বর্গের এবং কণা ও তরলের ঘনত্বের পার্থক্যের সমানুপাতিক, আর তরলের সান্দ্রতার ব্যস্তানুপাতিক। v = 2r²(ρs–ρl)g / 9η। বুনট নির্ণয়ের হাইড্রোমিটার ও পিপেট পদ্ধতিতে এটি ব্যবহার হয়।</div>", "y": [[2025, "B3a", 2], [2024, "B1a", 2], [2022, "B3a", 3], [2021, "B3a", 3]], "m": "2 / 3", "c": 4, "sg": "", "st": 0, "top": false, "new": false}, {"id": "TX4", "t": "TX", "q": "Classify soil separates according to USDA (and MTFS/ISSS system).", "bq": "USDA অনুযায়ী মাটির সেপারেটের শ্রেণিবিভাগ করো।", "a": "<p class=\"pp\"><b>1. USDA system</b> (most used): diameter in mm</p><div class=\"tbw\"><table><tr><th>Separate</th><th>Diameter (mm)</th></tr><tr><td>Very coarse sand</td><td>2.0 – 1.0</td></tr><tr><td>Coarse sand</td><td>1.0 – 0.5</td></tr><tr><td>Medium sand</td><td>0.5 – 0.25</td></tr><tr><td>Fine sand</td><td>0.25 – 0.10</td></tr><tr><td>Very fine sand</td><td>0.10 – 0.05</td></tr><tr><td><b>Silt</b></td><td>0.05 – 0.002</td></tr><tr><td><b>Clay</b></td><td>&lt; 0.002</td></tr></table></div><p class=\"pp\">Total <b>sand</b> = 2.0–0.05 mm. Particles larger than 2 mm are gravel and stones, not counted as soil separates (fine earth is &lt; 2 mm).</p><p class=\"pp\"><b>2. Other systems</b> (for 2022 and comparison):</p><div class=\"tbw\"><table><tr><th>System</th><th>Sand</th><th>Silt</th><th>Clay</th></tr><tr><td>USDA</td><td>2.0 – 0.05</td><td>0.05 – 0.002</td><td>&lt; 0.002</td></tr><tr><td>International (ISSS)</td><td>2.0 – 0.02 (coarse 2–0.2, fine 0.2–0.02)</td><td>0.02 – 0.002</td><td>&lt; 0.002</td></tr><tr><td>MIT</td><td>2.0 – 0.06</td><td>0.06 – 0.002</td><td>&lt; 0.002</td></tr></table></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>USDA অনুযায়ী ২ মিমি-এর নিচের কণা: খুব মোটা বালি ২–১, মোটা ১–০.৫, মাঝারি ০.৫–০.২৫, মিহি ০.২৫–০.১, খুব মিহি ০.১–০.০৫ মিমি; পলি ০.০৫–০.০০২ মিমি; কাদা ০.০০২ মিমির কম। মোট বালি ২–০.০৫ মিমি। অন্য পদ্ধতিতে (ISSS, MIT) সীমা কিছুটা ভিন্ন।</div>", "y": [[2024, "A7b", 2], [2023, "A7a", 3], [2022, "B1a", 3], [2021, "B1b", 2]], "m": "2 / 3", "c": 4, "sg": "", "st": 0, "top": false, "new": false}, {"id": "TX5", "t": "TX", "q": "Write the importance of soil texture in agriculture.", "bq": "কৃষিতে মাটির বুনটের গুরুত্ব লেখো।", "a": "<p class=\"pp\">Texture is the most important physical property of soil in agriculture because it controls many other properties:</p><div class=\"pt\"><span class=\"n\">1</span><div><b>Water holding and drainage:</b> clay holds much water; sand drains fast.</div></div><div class=\"pt\"><span class=\"n\">2</span><div><b>Aeration:</b> sandy soil is well aerated; clay soil may be poorly aerated.</div></div><div class=\"pt\"><span class=\"n\">3</span><div><b>Nutrient holding (fertility):</b> clay and humus hold nutrients (high CEC); sand loses them by leaching.</div></div><div class=\"pt\"><span class=\"n\">4</span><div><b>Tillage ease (workability):</b> sandy soil is light and easy to plough; clay is heavy and sticky.</div></div><div class=\"pt\"><span class=\"n\">5</span><div><b>Root growth:</b> roots penetrate loam and sandy soil more easily than hard clay.</div></div><div class=\"pt\"><span class=\"n\">6</span><div><b>Soil temperature:</b> sandy soil warms up quickly (warm soil); clay is cold soil.</div></div><div class=\"pt\"><span class=\"n\">7</span><div><b>Erosion and compaction:</b> silt is most erodible; clay may crack and compact.</div></div><div class=\"pt\"><span class=\"n\">8</span><div><b>Crop choice:</b> rice – clay loam, silty clay; jute, potato, vegetables – loam and sandy loam; groundnut, sweet potato – sandy loam.</div></div><div class=\"pt\"><span class=\"n\">9</span><div><b>Management:</b> decides irrigation interval, fertilizer dose and liming.</div></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>বুনট মাটির সবচেয়ে গুরুত্বপূর্ণ ভৌত ধর্ম। এটি পানি ধারণ ও নিষ্কাশন, বায়ু চলাচল, পুষ্টি ধরে রাখা, চাষের সুবিধা, শিকড়ের বৃদ্ধি, তাপমাত্রা ও ভূমিক্ষয় নিয়ন্ত্রণ করে। ধানে এঁটেল-দোআঁশ, আলু-সবজিতে দোআঁশ ও বেলে-দোআঁশ মাটি ভালো।</div>", "y": [[2025, "B3b", 4], [2024, "B2b", 4], [2021, "B2c", 5]], "m": "4 / 5", "c": 3, "sg": "", "st": 0, "top": false, "new": false}, {"id": "TX6", "t": "TX", "q": "Write the properties of sand, silt and clay particles.", "bq": "বালি, পলি ও কাদা কণার বৈশিষ্ট্য লেখো।", "a": "<div class=\"tbw\"><table><tr><th>Property</th><th>Sand</th><th>Silt</th><th>Clay</th></tr><tr><td>Size (USDA)</td><td>2.0–0.05 mm</td><td>0.05–0.002 mm</td><td>&lt; 0.002 mm</td></tr><tr><td>Visibility</td><td>Seen with naked eye</td><td>Seen with microscope</td><td>Only electron microscope</td></tr><tr><td>Feel</td><td>Gritty, rough</td><td>Smooth, floury, silky</td><td>Sticky when wet, hard lumps when dry</td></tr><tr><td>Shape</td><td>Round or angular</td><td>Angular to round</td><td>Plate-like (flaky)</td></tr><tr><td>Minerals</td><td>Mostly quartz (primary)</td><td>Quartz, feldspar, mica</td><td>Secondary clay minerals (kaolinite, illite, montmorillonite) and Fe-Al oxides</td></tr><tr><td>Water holding</td><td>Very low</td><td>Medium</td><td>High</td></tr><tr><td>Drainage and aeration</td><td>Fast, good</td><td>Moderate</td><td>Slow, poor</td></tr><tr><td>Plasticity and cohesion</td><td>None</td><td>Slight</td><td>High (plastic, sticky)</td></tr><tr><td>Swelling and shrinking</td><td>None</td><td>Very little</td><td>Large (cracks when dry)</td></tr><tr><td>Nutrient holding (CEC)</td><td>Very low</td><td>Low</td><td>High (colloidal)</td></tr><tr><td>Surface area</td><td>Small</td><td>Medium</td><td>Very large</td></tr></table></div><div class=\"tipb\"><b>2025 note:</b> the printed question says clay; a handwritten correction says sand. Both are given here, so the answer is safe.</div><div class=\"sm\"><span class=\"smh\">সারকথা</span>বালির কণা বড় (২–০.০৫ মিমি), খসখসে, পানি ধরে রাখে না, নিষ্কাশন ও বায়ু চলাচল ভালো, পুষ্টি ধরে রাখতে পারে না। পলি মাঝারি, মসৃণ। কাদা সবচেয়ে ছোট (<০.০০২ মিমি), আঠালো, পানি ও পুষ্টি ধরে রাখে, ভিজলে ফোলে, শুকালে ফাটে, নিষ্কাশন খারাপ।</div>", "y": [[2025, "B1b", 4], [2022, "B1b", 3], [2021, "B1c", 5]], "m": "3 / 4 / 5", "c": 3, "sg": "", "st": 0, "top": false, "new": false}, {"id": "TX7", "t": "TX", "q": "Define soil colour and write its causes.", "bq": "মাটির রং কী? এর কারণ লেখো।", "a": "<div class=\"df\">Soil colour is the visible colour of the soil, described with the Munsell colour chart by hue, value and chroma (e.g. 10YR 5/3). It is a guide to soil composition and drainage.</div><div class=\"tbw\"><table><tr><th>Cause</th><th>Colour produced</th></tr><tr><td><b>Organic matter (humus)</b></td><td>Black, dark brown (more humus = darker)</td></tr><tr><td><b>Iron oxide, hematite (Fe<sub>2</sub>O<sub>3</sub>)</b></td><td>Red (well-drained, oxidised)</td></tr><tr><td><b>Hydrated iron oxide, goethite</b></td><td>Yellow, yellow-brown</td></tr><tr><td><b>Reduced iron (Fe<sup>2+</sup>), waterlogging</b></td><td>Grey, blue-grey, green (gley)</td></tr><tr><td><b>Quartz, kaolin, CaCO<sub>3</sub>, gypsum, salts</b></td><td>White, light grey</td></tr><tr><td><b>Manganese oxide</b></td><td>Black spots</td></tr><tr><td><b>Parent material</b></td><td>Red sandstone = reddish soil; basalt = dark soil</td></tr><tr><td><b>Moisture</b></td><td>Wet soil looks darker than dry soil</td></tr><tr><td><b>Climate and drainage</b></td><td>Hot humid, well drained = red; cold wet = grey</td></tr></table></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>মাটির রং বর্ণনা করা হয় মানসেল চার্টে (হিউ, ভ্যালু, ক্রোমা)। কারণ: হিউমাস (কালো), আয়রন অক্সাইড (লাল, হলুদ), জলাবদ্ধ অবস্থায় বিজারিত আয়রন (ধূসর-নীল), কোয়ার্টজ, লবণ ও চুন (সাদা), মূল শিলা, আর্দ্রতা ও নিষ্কাশন। রং দেখে মাটির নিষ্কাশন ও জৈব পদার্থ আন্দাজ করা যায়।</div>", "y": [[2025, "B4a", 3], [2022, "A5a", 3], [2021, "B4b", 4]], "m": "3 / 4", "c": 3, "sg": "", "st": 0, "top": false, "new": false}, {"id": "TX8", "t": "TX", "q": "Write the names of textural classes in order of increasing fineness.", "bq": "বুনট শ্রেণির নামগুলো সূক্ষ্মতার ক্রমবৃদ্ধি অনুসারে লেখো।", "a": "<p class=\"pp\">The 12 USDA textural classes, written from coarse to fine (increasing fineness):</p><div class=\"ar\"><span class=\"ab2\">1. Sand</span><span class=\"ab2\">2. Loamy sand</span><span class=\"ab2\">3. Sandy loam</span><span class=\"ab2\">4. Loam</span><span class=\"ab2\">5. Silt loam</span><span class=\"ab2\">6. Silt</span><span class=\"ab2\">7. Sandy clay loam</span><span class=\"ab2\">8. Clay loam</span><span class=\"ab2\">9. Silty clay loam</span><span class=\"ab2\">10. Sandy clay</span><span class=\"ab2\">11. Silty clay</span><span class=\"ab2\">12. Clay</span></div><div class=\"tbw\"><table><tr><th>Group</th><th>Textural classes</th></tr><tr><td>Sandy (coarse)</td><td>Sand, loamy sand</td></tr><tr><td>Moderately coarse</td><td>Sandy loam</td></tr><tr><td>Medium (loamy)</td><td>Loam, silt loam, silt</td></tr><tr><td>Moderately fine</td><td>Sandy clay loam, clay loam, silty clay loam</td></tr><tr><td>Fine (clayey)</td><td>Sandy clay, silty clay, clay</td></tr></table></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>১২টি বুনট শ্রেণি মোটা থেকে মিহি ক্রমে: Sand, Loamy sand, Sandy loam, Loam, Silt loam, Silt, Sandy clay loam, Clay loam, Silty clay loam, Sandy clay, Silty clay, Clay। এগুলো মোটা (বেলে), মাঝারি (দোআঁশ) ও মিহি (এঁটেল) তিন প্রধান দলে পড়ে।</div>", "y": [[2024, "A7c", 3], [2023, "A7b", 3], [2021, "B2b", 2]], "m": "2 / 3", "c": 3, "sg": "", "st": 0, "top": false, "new": false}, {"id": "TX9", "t": "TX", "q": "Compare soil air with atmospheric air.", "bq": "মাটির বায়ু ও বায়ুমণ্ডলীয় বায়ুর তুলনা করো।", "a": "<div class=\"df\"><b>Soil aeration</b> is the process by which the soil air is exchanged with fresh atmospheric air; it keeps the oxygen level of the soil suitable for roots and microbes.</div><div class=\"tbw\"><table><tr><th>Point</th><th>Soil air</th><th>Atmospheric air</th></tr><tr><td>Nitrogen (N<sub>2</sub>)</td><td>≈ 79%</td><td>≈ 78–79%</td></tr><tr><td>Oxygen (O<sub>2</sub>)</td><td>Lower: 10–20%</td><td>Higher: ≈ 21%</td></tr><tr><td>Carbon dioxide (CO<sub>2</sub>)</td><td>Higher: 0.15–0.65% (even more in wet soil)</td><td>Very low: ≈ 0.04%</td></tr><tr><td>Water vapour</td><td>Almost saturated (RH ≈ 100%)</td><td>Variable, usually lower</td></tr><tr><td>Other gases</td><td>CH<sub>4</sub>, H<sub>2</sub>S, NH<sub>3</sub>, ethylene in waterlogged soil</td><td>Almost none</td></tr><tr><td>Composition</td><td>Varies with depth, season, moisture and microbial activity</td><td>Fairly uniform</td></tr><tr><td>Continuity</td><td>Discontinuous, in pores</td><td>Continuous</td></tr></table></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>মাটির বায়ু ও বায়ুমণ্ডলের বায়ুর তুলনা: মাটির বায়ুতে অক্সিজেন কম (১০–২০%) ও CO₂ বেশি (০.১৫–০.৬৫%), জলীয় বাষ্প প্রায় সম্পৃক্ত, জলাবদ্ধ মাটিতে মিথেন ও H₂S থাকে এবং গঠন স্থানভেদে বদলায়। বায়ুমণ্ডলে O₂ প্রায় ২১%, CO₂ প্রায় ০.০৪% ও গঠন প্রায় স্থির।</div>", "y": [[2023, "B3b", 3], [2022, "A4a", 2], [2021, "B4a", 5]], "m": "2 / 3 / 5", "c": 3, "sg": "", "st": 0, "top": false, "new": false}, {"id": "TX10", "t": "TX", "q": "Write the importance of soil air.", "bq": "মাটির বায়ুর গুরুত্ব লেখো।", "a": "<p class=\"pp\">Soil air is important because roots and soil organisms need oxygen:</p><div class=\"pt\"><span class=\"n\">1</span><div><b>Root respiration:</b> O<sub>2</sub> gives energy for root growth and for water and nutrient uptake.</div></div><div class=\"pt\"><span class=\"n\">2</span><div><b>Microbial activity:</b> aerobic microbes decompose organic matter and do nitrification.</div></div><div class=\"pt\"><span class=\"n\">3</span><div><b>Nutrient availability:</b> oxidised forms of N, S, Fe and Mn are taken up well; in poor air, denitrification and loss of N occur.</div></div><div class=\"pt\"><span class=\"n\">4</span><div>Seed germination needs O<sub>2</sub>.</div></div><div class=\"pt\"><span class=\"n\">5</span><div><b>Avoids toxicity:</b> poor aeration makes toxic H<sub>2</sub>S, ethylene, Fe<sup>2+</sup> and Mn<sup>2+</sup>.</div></div><div class=\"pt\"><span class=\"n\">6</span><div><b>Root depth and plant health:</b> well-aerated soil gives deep roots and fewer root diseases.</div></div><div class=\"pt\"><span class=\"n\">7</span><div>Exchange of gases (CO<sub>2</sub>, N<sub>2</sub>O, CH<sub>4</sub>) with the atmosphere.</div></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>মাটির বায়ুর গুরুত্ব: শিকড়ের শ্বসন ও পুষ্টি শোষণ, অণুজীবের সক্রিয়তা (পচন, নাইট্রিফিকেশন), বীজের অঙ্কুরোদগম, পুষ্টির প্রাপ্যতা, বিষাক্ত গ্যাস (H₂S) জমা না হওয়া ও শিকড়ের গভীরে বৃদ্ধি। বায়ু কম হলে ডিনাইট্রিফিকেশন ও শিকড় পচা হয়।</div>", "y": [[2022, "A4b", 4], [2021, "B4a", 5]], "m": "4 / 5", "c": 2, "sg": "", "st": 0, "top": false, "new": false}, {"id": "TX11", "t": "TX", "q": "Describe the two mechanisms of gas exchange between soil and atmosphere.", "bq": "মাটি ও বায়ুমণ্ডলের মধ্যে গ্যাস বিনিময়ের দুটি প্রক্রিয়া বর্ণনা করো।", "a": "<p class=\"pp\">Gas exchange between soil and atmosphere happens by two mechanisms:</p><div class=\"tbw\"><table><tr><th>Mechanism</th><th>Meaning</th><th>Cause / example</th></tr><tr><td><b>1. Mass flow (convection)</b></td><td>Bulk movement of air as a whole, from high to low pressure</td><td>Changes in atmospheric pressure, temperature, wind, rain or irrigation water pushing air out of pores, tillage</td></tr><tr><td><b>2. Diffusion</b> (main)</td><td>Each gas moves separately from high to low concentration (partial pressure), Fick’s law</td><td>O<sub>2</sub> moves into the soil (low O<sub>2</sub>) and CO<sub>2</sub> moves out (high CO<sub>2</sub>)</td></tr></table></div><div class=\"tipb\">Diffusion is the more important process; it needs air-filled pores, so waterlogging stops it.</div><div class=\"sm\"><span class=\"smh\">সারকথা</span>মাটি ও বায়ুমণ্ডলের গ্যাস বিনিময় দুইভাবে: (১) ভর প্রবাহ—চাপ, তাপমাত্রা, বৃষ্টি বা সেচের কারণে বায়ু পুরোটা সরে যাওয়া; (২) ব্যাপন—প্রতিটি গ্যাস বেশি ঘনত্ব থেকে কম ঘনত্বের দিকে যায়, অক্সিজেন মাটিতে ঢোকে আর CO₂ বের হয়। ব্যাপনই প্রধান।</div>", "y": [[2024, "B4a", 3]], "m": "3", "c": 1, "sg": "", "st": 0, "top": false, "new": false}, {"id": "TX12", "t": "TX", "q": "Write the assumptions of Stokes' law.", "bq": "স্টোকসের সূত্রের অনুমানগুলো লেখো।", "a": "<p class=\"pp\">Stokes’ law is true only when these assumptions are met:</p><div class=\"pt\"><span class=\"n\">1</span><div>The particles are perfectly <b>spherical</b>, smooth and rigid.</div></div><div class=\"pt\"><span class=\"n\">2</span><div>All particles have the <b>same density</b>.</div></div><div class=\"pt\"><span class=\"n\">3</span><div>The particles fall <b>freely</b> and do not touch or disturb each other (dilute suspension).</div></div><div class=\"pt\"><span class=\"n\">4</span><div>The liquid is <b>uniform</b> (homogeneous) with a constant viscosity.</div></div><div class=\"pt\"><span class=\"n\">5</span><div>The flow is <b>laminar</b> (streamline), no turbulence or eddies; the particle reaches a steady (terminal) velocity.</div></div><div class=\"pt\"><span class=\"n\">6</span><div>The container is wide, so walls do not affect the fall; the particles are much larger than liquid molecules.</div></div><div class=\"tipb\"><b>In real soil</b> particles are not truly spherical (clay is flat), so the result is only an equivalent diameter.</div><div class=\"sm\"><span class=\"smh\">সারকথা</span>স্টোকসের সূত্রের অনুমান: কণা সম্পূর্ণ গোলাকার, মসৃণ ও কঠিন; সব কণার ঘনত্ব সমান; কণা মুক্তভাবে পড়ে ও একে অপরকে বাধা দেয় না; তরল সমসত্ত্ব ও সান্দ্রতা স্থির; প্রবাহ লামিনার (ঘূর্ণি নেই); পাত্রের দেয়ালের প্রভাব নেই। বাস্তবে কণা গোলাকার নয়, তাই মান আনুমানিক।</div>", "y": [[2022, "B3b", 3]], "m": "3", "c": 1, "sg": "", "st": 0, "top": false, "new": false}, {"id": "PY1", "t": "PY", "q": "Differentiate between particle density and bulk density.", "bq": "কণা ঘনত্ব ও আয়তন ঘনত্বের মধ্যে পার্থক্য লেখো।", "a": "<p class=\"pp\">Both are densities of soil, but one counts only the solids and the other counts the whole volume.</p><div class=\"tbw\"><table><tr><th>Point</th><th>Particle density (true density)</th><th>Bulk density</th></tr><tr><td>Meaning</td><td>Mass of dry soil solids per unit volume of the <b>solids only</b></td><td>Mass of dry soil per unit <b>total volume</b> (solids + pores)</td></tr><tr><td>Formula</td><td>D<sub>p</sub> = M<sub>s</sub> / V<sub>s</sub></td><td>D<sub>b</sub> = M<sub>s</sub> / (V<sub>s</sub> + V<sub>pores</sub>)</td></tr><tr><td>Value</td><td>≈ 2.65 g/cm<sup>3</sup> (2.60–2.75) in mineral soil</td><td>1.0–1.6 g/cm<sup>3</sup>; lower than D<sub>p</sub></td></tr><tr><td>Pore space</td><td>Does not include pores</td><td>Includes pores</td></tr><tr><td>Depends on</td><td>Mineral and organic matter composition only</td><td>Structure, compaction, organic matter, texture, tillage</td></tr><tr><td>Variation</td><td>Almost constant for a soil</td><td>Changes with management (high in compacted soil)</td></tr><tr><td>Use</td><td>To calculate porosity and settling (Stokes’ law)</td><td>To calculate porosity, soil weight per hectare and water content</td></tr></table></div><div class=\"tipb\"><b>Porosity (%)</b> = (1 – D<sub>b</sub> / D<sub>p</sub>) × 100. Example: D<sub>b</sub> = 1.325 and D<sub>p</sub> = 2.65 give 50%.</div><div class=\"sm\"><span class=\"smh\">সারকথা</span>কণা ঘনত্ব = শুধু কঠিন কণার ভর ÷ কণার আয়তন (প্রায় ২.৬৫ গ্রাম/সেমি³, প্রায় স্থির)। আয়তন ঘনত্ব = শুকনো মাটির ভর ÷ মোট আয়তন (কণা + ফাঁকা), মান ১.০–১.৬ গ্রাম/সেমি³, চাপ ও গঠনে বদলায়। আয়তন ঘনত্ব সবসময় কণা ঘনত্বের চেয়ে কম। সছিদ্রতা = (১ – Db/Dp) × ১০০।</div>", "y": [[2025, "B2b", 4], [2024, "B1b", 4], [2022, "B2b", 5]], "m": "4 / 5", "c": 3, "sg": "", "st": 0, "top": true, "new": false}, {"id": "PY2", "t": "PY", "q": "Write the importance of soil temperature in agriculture.", "bq": "কৃষিতে মাটির তাপমাত্রার গুরুত্ব লেখো।", "a": "<p class=\"pp\">Soil temperature controls many processes in agriculture:</p><div class=\"pt\"><span class=\"n\">1</span><div><b>Seed germination and seedling emergence:</b> every crop has its own best temperature.</div></div><div class=\"pt\"><span class=\"n\">2</span><div><b>Root growth and uptake of water and nutrients:</b> low temperature slows them.</div></div><div class=\"pt\"><span class=\"n\">3</span><div><b>Microbial activity:</b> decomposition, nitrification and N-fixation are best at 25–35 °C.</div></div><div class=\"pt\"><span class=\"n\">4</span><div><b>Organic matter decay and nutrient release:</b> faster in warm soil.</div></div><div class=\"pt\"><span class=\"n\">5</span><div><b>Weathering and chemical reactions:</b> speed doubles for each 10 °C rise.</div></div><div class=\"pt\"><span class=\"n\">6</span><div><b>Soil water:</b> warm soil loses water by evaporation; cold soil may freeze.</div></div><div class=\"pt\"><span class=\"n\">7</span><div><b>Plant diseases and pests:</b> some are active at specific temperatures.</div></div><div class=\"pt\"><span class=\"n\">8</span><div>Crop selection and sowing time depend on soil temperature; mulching and irrigation help to control it.</div></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>মাটির তাপমাত্রা বীজের অঙ্কুরোদগম, শিকড়ের বৃদ্ধি, পানি-পুষ্টি শোষণ, অণুজীবের কাজ (২৫–৩৫° সে. সবচেয়ে ভালো), জৈব পদার্থের পচন, রাসায়নিক বিক্রিয়া ও রোগ-পোকার সক্রিয়তা নিয়ন্ত্রণ করে। তাই ফসল ও বপনের সময় বাছাইয়ে এটি গুরুত্বপূর্ণ।</div>", "y": [[2025, "B4b", 3], [2023, "A6b", 3]], "m": "3", "c": 2, "sg": "", "st": 0, "top": false, "new": false}, {"id": "PY3", "t": "PY", "q": "What is soil structure?", "bq": "মাটির গঠন (স্ট্রাকচার) কী?", "a": "<div class=\"df\">Soil structure is the arrangement of sand, silt and clay particles into groups called aggregates (peds), which differ in shape, size and strength.</div><div class=\"pt\"><span class=\"n\">1</span><div>The particles are bound together by organic matter, clay, Fe-Al oxides, roots, fungi and bacterial gums.</div></div><div class=\"pt\"><span class=\"n\">2</span><div>Pores between aggregates allow movement of air and water.</div></div><div class=\"pt\"><span class=\"n\">3</span><div><b>Types by shape:</b> platy, prismatic, columnar, blocky (angular and sub-angular), granular (crumb).</div></div><div class=\"pt\"><span class=\"n\">4</span><div><b>Grade:</b> structureless (single grain or massive), weak, moderate, strong.</div></div><div class=\"pt\"><span class=\"n\">5</span><div>Good structure (granular, crumb) means good aeration, drainage, root growth and resistance to erosion.</div></div><div class=\"tipb\"><b>Texture vs structure:</b> texture = size of particles (permanent); structure = arrangement of particles (can be improved by organic matter and good tillage).</div><div class=\"sm\"><span class=\"smh\">সারকথা</span>মাটির গঠন (স্ট্রাকচার) হলো বালি, পলি ও কাদা কণার দলবদ্ধ হয়ে অ্যাগ্রিগেট বা পেড তৈরি করার বিন্যাস। প্রকার: পাতলা পাতের মতো (প্লেটি), প্রিজম্যাটিক, কলামনার, ব্লকি ও দানাদার। জৈব পদার্থ ও চুন গঠন উন্নত করে; ভালো গঠনে বায়ু, পানি ও শিকড়ের বৃদ্ধি ভালো হয়।</div>", "y": [[2024, "B2a", 2], [2023, "B2a", 2]], "m": "2", "c": 2, "sg": "", "st": 0, "top": false, "new": false}, {"id": "PY4", "t": "PY", "q": "Write the factors affecting soil temperature (temperature fluctuation).", "bq": "মাটির তাপমাত্রা প্রভাবিতকারী বিষয়গুলো লেখো।", "a": "<div class=\"tbw\"><table><tr><th>Factor</th><th>Effect on soil temperature</th></tr><tr><td><b>Solar radiation</b></td><td>More sunlight (low latitude, summer, noon) = warmer soil</td></tr><tr><td><b>Colour</b></td><td>Dark soil absorbs more heat; light soil reflects it</td></tr><tr><td><b>Moisture content</b></td><td>Water has high specific heat, so wet soil warms and cools slowly; dry soil changes quickly</td></tr><tr><td><b>Texture</b></td><td>Sandy soil warms quickly (warm soil); clay holds water, so it is cold</td></tr><tr><td
