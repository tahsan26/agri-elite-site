><b>Vegetation and mulch</b></td><td>Cover shades the soil, keeps it cooler in summer, warmer in winter</td></tr><tr><td><b>Slope and aspect</b></td><td>Slopes facing the sun are warmer</td></tr><tr><td><b>Altitude</b></td><td>Higher places are cooler</td></tr><tr><td><b>Organic matter, structure, tillage</b></td><td>Loose, porous soil is a poor conductor; humus makes soil dark and moist</td></tr></table></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>মাটির তাপমাত্রা নির্ভর করে সূর্যালোক (অক্ষাংশ, ঋতু), মাটির রং (গাঢ় বেশি তাপ শোষে), আর্দ্রতা (ভেজা মাটি ধীরে গরম/ঠান্ডা হয়), বুনট (বেলে মাটি দ্রুত গরম হয়), গাছপালা ও মালচ, ঢালের দিক, উচ্চতা, জৈব পদার্থ ও চাষের ওপর।</div>", "y": [[2024, "B4b", 3], [2022, "A5b", 3]], "m": "3", "c": 2, "sg": "", "st": 0, "top": false, "new": false}, {"id": "PY5", "t": "PY", "q": "Define particle density, bulk density and porosity.", "bq": "কণা ঘনত্ব, আয়তন ঘনত্ব ও সছিদ্রতা (পোরোসিটি) সংজ্ঞা দাও।", "a": "<div class=\"tbw\"><table><tr><th>Term</th><th>Definition</th><th>Typical value</th></tr><tr><td><b>Particle density</b> (D<sub>p</sub>)</td><td>Mass of soil solids per unit volume of the solids (without pores). D<sub>p</sub> = M<sub>s</sub> / V<sub>s</sub></td><td>≈ 2.65 g/cm<sup>3</sup></td></tr><tr><td><b>Bulk density</b> (D<sub>b</sub>)</td><td>Mass of oven-dry soil per unit total volume of soil (solids + pore space). D<sub>b</sub> = M<sub>s</sub> / V<sub>t</sub></td><td>1.0–1.6 g/cm<sup>3</sup></td></tr><tr><td><b>Porosity</b> (f)</td><td>Percentage of total soil volume occupied by pores (air + water). f = (V<sub>pores</sub> / V<sub>t</sub>) × 100 = (1 – D<sub>b</sub>/D<sub>p</sub>) × 100</td><td>30–60%</td></tr></table></div><div class=\"pt\"><span class=\"n\">1</span><div><b>Macropores (large, &gt; 0.08 mm):</b> drainage and aeration; more in sandy soil.</div></div><div class=\"pt\"><span class=\"n\">2</span><div><b>Micropores (small, &lt; 0.08 mm):</b> hold water; more in clay soil.</div></div><div class=\"pt\"><span class=\"n\">3</span><div>Sandy soil has lower total porosity (35–50%) than clay soil (40–60%).</div></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>কণা ঘনত্ব = কঠিন অংশের ভর ÷ কঠিন অংশের আয়তন (≈২.৬৫)। আয়তন ঘনত্ব = শুকনো মাটির ভর ÷ মোট আয়তন (১.০–১.৬)। সছিদ্রতা = মোট আয়তনের কত শতাংশ ফাঁকা = (১ – Db/Dp) × ১০০, সাধারণত ৩০–৬০%। বেলে মাটিতে বড় ছিদ্র বেশি, এঁটেল মাটিতে ছোট ছিদ্র বেশি।</div>", "y": [[2023, "B1a", 3], [2021, "B7", 3]], "m": "3", "c": 2, "sg": "", "st": 0, "top": false, "new": false}, {"id": "PY6", "t": "PY", "q": "Describe soil aggregates and the two structural types with diagrams.", "bq": "মাটির অ্যাগ্রিগেট বর্ণনা করো এবং দুই ধরনের গঠন চিত্রসহ লেখো।", "a": "<div class=\"df\"><b>Aggregate (ped)</b> is a cluster of primary soil particles (sand, silt, clay) held together by organic matter, clay and oxides to form a single natural unit. A <b>clod</b> is made artificially by tillage.</div><div class=\"fig\"><svg viewBox=\"0 0 430 104\" width=\"430\" height=\"104\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(0,6)\"><rect x=\"8\" y=\"14\" width=\"64\" height=\"8\" rx=\"2\" fill=\"#A1887F\" stroke=\"#6D4C41\"/><rect x=\"8\" y=\"25\" width=\"64\" height=\"8\" rx=\"2\" fill=\"#A1887F\" stroke=\"#6D4C41\"/><rect x=\"8\" y=\"36\" width=\"64\" height=\"8\" rx=\"2\" fill=\"#A1887F\" stroke=\"#6D4C41\"/><rect x=\"8\" y=\"47\" width=\"64\" height=\"8\" rx=\"2\" fill=\"#A1887F\" stroke=\"#6D4C41\"/><rect x=\"8\" y=\"58\" width=\"64\" height=\"8\" rx=\"2\" fill=\"#A1887F\" stroke=\"#6D4C41\"/><text x=\"40\" y=\"82\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#223\" text-anchor=\"middle\">Platy</text><text x=\"40\" y=\"96\" font-size=\"10.5\" fill=\"#556\" text-anchor=\"middle\">E horizon</text></g><g transform=\"translate(86,6)\"><rect x=\"10\" y=\"14\" width=\"19\" height=\"56\" fill=\"#A1887F\" stroke=\"#6D4C41\"/><rect x=\"31\" y=\"14\" width=\"19\" height=\"56\" fill=\"#A1887F\" stroke=\"#6D4C41\"/><rect x=\"52\" y=\"14\" width=\"19\" height=\"56\" fill=\"#A1887F\" stroke=\"#6D4C41\"/><text x=\"40\" y=\"82\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#223\" text-anchor=\"middle\">Prismatic</text><text x=\"40\" y=\"96\" font-size=\"10.5\" fill=\"#556\" text-anchor=\"middle\">B, dry areas</text></g><g transform=\"translate(172,6)\"><path d=\"M10,70 V28 Q19.5,8 29,28 V70 Z\" fill=\"#A1887F\" stroke=\"#6D4C41\"/><path d=\"M31,70 V28 Q40.5,8 50,28 V70 Z\" fill=\"#A1887F\" stroke=\"#6D4C41\"/><path d=\"M52,70 V28 Q61.5,8 71,28 V70 Z\" fill=\"#A1887F\" stroke=\"#6D4C41\"/><text x=\"40\" y=\"82\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#223\" text-anchor=\"middle\">Columnar</text><text x=\"40\" y=\"96\" font-size=\"10.5\" fill=\"#556\" text-anchor=\"middle\">B, sodic soil</text></g><g transform=\"translate(258,6)\"><rect x=\"12\" y=\"14\" width=\"26\" height=\"25\" fill=\"#A1887F\" stroke=\"#6D4C41\"/><rect x=\"12\" y=\"42\" width=\"26\" height=\"25\" fill=\"#A1887F\" stroke=\"#6D4C41\"/><rect x=\"42\" y=\"14\" width=\"26\" height=\"25\" fill=\"#A1887F\" stroke=\"#6D4C41\"/><rect x=\"42\" y=\"42\" width=\"26\" height=\"25\" fill=\"#A1887F\" stroke=\"#6D4C41\"/><text x=\"40\" y=\"82\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#223\" text-anchor=\"middle\">Blocky</text><text x=\"40\" y=\"96\" font-size=\"10.5\" fill=\"#556\" text-anchor=\"middle\">B horizon</text></g><g transform=\"translate(344,6)\"><circle cx=\"18\" cy=\"22\" r=\"6.5\" fill=\"#A1887F\" stroke=\"#6D4C41\"/><circle cx=\"18\" cy=\"37\" r=\"6.5\" fill=\"#A1887F\" stroke=\"#6D4C41\"/><circle cx=\"18\" cy=\"52\" r=\"6.5\" fill=\"#A1887F\" stroke=\"#6D4C41\"/><circle cx=\"18\" cy=\"67\" r=\"6.5\" fill=\"#A1887F\" stroke=\"#6D4C41\"/><circle cx=\"33\" cy=\"22\" r=\"6.5\" fill=\"#A1887F\" stroke=\"#6D4C41\"/><circle cx=\"33\" cy=\"37\" r=\"6.5\" fill=\"#A1887F\" stroke=\"#6D4C41\"/><circle cx=\"33\" cy=\"52\" r=\"6.5\" fill=\"#A1887F\" stroke=\"#6D4C41\"/><circle cx=\"33\" cy=\"67\" r=\"6.5\" fill=\"#A1887F\" stroke=\"#6D4C41\"/><circle cx=\"48\" cy=\"22\" r=\"6.5\" fill=\"#A1887F\" stroke=\"#6D4C41\"/><circle cx=\"48\" cy=\"37\" r=\"6.5\" fill=\"#A1887F\" stroke=\"#6D4C41\"/><circle cx=\"48\" cy=\"52\" r=\"6.5\" fill=\"#A1887F\" stroke=\"#6D4C41\"/><circle cx=\"48\" cy=\"67\" r=\"6.5\" fill=\"#A1887F\" stroke=\"#6D4C41\"/><circle cx=\"63\" cy=\"22\" r=\"6.5\" fill=\"#A1887F\" stroke=\"#6D4C41\"/><circle cx=\"63\" cy=\"37\" r=\"6.5\" fill=\"#A1887F\" stroke=\"#6D4C41\"/><circle cx=\"63\" cy=\"52\" r=\"6.5\" fill=\"#A1887F\" stroke=\"#6D4C41\"/><circle cx=\"63\" cy=\"67\" r=\"6.5\" fill=\"#A1887F\" stroke=\"#6D4C41\"/><text x=\"40\" y=\"82\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#223\" text-anchor=\"middle\">Granular</text><text x=\"40\" y=\"96\" font-size=\"10.5\" fill=\"#556\" text-anchor=\"middle\">A horizon</text></g></svg><div class=\"cap\">Types of soil structure with their usual horizon</div></div><div class=\"tbw\"><table><tr><th>Type</th><th>Shape</th><th>Where found</th><th>Remark</th></tr><tr><td><b>Granular (crumb)</b></td><td>Small rounded grains</td><td>A horizon (topsoil)</td><td>Best for plant growth; high organic matter</td></tr><tr><td><b>Blocky</b></td><td>Cubes with angular or rounded edges</td><td>B horizon, humid areas</td><td>Roots penetrate with moderate ease</td></tr><tr><td><b>Platy</b></td><td>Thin horizontal plates</td><td>E horizon, compacted soil</td><td>Slows water and root movement</td></tr><tr><td><b>Prismatic</b></td><td>Vertical pillars, flat top</td><td>B horizon, dry areas</td><td>Common in clay soils</td></tr><tr><td><b>Columnar</b></td><td>Vertical pillars with rounded top</td><td>B horizon, sodic soil</td><td>High sodium, poor drainage</td></tr></table></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>অ্যাগ্রিগেট হলো মাটির কণা জৈব পদার্থ, কাদা ও অক্সাইডে আটকে তৈরি প্রাকৃতিক দলা। প্রধান গঠন: দানাদার (A স্তরে, সবচেয়ে ভালো), ব্লকি (B স্তরে), প্লেটি (পাতলা পাত, শক্ত মাটিতে), প্রিজম্যাটিক ও কলামনার (স্তম্ভ আকৃতি, B স্তরে; কলামনারে মাথা গোল ও সোডিয়াম বেশি)।</div>", "y": [[2023, "B2b", 4], [2021, "B3b", 6]], "m": "4 / 6", "c": 2, "sg": "", "st": 0, "top": false, "new": false}, {"id": "PY7", "t": "PY", "q": "\"Particle density is always higher than bulk density\" — explain.", "bq": "\"কণা ঘনত্ব সবসময় আয়তন ঘনত্বের চেয়ে বেশি\" — ব্যাখ্যা করো।", "a": "<p class=\"pp\"><b>Explanation:</b> Particle density (D<sub>p</sub>) is the mass of solids divided by the volume of the <b>solids only</b>. Bulk density (D<sub>b</sub>) is the same mass divided by the <b>total volume</b>, which includes the pore spaces.</p><div class=\"pt\"><span class=\"n\">1</span><div>Total volume = volume of solids + volume of pores, so V<sub>t</sub> is always bigger than V<sub>s</sub>.</div></div><div class=\"pt\"><span class=\"n\">2</span><div>The mass is the same, so D<sub>b</sub> = M<sub>s</sub>/V<sub>t</sub> is always smaller than D<sub>p</sub> = M<sub>s</sub>/V<sub>s</sub>.</div></div><div class=\"pt\"><span class=\"n\">3</span><div>D<sub>b</sub> = D<sub>p</sub> (1 – f). Since porosity f is never zero in soil (30–60%), D<sub>b</sub> is always less than D<sub>p</sub>.</div></div><div class=\"pt\"><span class=\"n\">4</span><div><b>Example:</b> D<sub>p</sub> = 2.65 and D<sub>b</sub> = 1.33 g/cm<sup>3</sup> (porosity 50%).</div></div><p class=\"pp\">They would be equal only if the soil had no pores at all, which does not happen in real soil.</p><div class=\"sm\"><span class=\"smh\">সারকথা</span>কণা ঘনত্ব হিসাবে শুধু কঠিন কণার আয়তন ধরা হয়, আর আয়তন ঘনত্বে ফাঁকা জায়গাসহ মোট আয়তন ধরা হয়। মোট আয়তন কঠিন আয়তনের চেয়ে বড়, তাই একই ভরে আয়তন ঘনত্ব সবসময় কম। Db = Dp (১ – f), মাটিতে সছিদ্রতা কখনো শূন্য নয়।</div>", "y": [[2023, "B1b", 3]], "m": "3", "c": 1, "sg": "", "st": 0, "top": false, "new": false}, {"id": "OG1", "t": "OG", "q": "Name some important genera of blue-green algae (BGA) found in Bangladesh.", "bq": "বাংলাদেশে প্রাপ্ত গুরুত্বপূর্ণ নীলাভ-সবুজ শৈবাল (BGA) এর কয়েকটি গণের নাম লেখো।", "a": "<p class=\"pp\">Important genera (গণ) of blue-green algae (BGA) found in the rice fields of Bangladesh:</p><div class=\"tbw\"><table><tr><th>Genus</th><th>Note</th></tr><tr><td><b>Anabaena</b></td><td>Filamentous, with heterocyst; also lives in Azolla</td></tr><tr><td><b>Nostoc</b></td><td>Beaded filaments in jelly colony</td></tr><tr><td><b>Aulosira</b></td><td>Aulosira fertilissima: best N-fixer in rice</td></tr><tr><td><b>Tolypothrix</b></td><td>Branched filament, heterocyst</td></tr><tr><td><b>Scytonema</b></td><td>False branching</td></tr><tr><td><b>Calothrix</b></td><td>Tapered filament</td></tr><tr><td><b>Cylindrospermum, Gloeotrichia, Westiellopsis</b></td><td>Other N-fixers</td></tr><tr><td>Oscillatoria</td><td>No heterocyst; not an N-fixer</td></tr></table></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>বাংলাদেশের ধানক্ষেতে পাওয়া গুরুত্বপূর্ণ নীলাভ-সবুজ শৈবালের গণ: অ্যানাবিনা, নস্টক, অলোসিরা (Aulosira), টলিপোথ্রিক্স, স্কাইটোনেমা, ক্যালোথ্রিক্স, সিলিন্ড্রোস্পার্মাম ও গ্লোইওট্রিকিয়া। এদের হেটেরোসিস্ট দিয়ে বায়ুর নাইট্রোজেন আটকায়।</div>", "y": [[2025, "B6a", 2], [2022, "A7a", 3]], "m": "2 / 3", "c": 2, "sg": "", "st": 0, "top": true, "new": false}, {"id": "OG2", "t": "OG", "q": "Differentiate between bacteria and algae.", "bq": "ব্যাকটেরিয়া ও শৈবালের মধ্যে পার্থক্য লেখো।", "a": "<div class=\"tbw\"><table><tr><th>Point</th><th>Bacteria</th><th>Algae</th></tr><tr><td>Cell type</td><td>Prokaryotic</td><td>Eukaryotic (except BGA, prokaryotic)</td></tr><tr><td>Nutrition</td><td>Mostly heterotrophic; some autotrophic</td><td>Autotrophic (photosynthetic)</td></tr><tr><td>Pigment</td><td>Absent (except photosynthetic bacteria)</td><td>Chlorophyll and other pigments present</td></tr><tr><td>Cell wall</td><td>Peptidoglycan</td><td>Cellulose and pectin</td></tr><tr><td>Size</td><td>Very small (0.5–5 µm)</td><td>Larger (µm to cm)</td></tr><tr><td>Light need</td><td>Not needed (most)</td><td>Needed</td></tr><tr><td>Reproduction</td><td>Binary fission, endospore</td><td>Fission, fragmentation, spores, sexual gametes</td></tr><tr><td>Habitat</td><td>Deep soil also, everywhere</td><td>Soil surface, water; where light reaches</td></tr><tr><td>Role</td><td>Decomposition, N-fixation, nitrification</td><td>Add organic matter, BGA fix nitrogen, bind soil</td></tr><tr><td>Examples</td><td>Bacillus, Rhizobium</td><td>Chlorella, Anabaena</td></tr></table></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>ব্যাকটেরিয়া প্রোক্যারিওট, বেশিরভাগ পরভোজী, রঞ্জক নেই, কোষপ্রাচীরে পেপটিডোগ্লাইক্যান, আলো লাগে না, বিভাজনে জনন। শৈবাল (নীলাভ-সবুজ ছাড়া) ইউক্যারিওট, স্বভোজী, ক্লোরোফিল আছে, আলো লাগে, কোষপ্রাচীর সেলুলোজের, যৌন ও অযৌন দুভাবে জনন হয়।</div>", "y": [[2025, "B6b", 4], [2023, "B6b", 4]], "m": "4", "c": 2, "sg": "", "st": 0, "top": false, "new": false}, {"id": "OG3", "t": "OG", "q": "Name the organisms/microorganisms present in soil.", "bq": "মাটিতে বসবাসকারী জীব/অণুজীবের নাম লেখো।", "a": "<p class=\"pp\">Many organisms live in soil. Typical numbers per gram of soil are given (approx.):</p><div class=\"tbw\"><table><tr><th>Group</th><th>Examples</th><th>Number per g soil</th></tr><tr><td><b>Bacteria</b></td><td>Rhizobium, Azotobacter, Bacillus, Pseudomonas</td><td>10<sup>8</sup> – 10<sup>9</sup> (most)</td></tr><tr><td><b>Actinomycetes</b></td><td>Streptomyces, Frankia</td><td>10<sup>7</sup> – 10<sup>8</sup></td></tr><tr><td><b>Fungi</b></td><td>Aspergillus, Penicillium, mycorrhiza</td><td>10<sup>5</sup> – 10<sup>6</sup></td></tr><tr><td><b>Algae</b></td><td>Blue-green algae (Anabaena, Nostoc), green algae, diatoms</td><td>10<sup>4</sup> – 10<sup>5</sup></td></tr><tr><td><b>Protozoa</b></td><td>Amoeba, ciliates</td><td>10<sup>3</sup> – 10<sup>4</sup></td></tr><tr><td><b>Nematodes and other animals</b></td><td>Nematodes, mites, springtails, earthworms, ants, termites, millipedes</td><td>Few to many</td></tr><tr><td><b>Plant roots</b></td><td>Roots of higher plants</td><td>—</td></tr></table></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>মাটিতে ব্যাকটেরিয়া (সবচেয়ে বেশি), অ্যাকটিনোমাইসিট, ছত্রাক, শৈবাল, প্রোটোজোয়া, নেমাটোড, কেঁচো, পিঁপড়া, উইপোকা, মাইট ও উদ্ভিদের শিকড় বাস করে। এক গ্রাম মাটিতে ব্যাকটেরিয়া ১০⁸–১০⁹ টি, ছত্রাক ১০⁵–১০⁶ টি পর্যন্ত থাকে।</div>", "y": [[2024, "B7a", 1], [2022, "A6a", 2]], "m": "1 / 2", "c": 2, "sg": "", "st": 0, "top": false, "new": false}, {"id": "OG4", "t": "OG", "q": "Classify bacteria on the basis of morphology with examples.", "bq": "আকৃতি অনুসারে ব্যাকটেরিয়ার শ্রেণিবিভাগ উদাহরণসহ লেখো।", "a": "<div class=\"df\">On the basis of shape (morphology), bacteria are of three main types.</div><div class=\"fig\"><svg viewBox=\"0 0 430 150\" width=\"430\" height=\"150\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"20\" cy=\"22\" r=\"8\" fill=\"#2E7D32\"/><g><circle cx=\"52\" cy=\"22\" r=\"8\" fill=\"#2E7D32\"/><circle cx=\"68\" cy=\"22\" r=\"8\" fill=\"#2E7D32\"/></g><g><circle cx=\"98\" cy=\"22\" r=\"7\" fill=\"#2E7D32\"/><circle cx=\"114\" cy=\"22\" r=\"7\" fill=\"#2E7D32\"/><circle cx=\"130\" cy=\"22\" r=\"7\" fill=\"#2E7D32\"/><circle cx=\"146\" cy=\"22\" r=\"7\" fill=\"#2E7D32\"/></g><g><circle cx=\"170\" cy=\"14\" r=\"6\" fill=\"#2E7D32\"/><circle cx=\"184\" cy=\"14\" r=\"6\" fill=\"#2E7D32\"/><circle cx=\"170\" cy=\"27\" r=\"6\" fill=\"#2E7D32\"/><circle cx=\"184\" cy=\"27\" r=\"6\" fill=\"#2E7D32\"/><circle cx=\"177\" cy=\"21\" r=\"6\" fill=\"#2E7D32\"/></g><rect x=\"12\" y=\"70\" width=\"30\" height=\"13\" rx=\"6\" fill=\"#1565C0\"/><rect x=\"52\" y=\"70\" width=\"14\" height=\"13\" rx=\"6\" fill=\"#1565C0\"/><rect x=\"68\" y=\"70\" width=\"14\" height=\"13\" rx=\"6\" fill=\"#1565C0\"/><rect x=\"100\" y=\"70\" width=\"20\" height=\"13\" rx=\"6\" fill=\"#1565C0\"/><rect x=\"122\" y=\"70\" width=\"20\" height=\"13\" rx=\"6\" fill=\"#1565C0\"/><rect x=\"144\" y=\"70\" width=\"20\" height=\"13\" rx=\"6\" fill=\"#1565C0\"/><rect x=\"166\" y=\"70\" width=\"20\" height=\"13\" rx=\"6\" fill=\"#1565C0\"/><path d=\"M20,128 q8,-16 16,0 t16,0\" stroke=\"#C62828\" stroke-width=\"5\" fill=\"none\"/><path d=\"M76,134 q8,-24 22,-16\" stroke=\"#C62828\" stroke-width=\"5\" fill=\"none\"/><path d=\"M130,128 q6,-16 12,0 t12,0 t12,0 t12,0\" stroke=\"#C62828\" stroke-width=\"3\" fill=\"none\"/><text x=\"250\" y=\"20\" font-size=\"13\" fill=\"#223\">Cocci: single, diplo, chain, cluster, sarcina</text><text x=\"250\" y=\"80\" font-size=\"13\" fill=\"#223\">Bacilli: single, diplo, chain (rods)</text><text x=\"250\" y=\"128\" font-size=\"13\" fill=\"#223\">Spiral: vibrio, spirillum, spirochaete</text></svg><div class=\"cap\">Shapes of bacteria</div></div><div class=\"tbw\"><table><tr><th>Type</th><th>Shape</th><th>Sub-types</th><th>Examples</th></tr><tr><td><b>Cocci</b></td><td>Spherical / oval</td><td>Micrococcus (single), Diplococcus (pair), Streptococcus (chain), Staphylococcus (cluster), Tetrad (4), Sarcina (cube of 8)</td><td>Micrococcus, Sarcina, Streptococcus</td></tr><tr><td><b>Bacilli</b></td><td>Rod shaped</td><td>Single rod, Diplobacilli (pair), Streptobacilli (chain), palisade</td><td>Bacillus, Rhizobium, Azotobacter, Pseudomonas, Clostridium</td></tr><tr><td><b>Spirilla</b></td><td>Spiral / curved</td><td>Vibrio (comma shaped), Spirillum (rigid spiral), Spirochaete (flexible)</td><td>Vibrio cholerae, Spirillum, Azospirillum</td></tr></table></div><p class=\"pp\">Other forms: filamentous (Streptomyces, an actinomycete) and pleomorphic (Rhizobium bacteroid, Y or club shaped).</p><div class=\"sm\"><span class=\"smh\">সারকথা</span>আকৃতি অনুসারে ব্যাকটেরিয়া তিন প্রকার: কক্কাই (গোলাকার, যেমন মাইক্রোকক্কাস, সারসিনা), ব্যাসিলাই (দণ্ডাকার, যেমন ব্যাসিলাস, রাইজোবিয়াম, অ্যাজোটোব্যাক্টর) ও স্পাইরিলা (প্যাঁচানো, যেমন ভিব্রিও, স্পিরিলাম)। কক্কাই একক, জোড়া, শিকল বা গুচ্ছ আকারে থাকতে পারে।</div>", "y": [[2024, "B7b", 5], [2021, "B6b", 7]], "m": "5 / 7", "c": 2, "sg": "", "st": 0, "top": false, "new": false}, {"id": "OG5", "t": "OG", "q": "Classify algae.", "bq": "শৈবালের শ্রেণিবিভাগ করো।", "a": "<div class=\"df\">Algae are simple, chlorophyll-bearing, photosynthetic organisms with no true root, stem or leaf. On the basis of pigments and food reserve they are placed in classes.</div><div class=\"tbw\"><table><tr><th>Class</th><th>Colour</th><th>Soil examples</th></tr><tr><td><b>Cyanophyceae</b> (blue-green algae, BGA)</td><td>Blue-green (prokaryote)</td><td>Anabaena, Nostoc, Aulosira, Oscillatoria</td></tr><tr><td><b>Chlorophyceae</b></td><td>Green</td><td>Chlorella, Chlamydomonas, Chlorococcum</td></tr><tr><td><b>Bacillariophyceae</b> (diatoms)</td><td>Golden-brown</td><td>Navicula, Pinnularia</td></tr><tr><td><b>Xanthophyceae</b></td><td>Yellow-green</td><td>Botrydium, Vaucheria</td></tr><tr><td>Phaeophyceae</td><td>Brown (marine)</td><td>Sargassum</td></tr><tr><td>Rhodophyceae</td><td>Red (marine)</td><td>Polysiphonia</td></tr></table></div><p class=\"pp\">Soil mainly contains the first four groups. BGA are most useful because they fix nitrogen.</p><div class=\"sm\"><span class=\"smh\">সারকথা</span>শৈবাল সালোকসংশ্লেষণকারী সরল জীব। রঞ্জকের ভিত্তিতে শ্রেণি: সায়ানোফাইসি (নীলাভ-সবুজ, যেমন অ্যানাবিনা, নস্টক), ক্লোরোফাইসি (সবুজ, যেমন ক্লোরেলা), ব্যাসিলারিওফাইসি (ডায়াটম), জ্যান্থোফাইসি (হলদে-সবুজ), ফিওফাইসি (বাদামি) ও রোডোফাইসি (লাল)। মাটিতে প্রথম চারটি বেশি।</div>", "y": [[2024, "B6a", 2], [2022, "A7a", 3]], "m": "2 / 3", "c": 2, "sg": "", "st": 0, "top": false, "new": false}, {"id": "OG6", "t": "OG", "q": "Why is BGA used as a biofertilizer?", "bq": "নীলাভ-সবুজ শৈবাল কেন জৈবসার হিসেবে ব্যবহৃত হয়?", "a": "<p class=\"pp\">Blue-green algae (BGA) are used as a biofertilizer, especially in rice, for these reasons:</p><div class=\"pt\"><span class=\"n\">1</span><div><b>Nitrogen fixation:</b> heterocyst and the enzyme nitrogenase fix atmospheric N<sub>2</sub>; about 20–30 kg N/ha per season in rice.</div></div><div class=\"pt\"><span class=\"n\">2</span><div><b>Self-made food:</b> they are photosynthetic, so need only light, water and CO<sub>2</sub>, with no costly food.</div></div><div class=\"pt\"><span class=\"n\">3</span><div><b>Growth substances:</b> release auxin, gibberellin and vitamin B<sub>12</sub> that help rice growth.</div></div><div class=\"pt\"><span class=\"n\">4</span><div><b>Organic matter:</b> when they die, they add organic matter and N, improving structure and water holding.</div></div><div class=\"pt\"><span class=\"n\">5</span><div>Reclaim saline and alkaline soils; increase availability of phosphorus.</div></div><div class=\"pt\"><span class=\"n\">6</span><div>Cheap, eco-friendly, no pollution, easy to multiply in rice fields (algalization: spreading BGA culture).</div></div><div class=\"pt\"><span class=\"n\">7</span><div>Rice fields give the warm, wet, sunny, neutral-to-alkaline condition BGA need.</div></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>নীলাভ-সবুজ শৈবাল বায়ুর নাইট্রোজেন আটকায় (ধানে প্রতি হেক্টরে মৌসুমে ২০–৩০ কেজি N), নিজে সালোকসংশ্লেষণে খাদ্য তৈরি করে, বৃদ্ধি-হরমোন ও ভিটামিন দেয়, মরে গেলে জৈব পদার্থ যোগ করে, লবণাক্ত-ক্ষারীয় মাটি সংশোধনে সাহায্য করে এবং সস্তা ও পরিবেশবান্ধব। তাই ধানক্ষেতে জৈবসার হিসেবে উপযুক্ত।</div>", "y": [[2024, "B6b", 4], [2022, "A7b", 3]], "m": "3 / 4", "c": 2, "sg": "", "st": 0, "top": false, "new": false}, {"id": "OG7", "t": "OG", "q": "Write the characteristics of blue-green algae (BGA).", "bq": "নীলাভ-সবুজ শৈবালের বৈশিষ্ট্য লেখো।", "a": "<div class=\"df\">Blue-green algae (BGA) are prokaryotic, photosynthetic micro-organisms also called cyanobacteria.</div><div class=\"pt\"><span class=\"n\">1</span><div><b>Prokaryotic cell:</b> no true nucleus, no mitochondria or chloroplast.</div></div><div class=\"pt\"><span class=\"n\">2</span><div><b>Pigments:</b> chlorophyll-a, phycocyanin (blue) and phycoerythrin (red), so blue-green colour.</div></div><div class=\"pt\"><span class=\"n\">3</span><div>Unicellular, colonial or filamentous; cell wall of peptidoglycan with mucilage (jelly) sheath.</div></div><div class=\"pt\"><span class=\"n\">4</span><div>No flagella; filaments move by gliding.</div></div><div class=\"pt\"><span class=\"n\">5</span><div><b>Heterocyst:</b> thick-walled special cell that fixes atmospheric nitrogen (nitrogenase). <b>Akinete:</b> resting spore.</div></div><div class=\"pt\"><span class=\"n\">6</span><div><b>Reproduce only asexually:</b> binary fission, hormogonia, akinetes; no sexual reproduction.</div></div><div class=\"pt\"><span class=\"n\">7</span><div>Live in wet soil, ponds and rice fields, prefer neutral to alkaline pH (7–9) and warm temperature; need light and water.</div></div><div class=\"pt\"><span class=\"n\">8</span><div><b>Food reserve:</b> cyanophycin and glycogen (not starch).</div></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>নীলাভ-সবুজ শৈবাল (সায়ানোব্যাকটেরিয়া) প্রোক্যারিওটিক ও সালোকসংশ্লেষী; ক্লোরোফিল-a, ফাইকোসায়ানিন ও ফাইকোএরিথ্রিন থাকে। এককোষী, গুচ্ছ বা সুতার মতো; হেটেরোসিস্ট দিয়ে নাইট্রোজেন আটকায়; অযৌন জনন (বিভাজন, হরমোগোনিয়া, অ্যাকাইনেট); ধানক্ষেত ও ভেজা মাটিতে (pH ৭–৯) ভালো জন্মায়।</div>", "y": [[2023, "B6a", 2], [2021, "B7", 3]], "m": "2 / 3", "c": 2, "sg": "", "st": 0, "top": false, "new": false}, {"id": "OG8", "t": "OG", "q": "Differentiate: prokaryote vs eukaryote, obligate vs facultative bacteria (and symbiotic vs free-living).", "bq": "পার্থক্য লেখো: প্রোক্যারিওট ও ইউক্যারিওট, অবলিগেট ও ফ্যাকাল্টেটিভ ব্যাকটেরিয়া (এবং মিথোজীবী ও মুক্তজীবী)।", "a": "<p class=\"pp\"><b>1. Prokaryote vs Eukaryote</b></p><div class=\"tbw\"><table><tr><th>Point</th><th>Prokaryote</th><th>Eukaryote</th></tr><tr><td>Nucleus</td><td>No true nucleus (no nuclear membrane); DNA lies in nucleoid</td><td>True nucleus with nuclear membrane</td></tr><tr><td>Organelles</td><td>Absent (no mitochondria, chloroplast)</td><td>Present</td></tr><tr><td>Cell size</td><td>Small (0.5–5 µm)</td><td>Large (10–100 µm)</td></tr><tr><td>DNA</td><td>Single circular chromosome</td><td>Many linear chromosomes</td></tr><tr><td>Ribosome</td><td>70S</td><td>80S</td></tr><tr><td>Cell wall</td><td>Peptidoglycan</td><td>Cellulose or chitin</td></tr><tr><td>Examples</td><td>Bacteria, actinomycetes, blue-green algae</td><td>Fungi, true algae, protozoa</td></tr></table></div><p class=\"pp\"><b>2. Obligate vs Facultative bacteria</b></p><div class=\"tbw\"><table><tr><th>Point</th><th>Obligate</th><th>Facultative</th></tr><tr><td>Meaning</td><td>Can live in only one condition</td><td>Can live in either condition</td></tr><tr><td>Obligate aerobe</td><td>Needs O<sub>2</sub> (Azotobacter, Nitrobacter)</td><td>—</td></tr><tr><td>Obligate anaerobe</td><td>Killed by O<sub>2</sub> (Clostridium)</td><td>—</td></tr><tr><td>Facultative</td><td>—</td><td>Live with or without O<sub>2</sub> (Bacillus, Pseudomonas, E. coli)</td></tr></table></div><p class=\"pp\"><b>3. Symbiotic vs Free-living bacteria</b></p><div class=\"tbw\"><table><tr><th>Point</th><th>Symbiotic</th><th>Free-living (non-symbiotic)</th></tr><tr><td>Life</td><td>Live in partnership with a host plant, both benefit</td><td>Live independently in soil</td></tr><tr><td>N-fixation</td><td>In root nodules of legumes</td><td>In the soil by themselves</td></tr><tr><td>Examples</td><td>Rhizobium, Bradyrhizobium</td><td>Azotobacter, Clostridium, Beijerinckia</td></tr></table></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>প্রোক্যারিওটে সত্যিকারের নিউক্লিয়াস ও অঙ্গাণু নেই, কোষ ছোট (ব্যাকটেরিয়া, নীলাভ-সবুজ শৈবাল); ইউক্যারিওটে নিউক্লিয়াস ও অঙ্গাণু আছে (ছত্রাক, শৈবাল, প্রোটোজোয়া)। অবলিগেট বাঁচে একটি অবস্থায় (O₂ লাগে বা O₂ ছাড়া), ফ্যাকাল্টেটিভ দুই অবস্থায়ই বাঁচে। মিথোজীবী ব্যাকটেরিয়া (রাইজোবিয়াম) শিকড়গুটিতে, মুক্তজীবী (অ্যাজোটোব্যাক্টর) মাটিতে নাইট্রোজেন আটকায়।</div>", "y": [[2022, "A6b", 4], [2021, "B5b", 6]], "m": "4 / 6", "c": 2, "sg": "", "st": 0, "top": false, "new": false}, {"id": "OG9", "t": "OG", "q": "Write the systematic position of bacteria.", "bq": "ব্যাকটেরিয়ার শ্রেণিবিন্যাসগত অবস্থান লেখো।", "a": "<p class=\"pp\">Systematic position of bacteria:</p><div class=\"tbw\"><table><tr><th>Level</th><th>Position</th></tr><tr><td>Domain (Woese)</td><td>Bacteria</td></tr><tr><td>Kingdom (Whittaker)</td><td>Monera (prokaryotes)</td></tr><tr><td>Division (older classification)</td><td>Schizophyta (fission plants)</td></tr><tr><td>Class</td><td>Schizomycetes</td></tr><tr><td>Order</td><td>Eubacteriales (true bacteria)</td></tr></table></div><p class=\"pp\">Bacteria are unicellular, prokaryotic micro-organisms that multiply mostly by binary fission.</p><div class=\"sm\"><span class=\"smh\">সারকথা</span>ব্যাকটেরিয়ার অবস্থান: ডোমেইন Bacteria, জগৎ (কিংডম) Monera (প্রোক্যারিওট), পুরোনো শ্রেণিবিন্যাসে ডিভিশন Schizophyta, ক্লাস Schizomycetes, বর্গ Eubacteriales। এরা এককোষী, প্রোক্যারিওটিক অণুজীব, বিভাজনে বংশবৃদ্ধি করে।</div>", "y": [[2025, "B7a", 1]], "m": "1", "c": 1, "sg": "", "st": 0, "top": false, "new": false}, {"id": "OG10", "t": "OG", "q": "Describe the different heterotrophic bacteria with examples.", "bq": "বিভিন্ন হেটারোট্রফিক ব্যাকটেরিয়া উদাহরণসহ বর্ণনা করো।", "a": "<div class=\"df\">Heterotrophic bacteria get carbon and energy from organic compounds (they cannot make food from CO<sub>2</sub>). Most soil bacteria are heterotrophic.</div><div class=\"tbw\"><table><tr><th>Group</th><th>Role</th><th>Examples</th></tr><tr><td><b>Saprophytic</b> (decomposers)</td><td>Decompose dead plants, animals; release nutrients</td><td>Bacillus, Pseudomonas, Clostridium, Cellulomonas (cellulose decomposer)</td></tr><tr><td><b>Symbiotic N-fixers</b></td><td>Fix N<sub>2</sub> in root nodules of legumes</td><td>Rhizobium, Bradyrhizobium (Frankia in Alnus)</td></tr><tr><td><b>Free-living N-fixers</b></td><td>Fix N<sub>2</sub> without host</td><td>Azotobacter (aerobic), Beijerinckia, Clostridium pasteurianum (anaerobic), Azospirillum (associative)</td></tr><tr><td><b>Ammonifiers</b></td><td>Convert protein to NH<sub>4</sub><sup>+</sup></td><td>Bacillus, Pseudomonas</td></tr><tr><td><b>Denitrifiers</b></td><td>NO<sub>3</sub><sup>–</sup> to N<sub>2</sub> gas (N loss)</td><td>Pseudomonas, Bacillus</td></tr><tr><td><b>Parasitic (pathogens)</b></td><td>Cause plant disease</td><td>Agrobacterium (crown gall), Xanthomonas oryzae (bacterial blight of rice), Ralstonia (wilt)</td></tr></table></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>হেটারোট্রফিক ব্যাকটেরিয়া জৈব যৌগ থেকে খাদ্য ও শক্তি নেয়। এরা সাপ্রোফাইট (ব্যাসিলাস, সিউডোমোনাস), মিথোজীবী নাইট্রোজেন-সংবন্ধক (রাইজোবিয়াম), মুক্তজীবী সংবন্ধক (অ্যাজোটোব্যাক্টর, ক্লসট্রিডিয়াম), অ্যামোনিফায়ার, ডিনাইট্রিফায়ার ও পরজীবী (অ্যাগ্রোব্যাক্টেরিয়াম) হতে পারে।</div>", "y": [[2025, "B7b", 5]], "m": "5", "c": 1, "sg": "", "st": 0, "top": false, "new": false}, {"id": "OG11", "t": "OG", "q": "Classify bacteria on the basis of physiology (nutrition) with examples.", "bq": "পুষ্টি/শারীরবৃত্তীয় ভিত্তিতে ব্যাকটেরিয়ার শ্রেণিবিভাগ উদাহরণসহ লেখো।", "a": "<div class=\"df\">Physiological classification is based on how bacteria get their carbon and energy (nutrition), and on their need for oxygen and temperature.</div><div class=\"tbw\"><table><tr><th>Group</th><th>Carbon / energy source</th><th>Examples</th></tr><tr><td><b>Photoautotroph</b></td><td>CO<sub>2</sub> + light energy</td><td>Purple and green sulphur bacteria, cyanobacteria (BGA)</td></tr><tr><td><b>Chemoautotroph</b></td><td>CO<sub>2</sub> + energy from oxidising inorganic compounds</td><td>Nitrosomonas (NH<sub>4</sub><sup>+</sup> to NO<sub>2</sub><sup>–</sup>), Nitrobacter (NO<sub>2</sub><sup>–</sup> to NO<sub>3</sub><sup>–</sup>), Thiobacillus (S to SO<sub>4</sub>), Ferrobacillus (Fe<sup>2+</sup> to Fe<sup>3+</sup>)</td></tr><tr><td><b>Heterotroph: saprophytic</b></td><td>Organic carbon from dead matter</td><td>Bacillus, Pseudomonas, Clostridium</td></tr><tr><td><b>Heterotroph: parasitic</b></td><td>Living host</td><td>Agrobacterium tumefaciens, Xanthomonas</td></tr><tr><td><b>Heterotroph: symbiotic</b></td><td>Host plant; gives N in return</td><td>Rhizobium (legume)</td></tr></table></div><p class=\"pp\"><b>By oxygen need:</b> aerobic (Azotobacter), anaerobic (Clostridium), facultative (Bacillus). <b>By temperature:</b> psychrophilic (cold), mesophilic (moderate; most soil bacteria), thermophilic (hot).</p><div class=\"sm\"><span class=\"smh\">সারকথা</span>শারীরবৃত্তীয় (পুষ্টি) ভিত্তিতে ব্যাকটেরিয়া: স্বভোজী (ফটোঅটোট্রফ: নীলাভ-সবুজ শৈবাল; কেমোঅটোট্রফ: নাইট্রোসোমোনাস, নাইট্রোব্যাক্টর, থায়োব্যাসিলাস) ও পরভোজী (সাপ্রোফাইটিক: ব্যাসিলাস; পরজীবী: অ্যাগ্রোব্যাক্টেরিয়াম; মিথোজীবী: রাইজোবিয়াম)। অক্সিজেন অনুসারে বায়ুজীবী, অবায়ুজীবী ও ফ্যাকাল্টেটিভ।</div>", "y": [[2023, "B7", 6]], "m": "6", "c": 1, "sg": "", "st": 0, "top": false, "new": false}, {"id": "OG12", "t": "OG", "q": "Classify soil organisms.", "bq": "মাটির জীবের শ্রেণিবিভাগ করো।", "a": "<p class=\"pp\">Soil organisms are placed in two kingdoms:</p><div class=\"tbw\"><table><tr><th>Group</th><th>Sub-group</th><th>Examples</th></tr><tr><td><b>Soil flora</b> (plants)</td><td>Micro-flora</td><td>Bacteria, actinomycetes, fungi, algae</td></tr><tr><td></td><td>Macro-flora</td><td>Roots of higher plants</td></tr><tr><td><b>Soil fauna</b> (animals)</td><td>Micro-fauna</td><td>Protozoa, nematodes</td></tr><tr><td></td><td>Meso-fauna</td><td>Mites, springtails</td></tr><tr><td></td><td>Macro-fauna</td><td>Earthworms, ants, termites, millipedes, beetles, moles, rodents</td></tr></table></div><p class=\"pp\"><b>By food:</b> autotrophs (make food from CO<sub>2</sub>: algae, some bacteria) and heterotrophs (use organic food: most bacteria, fungi, protozoa, animals).</p><div class=\"sm\"><span class=\"smh\">সারকথা</span>মাটির জীব দুই ভাগে: উদ্ভিদ (ফ্লোরা: ব্যাকটেরিয়া, অ্যাকটিনোমাইসিট, ছত্রাক, শৈবাল, শিকড়) ও প্রাণী (ফনা: প্রোটোজোয়া, নেমাটোড, মাইট, কেঁচো, উইপোকা ইত্যাদি)। খাদ্য অনুসারে স্বভোজী (শৈবাল, কিছু ব্যাকটেরিয়া) ও পরভোজী (বেশিরভাগ ব্যাকটেরিয়া, ছত্রাক)।</div>", "y": [[2021, "B5a", 3]], "m": "3", "c": 1, "sg": "", "st": 0, "top": false, "new": false}, {"id": "OG13", "t": "OG", "q": "Write the systematic position of Azotobacter.", "bq": "অ্যাজোটোব্যাক্টরের শ্রেণিবিন্যাসগত অবস্থান লেখো।", "a": "<p class=\"pp\">Azotobacter is an aerobic, free-living, nitrogen-fixing bacterium. Systematic position:</p><div class=\"tbw\"><table><tr><th>Level</th><th>Position</th></tr><tr><td>Domain</td><td>Bacteria</td></tr><tr><td>Kingdom</td><td>Monera (Bacteria)</td></tr><tr><td>Phylum</td><td>Proteobacteria</td></tr><tr><td>Class</td><td>Gammaproteobacteria</td></tr><tr><td>Order</td><td>Pseudomonadales</td></tr><tr><td>Family</td><td>Azotobacteraceae (Pseudomonadaceae)</td></tr><tr><td>Genus</td><td>Azotobacter</td></tr><tr><td>Species</td><td>A. chroococcum, A. vinelandii</td></tr></table></div><p class=\"pp\">It is an oval to round, Gram-negative rod that fixes nitrogen without a host plant and is used as a biofertilizer for non-legume crops.</p><div class=\"sm\"><span class=\"smh\">সারকথা</span>অ্যাজোটোব্যাক্টর হলো বায়ুজীবী, মুক্তজীবী নাইট্রোজেন-সংবন্ধনকারী ব্যাকটেরিয়া। অবস্থান: ডোমেইন Bacteria, জগৎ Monera, ফাইলাম Proteobacteria, ক্লাস Gammaproteobacteria, বর্গ Pseudomonadales, গণ Azotobacter, প্রজাতি A. chroococcum। এটি জৈবসার হিসেবে ব্যবহার হয়।</div>", "y": [[2021, "B6a", 2]], "m": "2", "c": 1, "sg": "", "st": 0, "top": false, "new": false}, {"id": "NU1", "t": "NU", "q": "Write the available forms and sources of essential plant nutrient elements.", "bq": "উদ্ভিদের অত্যাবশ্যকীয় পুষ্টি উপাদানের প্রাপ্তিযোগ্য রূপ ও উৎস লেখো।", "a": "<p class=\"pp\"><b>17 essential elements.</b> Carbon, hydrogen and oxygen come from air and water; the other 14 come from the soil (minerals, organic matter, fertilizer).</p><div class=\"tbw\"><table><tr><th>Class</th><th>Element</th><th>Available form</th><th>Main source</th></tr><tr><td><b>Macro (structural)</b></td><td>C</td><td>CO<sub>2</sub></td><td>Air</td></tr><tr><td></td><td>H, O</td><td>H<sub>2</sub>O, O<sub>2</sub></td><td>Water, air</td></tr><tr><td><b>Primary macro</b></td><td>N</td><td>NO<sub>3</sub><sup>–</sup>, NH<sub>4</sub><sup>+</sup></td><td>Organic matter, urea, N-fixation</td></tr><tr><td></td><td>P</td><td>H<sub>2</sub>PO<sub>4</sub><sup>–</sup>, HPO<sub>4</sub><sup>2–</sup></td><td>Apatite, organic matter, TSP</td></tr><tr><td></td><td>K</td><td>K<sup>+</sup></td><td>Feldspar, mica, MoP</td></tr><tr><td><b>Secondary macro</b></td><td>Ca</td><td>Ca<sup>2+</sup></td><td>Calcite, dolomite, gypsum</td></tr><tr><td></td><td>Mg</td><td>Mg<sup>2+</sup></td><td>Dolomite, biotite, hornblende</td></tr><tr><td></td><td>S</td><td>SO<sub>4</sub><sup>2–</sup></td><td>Organic matter, gypsum, pyrite</td></tr><tr><td><b>Micro</b></td><td>Fe</td><td>Fe<sup>2+</sup> (Fe<sup>3+</sup>)</td><td>Hematite, biotite</td></tr><tr><td></td><td>Mn</td><td>Mn<sup>2+</sup></td><td>Pyrolusite, MnO<sub>2</sub></td></tr><tr><td></td><td>Zn</td><td>Zn<sup>2+</sup></td><td>Sphalerite, zinc sulphate</td></tr><tr><td></td><td>Cu</td><td>Cu<sup>2+</sup></td><td>Chalcopyrite, copper sulphate</td></tr><tr><td></td><td>B</td><td>H<sub>3</sub>BO<sub>3</sub>, H<sub>2</sub>BO<sub>3</sub><sup>–</sup> (borate)</td><td>Tourmaline, borax</td></tr><tr><td></td><td>Mo</td><td>MoO<sub>4</sub><sup>2–</sup></td><td>Molybdenite, sodium molybdate</td></tr><tr><td></td><td>Cl</td><td>Cl<sup>–</sup></td><td>Salts, rain</td></tr><tr><td></td><td>Ni</td><td>Ni<sup>2+</sup></td><td>Soil minerals</td></tr></table></div><div class=\"tipb\"><b>Micronutrient forms (2024):</b> Fe<sup>2+</sup>, Mn<sup>2+</sup>, Zn<sup>2+</sup>, Cu<sup>2+</sup>, H<sub>3</sub>BO<sub>3</sub>/borate, MoO<sub>4</sub><sup>2–</sup>, Cl<sup>–</sup>, Ni<sup>2+</sup>. <b>Macronutrients (2023):</b> N, P, K (primary); Ca, Mg, S (secondary), plus C, H, O.</div><div class=\"sm\"><span class=\"smh\">সারকথা</span>১৭টি অত্যাবশ্যকীয় উপাদান: C, H, O বাতাস-পানি থেকে; বাকিগুলো মাটি থেকে। প্রাপ্যতার রূপ: N → NO₃⁻/NH₄⁺, P → H₂PO₄⁻/HPO₄²⁻, K → K⁺, Ca → Ca²⁺, Mg → Mg²⁺, S → SO₄²⁻, Fe → Fe²⁺, Mn → Mn²⁺, Zn → Zn²⁺, Cu → Cu²⁺, B → H₃BO₃, Mo → MoO₄²⁻, Cl → Cl⁻। উৎস: বায়ু, পানি, মাটির খনিজ, জৈব পদার্থ ও সার।</div>", "y": [[2025, "A3b", 5], [2024, "A2b", 3], [2023, "B4b", 3], [2022, "A2a", 2], [2021, "A2a", 3]], "m": "2 / 3 / 5", "c": 5, "sg": "", "st": 0, "top": true, "new": false}, {"id": "NU2", "t": "NU", "q": "Write the functions of N, P, K, S, Zn and B in plants.", "bq": "উদ্ভিদে N, P, K, S, Zn ও B এর কাজ লেখো।", "a": "<div class=\"tbw\"><table><tr><th>Element</th><th>Two main functions</th></tr><tr><td><b>N</b></td><td>1) Part of amino acids, protein, chlorophyll, nucleic acids. 2) Promotes vegetative growth, dark green leaves.</td></tr><tr><td><b>P</b></td><td>1) Part of ATP (energy), nucleic acids, phospholipids. 2) Promotes root growth, flowering, seed formation and early maturity.</td></tr><tr><td><b>K</b></td><td>1) Activates many enzymes. 2) Controls stomata opening and water balance; makes plant strong and disease resistant; moves sugar.</td></tr><tr><td><b>S</b></td><td>1) Part of amino acids cysteine and methionine, vitamins, coenzyme A. 2) Helps chlorophyll formation, oil synthesis (mustard) and nodule formation.</td></tr><tr><td><b>Zn</b></td><td>1) Activator of enzymes (carbonic anhydrase). 2) Needed for auxin (IAA) and protein synthesis.</td></tr><tr><td><b>B</b></td><td>1) Cell wall formation and cell division. 2) Pollen germination, fruit setting and sugar movement.</td></tr></table></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>N: প্রোটিন ও ক্লোরোফিলের অংশ, গাছের সবুজ বৃদ্ধি। P: ATP ও নিউক্লিক অ্যাসিডের অংশ, শিকড় ও ফুল-ফল গঠন। K: উৎসেচক সক্রিয় করা, পত্ররন্ধ্র ও পানি নিয়ন্ত্রণ, রোগ প্রতিরোধ। S: সিস্টেইন-মিথিওনিন, ক্লোরোফিল ও তেল গঠন। Zn: উৎসেচক সক্রিয়, অক্সিন ও প্রোটিন তৈরি। B: কোষপ্রাচীর, পরাগরেণু অঙ্কুরোদগম ও ফল ধরা।</div>", "y": [[2025, "A4a", 3], [2024, "B3a", 3], [2023, "B3a", 3], [2021, "A2b", 3]], "m": "3", "c": 4, "sg": "", "st": 0, "top": false, "new": false}, {"id": "NU3", "t": "NU", "q": "Differentiate between macronutrients and micronutrients.", "bq": "ম্যাক্রো ও মাইক্রো পুষ্টি উপাদানের মধ্যে পার্থক্য লেখো।", "a": "<div class=\"tbw\"><table><tr><th>Point</th><th>Macronutrients</th><th>Micronutrients</th></tr><tr><td>Amount needed</td><td>Large (more than 0.1% of dry weight, 1000 mg/kg or more)</td><td>Small (less than 100 mg/kg dry weight)</td></tr><tr><td>Number</td><td>9: C, H, O, N, P, K, Ca, Mg, S</td><td>8: Fe, Mn, Zn, Cu, B, Mo, Cl, Ni</td></tr><tr><td>Also called</td><td>Major elements</td><td>Trace elements, minor elements</td></tr><tr><td>Fertilizer dose</td><td>Kilograms per hectare</td><td>Grams to few kg per hectare</td></tr><tr><td>Main role</td><td>Structure of cell, protein, energy, water balance</td><td>Enzyme activators, electron transfer, hormones</td></tr><tr><td>Deficiency–toxicity range</td><td>Wide; toxicity is rare</td><td>Very narrow; over-dose is toxic</td></tr><tr><td>Essentiality</td><td>Equally essential</td><td>Equally essential (only the amount is small)</td></tr><tr><td>Deficiency example</td><td>N: yellow old leaves; P: purple colour</td><td>Zn: khaira of rice; B: hollow stem</td></tr></table></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>ম্যাক্রো পুষ্টি (C, H, O, N, P, K, Ca, Mg, S) গাছ বেশি পরিমাণে (শুকনো ওজনের ০.১%-এর বেশি) নেয়, সার কেজি/হেক্টরে দিতে হয়। মাইক্রো পুষ্টি (Fe, Mn, Zn, Cu, B, Mo, Cl, Ni) খুব অল্প লাগে, কম-বেশির ব্যবধান সংকীর্ণ, বেশি দিলে বিষক্রিয়া হয়। দুই ধরনই সমান জরুরি।</div>", "y": [[2024, "A2a", 3], [2022, "A2b", 4], [2021, "B7", 3]], "m": "3 / 4", "c": 3, "sg": "", "st": 0, "top": false, "new": false}, {"id": "NU4", "t": "NU", "q": "What are essential plant nutrient elements? Write the criteria of essentiality.", "bq": "অত্যাবশ্যকীয় উদ্ভিদ পুষ্টি উপাদান কী? অত্যাবশ্যকতার শর্তগুলো লেখো।", "a": "<div class=\"df\">Essential plant nutrient elements are those chemical elements that plants need to complete their life cycle, and whose function cannot be done by any other element.<span class=\"src\"> — Arnon and Stout, 1939</span></div><p class=\"pp\"><b>Criteria of essentiality</b> (শর্ত):</p><div class=\"pt\"><span class=\"n\">1</span><div>Without the element the plant cannot complete its life cycle (vegetative and reproductive stages).</div></div><div class=\"pt\"><span class=\"n\">2</span><div>The function of the element cannot be replaced by another element.</div></div><div class=\"pt\"><span class=\"n\">3</span><div>The element must be directly involved in plant metabolism (nutrition), not by only removing a harmful condition of soil.</div></div><div class=\"pt\"><span class=\"n\">4</span><div>Its deficiency gives a specific symptom, which is cured only by supplying that element.</div></div><p class=\"pp\"><b>Count:</b> 17 essential elements (9 macro + 8 micro).</p><div class=\"sm\"><span class=\"smh\">সারকথা</span>অত্যাবশ্যকীয় উপাদান হলো যা ছাড়া উদ্ভিদ জীবনচক্র শেষ করতে পারে না। শর্ত: (১) অভাবে জীবনচক্র সম্পূর্ণ হয় না, (২) অন্য উপাদান তার কাজ করতে পারে না, (৩) সরাসরি উদ্ভিদের বিপাকে জড়িত, (৪) নির্দিষ্ট অভাব-লক্ষণ ও তা কেবল ওই উপাদানেই সারে। মোট ১৭টি (আর্নন ও স্টাউট, ১৯৩৯)।</div>", "y": [[2025, "A3a", 1], [2023, "B4a", 3]], "m": "1 / 3", "c": 2, "sg": "", "st": 0, "top": false, "new": false}, {"id": "NU5", "t": "NU", "q": "Where does chlorosis start (older or younger leaves) in N and S deficiency? Explain.", "bq": "N ও S এর অভাবে ক্লোরোসিস পুরনো না কচি পাতায় আগে দেখা দেয়? ব্যাখ্যা করো।", "a": "<div class=\"df\">Chlorosis is the yellowing of leaves because chlorophyll is not formed, usually from deficiency of a nutrient.</div><p class=\"pp\">Where chlorosis first appears depends on the <b>mobility</b> (গতিশীলতা) of the nutrient inside the plant:</p><div class=\"tbw\"><table><tr><th>Element</th><th>Mobility in plant</th><th>Chlorosis first on</th><th>Reason</th></tr><tr><td><b>N</b></td><td>Mobile</td><td><b>Older (lower) leaves</b>; tip first, V-shaped</td><td>The plant moves N from old leaves to young growing leaves</td></tr><tr><td><b>S</b></td><td>Immobile (not easily moved)</td><td><b>Younger (upper) leaves</b>; uniform yellow</td><td>S stays in old leaves, so young leaves starve</td></tr></table></div><div class=\"tipb\">N and S symptoms look alike, so check the leaf age: N = old leaves, S = young leaves.</div><div class=\"sm\"><span class=\"smh\">সারকথা</span>ক্লোরোসিস হলো ক্লোরোফিল না হয়ে পাতা হলুদ হওয়া। নাইট্রোজেন গাছের মধ্যে চলাচল করতে পারে, তাই অভাবে পুরোনো (নিচের) পাতা আগে হলুদ হয়। সালফার চলাচল করতে পারে না, তাই অভাবে কচি (উপরের) পাতা আগে হলুদ হয়।</div>", "y": [[2024, "B3b", 3], [2021, "A2c", 3]], "m": "3", "c": 2, "sg": "", "st": 0, "top": false, "new": false}, {"id": "NU6", "t": "NU", "q": "Write two deficiency symptoms each of S, Zn and B.", "bq": "S, Zn ও B এর অভাবজনিত দুটি করে লক্ষণ লেখো।", "a": "<div class=\"tbw\"><table><tr><th>Element</th><th>Deficiency symptoms (two each)</th></tr><tr><td><b>S</b></td><td>1) Yellowing (chlorosis) of young leaves, whole leaf pale. 2) Stunted growth, thin stem, late maturity.</td></tr><tr><td><b>Zn</b></td><td>1) Interveinal chlorosis, small leaves (little leaf), short internodes (rosette). 2) Khaira disease in rice (brown rusty spots, stunted); white bud in maize.</td></tr><tr><td><b>B</b></td><td>1) Death of growing tip (terminal bud), thick brittle leaves. 2) Hollow or cracked stem, poor flowering and fruit setting (sterility); e.g. heart rot of beet, hollow stem of cauliflower.</td></tr></table></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>S অভাবে কচি পাতা ফ্যাকাশে হলুদ ও গাছ খর্বাকৃতি হয়। Zn অভাবে পাতা ছোট, গিঁট খাটো, ধানে খয়রা রোগ ও ভুট্টায় সাদা কুঁড়ি দেখা যায়। B অভাবে ডগা মরে যায়, কাণ্ড ফাঁপা বা ফাটা হয়, ফুল-ফল ঠিকমতো ধরে না।</div>", "y": [[2025, "A4b", 3]], "m": "3", "c": 1, "sg": "", "st": 0, "top": false, "new": false}, {"id": "FT1", "t": "FT", "q": "Differentiate between soil fertility and soil productivity.", "bq": "মাটির উর্বরতা ও উৎপাদনশীলতার মধ্যে পার্থক্য লেখো।", "a": "<div class=\"df\"><b>Soil fertility</b> is the capacity of a soil to supply essential plant nutrients in adequate amounts and in balanced proportion.</div><div class=\"df\"><b>Soil productivity</b> is the capacity of a soil to produce crops (yield per unit area) under a specified system of management.</div><div class=\"tbw\"><table><tr><th>Point</th><th>Fertility</th><th>Productivity</th></tr><tr><td>Meaning</td><td>Nutrient supplying power</td><td>Crop producing power</td></tr><tr><td>Nature</td><td>Inherent (potential) capacity</td><td>Actual output</td></tr><tr><td>Depends on</td><td>Nutrient content and balance only</td><td>Fertility + water, climate, drainage, pests, variety, management</td></tr><tr><td>Scope</td><td>Narrow; one part of productivity</td><td>Broad; includes fertility</td></tr><tr><td>Measured by</td><td>Soil test (nutrient content)</td><td>Crop yield (kg/ha)</td></tr><tr><td>Relation</td><td>A fertile soil may not be productive</td><td>A productive soil is generally fertile</td></tr></table></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>উর্বরতা হলো মাটির পর্যাপ্ত ও সুষম পুষ্টি জোগানোর ক্ষমতা (সুপ্ত ক্ষমতা)। উৎপাদনশীলতা হলো নির্দিষ্ট ব্যবস্থাপনায় ফসল ফলানোর ক্ষমতা (প্রকৃত ফলন)। উর্বরতা উৎপাদনশীলতার একটি অংশ; উৎপাদনশীলতায় পানি, জলবায়ু, রোগ-পোকা ও ব্যবস্থাপনাও যুক্ত।</div>", "y": [[2025, "B5a", 3], [2023, "B5b", 4], [2021, "A7b", 5]], "m": "3 / 4 / 5", "c": 3, "sg": "", "st": 0, "top": true, "new": false}, {"id": "FT2", "t": "FT", "q": "Write the phosphatic fertilizers used in Bangladesh with formula and nutrient content.", "bq": "বাংলাদেশে ব্যবহৃত ফসফেটিক সারের নাম, সংকেত ও পুষ্টি উপাদানের পরিমাণ লেখো।", "a": "<div class=\"tbw\"><table><tr><th>Fertilizer</th><th>Formula</th><th>Nutrient content</th></tr><tr><td><b>TSP</b> (Triple super phosphate)</td><td>Ca(H<sub>2</sub>PO<sub>4</sub>)<sub>2</sub>·H<sub>2</sub>O</td><td>46% P<sub>2</sub>O<sub>5</sub> (≈ 20% P); also Ca</td></tr><tr><td><b>DAP</b> (Diammonium phosphate)</td><td>(NH<sub>4</sub>)<sub>2</sub>HPO<sub>4</sub></td><td>18% N and 46% P<sub>2</sub>O<sub>5</sub> (≈ 20% P)</td></tr><tr><td><b>SSP</b> (Single super phosphate)</td><td>Ca(H<sub>2</sub>PO<sub>4</sub>)<sub>2</sub> + CaSO<sub>4</sub></td><td>16–20% P<sub>2</sub>O<sub>5</sub> (≈ 8–9% P); ≈ 12% S, Ca</td></tr><tr><td><b>Rock phosphate</b></td><td>Ca<sub>3</sub>(PO<sub>4</sub>)<sub>2</sub> / apatite</td><td>25–30% P<sub>2</sub>O<sub>5</sub> (slow, for acid soil)</td></tr></table></div><div class=\"tipb\">P = P<sub>2</sub>O<sub>5</sub> × 0.436. TSP is the main P fertilizer in Bangladesh; DAP is also common.</div><div class=\"sm\"><span class=\"smh\">সারকথা</span>বাংলাদেশে ফসফেট সার: টিএসপি Ca(H₂PO₄)₂·H₂O (৪৬% P₂O₅, প্রায় ২০% P), ডিএপি (NH₄)₂HPO₄ (১৮% N + ৪৬% P₂O₅), এসএসপি (১৬–২০% P₂O₅, সাথে S ও Ca) ও রক ফসফেট (২৫–৩০% P₂O₅)। P = P₂O₅ × ০.৪৩৬।</div>", "y": [[2025, "B5b", 3]], "m": "3", "c": 1, "sg": "", "st": 0, "top": false, "new": false}, {"id": "FT3", "t": "FT", "q": "Write six fertilizers used in Bangladesh with formula and nutrient content.", "bq": "বাংলাদেশে ব্যবহৃত ছয়টি সারের নাম, সংকেত ও পুষ্টি উপাদানের পরিমাণ লেখো।", "a": "<div class=\"tbw\"><table><tr><th>Fertilizer</th><th>Formula</th><th>Nutrient content</th></tr><tr><td><b>Urea</b></td><td>CO(NH<sub>2</sub>)<sub>2</sub></td><td>46% N</td></tr><tr><td><b>TSP</b></td><td>Ca(H<sub>2</sub>PO<sub>4</sub>)<sub>2</sub>·H<sub>2</sub>O</td><td>46% P<sub>2</sub>O<sub>5</sub> (≈ 20% P)</td></tr><tr><td><b>MoP</b> (Muriate of potash)</td><td>KCl</td><td>60% K<sub>2</sub>O (≈ 50% K)</td></tr><tr><td><b>Gypsum</b></td><td>CaSO<sub>4</sub>·2H<sub>2</sub>O</td><td>≈ 18% S, 23% Ca</td></tr><tr><td><b>Zinc sulphate</b></td><td>ZnSO<sub>4</sub>·H<sub>2</sub>O / ZnSO<sub>4</sub>·7H<sub>2</sub>O</td><td>36% Zn (monohydrate) / ≈ 22% Zn (heptahydrate)</td></tr><tr><td><b>Borax</b></td><td>Na<sub>2</sub>B<sub>4</sub>O<sub>7</sub>·10H<sub>2</sub>O</td><td>≈ 11% B</td></tr><tr><td>DAP</td><td>(NH<sub>4</sub>)<sub>2</sub>HPO<sub>4</sub></td><td>18% N, 46% P<sub>2</sub>O<sub>5</sub></td></tr><tr><td>Ammonium sulphate</td><td>(NH<sub>4</sub>)<sub>2</sub>SO<sub>4</sub></td><td>21% N, 24% S</td></tr></table></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>ছয়টি সার: ইউরিয়া (৪৬% N), টিএসপি (৪৬% P₂O₅), এমওপি KCl (৬০% K₂O), জিপসাম CaSO₄·2H₂O (১৮% S), জিংক সালফেট (৩৬% Zn মনোহাইড্রেট) ও বোরাক্স Na₂B₄O₇·10H₂O (১১% B)। ডিএপি ও অ্যামোনিয়াম সালফেটও ব্যবহৃত হয়।</div>", "y": [[2024, "B5b", 3]], "m": "3", "c": 1, "sg": "", "st": 0, "top": false, "new": false}, {"id": "FT4", "t": "FT", "q": "Differentiate between manures and fertilizers.", "bq": "জৈবসার (ম্যানিউর) ও রাসায়নিক সারের মধ্যে পার্থক্য লেখো।", "a": "<div class=\"tbw\"><table><tr><th>Point</th><th>Manure</th><th>Fertilizer</th></tr><tr><td>Origin</td><td>Organic: dung, compost, green manure, residues</td><td>Inorganic (chemical), made in factory</td></tr><tr><td>Nutrient content</td><td>Low and variable; many nutrients including micronutrients</td><td>High and known (e.g. urea 46% N)</td></tr><tr><td>Quantity used</td><td>Large (tons per hectare)</td><td>Small (kg per hectare)</td></tr><tr><td>Nutrient release</td><td>Slow, long lasting (residual effect)</td><td>Fast, quick effect</td></tr><tr><td>Organic matter</td><td>Adds humus, improves structure and water holding</td><td>Adds none; may harm soil if overused</td></tr><tr><td>Soil life</td><td>Feeds microbes</td><td>Little effect on microbes</td></tr><tr><td>Handling and cost</td><td>Bulky, hard to carry and store</td><td>Easy to carry, store and apply; costly</td></tr></table></div><div class=\"sm\"><span class=\"smh\">সারকথা</span>জৈবসার (গোবর, কম্পোস্ট, সবুজ সার) জীবজ উৎসের, পুষ্টি কম কিন্তু অনেক ধরনের, ধীরে ছাড়ে, বেশি পরিমাণ লাগে, মাটির জৈব পদার্থ ও গঠন উন্নত করে। রাসায়নিক সার কারখানায় তৈরি, পুষ্টি বেশি ও নির্দিষ্ট, দ্রুত কাজ করে, অল্প লাগে, কিন্তু জৈব পদার্থ যোগ করে না।</div>", "y": [[2024, "B5a", 3]], "m": "3", "c": 1, "sg": "", "st": 0, "top": false, "new": false}, {"id": "FT5", "t": "FT", "q": "Write the nitrogenous fertilizers used in Bangladesh.", "bq": "বাংলাদেশে ব্যবহৃত নাইট্রোজেনযুক্ত সারগুলো লেখো।", "a": "<div class=\"tbw\"><table><tr><th>Fertilizer</th><th>Formula</th><th>N content</th></tr><tr><td><b>Urea</b></td><td>CO(NH<sub>2</sub>)<sub>2</sub></td><td>46% N (most used)</td></tr><tr><td><b>Ammonium sulphate</b></td><td>(NH<sub>4</sub>)<sub>2</sub>SO<sub>4</sub></td><td>21% N + 24% S</td></tr><tr><td><b>DAP</b></td><td>(NH<sub>4</sub>)<sub>2</sub>HPO<sub>4</sub></td><td>18% N + 46% P<sub>2</sub>O<sub>5</sub></td></tr><tr><td><b>Ammonium nitrate</b></td><td>NH<sub>4</sub>NO<sub>3</sub></td><td>33–34% N</td></tr><tr><td><b>Ammonium chloride</b></td><td>NH<sub>4</sub>Cl</td><td>26% N</td></tr></table></div><p class=\"pp\">Urea is the main N fertilizer of Bangladesh (also as urea super granule, USG, placed deep in rice fields).</p><div class=\"sm\"><span class=\"smh\">সারকথা</span>বাংলাদেশে নাইট্রোজেন সার: ইউরিয়া CO(NH₂)₂ (৪৬% N, সবচেয়ে বেশি ব্যবহৃত), অ্যামোনিয়াম সালফেট (২১% N, ২৪% S), ডিএপি (১৮% N) ও অ্যামোনিয়াম নাইট্রেট (৩৩–৩৪% N)। ধানে ইউরিয়া সুপার গ্র্যানিউল (USG) গভীরে বসানো হয়।</div>", "y": [[2023, "B5a", 2]], "m": "2", "c": 1, "sg": "", "st": 0, "top": false, "new": false}, {"id": "FT6", "t": "FT", "q": "\"A fertile soil may not be productive\" — explain.", "bq": "\"উর্বর মাটি উৎপাদনশীল নাও হতে পারে\" — ব্যাখ্যা করো।", "a": "<p class=\"pp\"><b>Explanation:</b> Fertility only means the soil has enough nutrients. A crop also needs water, air, suitable temperature, no toxic substance and good management. If any one is wrong, a fertile soil gives a poor yield.</p><div class=\"pt\"><span class=\"n\">1</span><div><b>Drought or waterlogging:</b> nutrients are there but roots cannot use them.</div></div><div class=\"pt\"><span class=\"n\">2</span><div><b>Salinity or alkalinity:</b> salts stop water uptake (coastal fertile alluvium, but saline).</div></div><div class=\"pt\"><span class=\"n\">3</span><div><b>Toxic substances:</b> high Al, Fe<sup>2+</sup>, H<sub>2</sub>S harm roots.</div></div><div class=\"pt\"><span class=\"n\">4</span><div>Poor aeration, hard pan, shallow depth or compaction.</div></div><div class=\"pt\"><span class=\"n\">5</span><div>Unsuitable climate or temperature; pests, diseases and weeds.</div></div><div cl const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let done=new Set(store.get('ssc101done')||[]);

const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function plain(h){return h.replace(/<[^>]+>/g,' ')}
D.Q.forEach(x=>x.txt=(x.id+' '+x.q+' '+x.bq+' '+(x.sg||'')+' '+plain(x.a)).toLowerCase());
function hl(ws){if(!ws.length)return;const re=new RegExp('('+ws.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');document.querySelectorAll('#list .qt,#list .bq,#list .body').forEach(el=>{const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);const ns=[];while(w.nextNode())ns.push(w.currentNode);ns.forEach(n=>{if(n.parentNode.closest('label,mark'))return;if(!re.test(n.nodeValue))return;re.lastIndex=0;const sp=document.createElement('span');sp.innerHTML=esc(n.nodeValue).replace(re,'<mark>$1</mark>');n.replaceWith(...sp.childNodes)})})}
function stars(n){return n?' '+'★'.repeat(n):''}
function card(x){
 const yrs=x.y.map(y=>`<span><b>${y[0]}</b> ${y[1]} · ${y[2]}m</span>`).join('');
 const badges=[`<span class="id">${x.id}</span>`,x.new?'<span class="bd nw">NEW TOPIC</span>':`<span class="bd">${x.c>1?x.c+'× asked':'asked once'}</span>`,`<span class="bd">Marks ${x.m}</span>`,x.sg?`<span class="bd sg">★ Suggestion${stars(x.st)} · ${esc(x.sg)}</span>`:''].join('');
 return `<details class="card ${x.t}${x.top?' top':''}${done.has(x.id)?' done':''}" id="${x.id}" ${st.open?'open':''}><summary>${x.top?'<div class="ribn">★ Most expected in this topic</div>':''}<div class="meta">${badges}</div><div class="qt">${esc(x.q)}</div><div class="bq">${esc(x.bq)}</div>${yrs?`<div class="yrs">${yrs}</div>`:''}</summary><div class="body">${x.a}<div class="tools"><label class="dn"><input type="checkbox" data-id="${x.id}" ${done.has(x.id)?'checked':''}> Finished reading</label></div></div></details>`;
}
function render(){
 const ws=st.q.trim().toLowerCase().split(/\s+/).filter(Boolean);const q=ws.length;
 const base=D.Q.filter(x=>(st.t==='A'||x.t===st.t)&&(!st.sug||x.c>=4)&&(!st.rep||x.c>=2)&&(!st.hide||!done.has(x.id)));let partial=false;let list=base.filter(x=>!q||ws.every(w=>x.txt.includes(w)));if(q&&!list.length&&ws.length>1){list=base.filter(x=>ws.some(w=>x.txt.includes(w)));partial=list.length>0}
 let h='',last='';
 list.forEach(x=>{if(x.t!==last){last=x.t;const n=D.Q.filter(y=>y.t===x.t).length;h+=`<div class="sect ${x.t}" id="sec-${x.t}"><h2>${NAMES[x.t][0]}</h2><span>${NAMES[x.t][1]} · ${n} questions · most asked first</span></div>`}h+=card(x)});
 $('#list').innerHTML=h||'<div class="empty"><b>No question found</b>Try a shorter word, another spelling, or tap a quick topic above.</div>';
 $('#rv').hidden=!!(q||st.sug||st.rep||st.hide||st.t!=='A');
 $('#qc').hidden=!q;document.querySelectorAll('.qk').forEach(b=>press(b,q&&st.q.trim().toLowerCase()===b.dataset.q.toLowerCase()));
 if(q)hl(ws);
 $('#cnt').textContent=(q?`${list.length} result${list.length===1?'':'s'} for “${st.q.trim()}”${partial?' (partial matches)':''}`:`${list.length} of ${D.Q.length} questions shown`)+` · ${done.size} finished`;
 $('#stats').innerHTML=`<span><b>${D.Q.length}</b> questions</span><span><b>${D.Q.filter(x=>x.c>=4).length}</b> asked 4× or more</span><span><b>${D.Q.filter(x=>x.c>=2).length}</b> asked 2× or more</span><span><b>${done.size}</b> finished</span>`;
}
function press(b,v){b.setAttribute('aria-pressed',v)}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;st.t=b.dataset.t;[...$('#tabs').children].forEach(c=>press(c,c===b));render()});
$('#fsug').onclick=e=>{st.sug=!st.sug;press(e.target,st.sug);render()};
$('#frep').onclick=e=>{st.rep=!st.rep;press(e.target,st.rep);render()};
$('#fdone').onclick=e=>{st.hide=!st.hide;press(e.target,st.hide);render()};
$('#expand').onclick=e=>{st.open=!st.open;e.target.textContent=st.open?'Close all':'Open all';document.querySelectorAll('details.card').forEach(d=>d.open=st.open)};
function runSearch(v,scroll){st.q=v;$('#q').value=v;render();if(st.q.trim()){const l=document.querySelectorAll('details.card');if(l.length<=6)l.forEach(d=>d.open=true);if(scroll){const m=$('#list').getBoundingClientRect().top+scrollY-($('.bar').offsetHeight+10);if(scrollY>m||scrollY<m-40)scrollTo({top:Math.max(0,m)})}}}
let tm;$('#q').addEventListener('input',e=>{clearTimeout(tm);tm=setTimeout(()=>runSearch(e.target.value,true),60)});

$('#quick').addEventListener('click',e=>{const b=e.target.closest('.qk');if(!b)return;const on=st.q.trim().toLowerCase()===b.dataset.q.toLowerCase();st.t='A';[...$('#tabs').children].forEach((c,i)=>press(c,i===0));runSearch(on?'':b.dataset.q,true)});
const up=$('#up');addEventListener('scroll',()=>{up.style.display=scrollY>500?'grid':'none'},{passive:true});up.onclick=e=>{e.preventDefault();scrollTo({top:0,behavior:'smooth'})};
$('#list').addEventListener('change',e=>{const c=e.target.closest('input[data-id]');if(!c)return;const id=c.dataset.id;c.checked?done.add(id):done.delete(id);store.set('ssc101done',[...done]);c.closest('details').classList.toggle('done',c.checked);$('#cnt').textContent=$('#cnt').textContent.replace(/\d+ finished/,done.size+' finished');$('#stats').lastElementChild.innerHTML=`<b>${done.size}</b> finished`});
$('#theme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('ssc101theme',r.dataset.theme)}catch(e){}};
// revision box
$('#rv').innerHTML=`<details class="rvbox"><summary class="rvh">✎ Last-night revision · one line per topic (tap to open)</summary>${D.RV.map(r=>`<div class="rvi"><div><p><b>${r.t}</b></p><p>${r.d}</p><div class="ids">${r.ids.map(i=>`<a href="#${i}" data-go="${i}">${i}</a>`).join('')}</div></div></div>`).join('')}</details>`;
$('#rv').addEventListener('click',e=>{const a=e.target.closest('a[data-go]');if(!a)return;e.preventDefault();st.t='A';st.sug=st.rep=st.hide=false;st.q='';$('#q').value='';[...$('#tabs').children].forEach((c,i)=>press(c,i===0));['fsug','frep','fdone'].forEach(i=>press($('#'+i),false));render();const d=document.getElementById(a.dataset.go);if(d){d.open=true;d.scrollIntoView({block:'start'})}});
(function(){const c={A:D.Q.length};D.Q.forEach(x=>c[x.t]=(c[x.t]||0)+1);document.querySelectorAll('#tabs button').forEach(b=>b.innerHTML+=` <small style="opacity:.75">${c[b.dataset.t]}</small>`)})();
render();
try{const p=new URLSearchParams(location.search).get('q');if(p){runSearch(p,false);setTimeout(()=>{const m=$('#list').getBoundingClientRect().top+scrollY-($('.bar').offsetHeight+10);scrollTo({top:Math.max(0,m)})},120)}}catch(e){}
</script>
